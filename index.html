<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>PEARS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="SATOLINAPP1.svg">
<link rel="apple-touch-icon" href="icon-apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>

/* ── Login ── */
#login-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  padding: var(--s-6);
  gap: var(--s-7);
}
#login-screen.hidden { display: none; }

.login-wordmark {
  text-align: center;
}
.login-wordmark .logotype {
  font-size: 48px;
  font-weight: var(--w-thin);
  letter-spacing: 16px;
  text-transform: uppercase;
  color: var(--text);
  line-height: 1;
  margin-bottom: var(--s-2);
}
.login-wordmark .tagline {
  font-size: var(--text-label);
  font-weight: var(--w-medium);
  text-transform: uppercase;
  letter-spacing: 3px;
  color: var(--muted);
}

.login-btn-google {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-3) var(--s-5);
  border: 1px solid var(--border2);
  border-radius: var(--r-md);
  background: var(--panel);
  color: var(--text);
  font-size: var(--text-body);
  font-weight: var(--w-medium);
  cursor: pointer;
  transition: background var(--anim-micro), border-color var(--anim-micro);
  white-space: nowrap;
  font-family: var(--font);
}
.login-btn-google:hover {
  background: var(--raised);
}
.login-btn-google svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.login-footer {
  font-size: var(--text-meta);
  color: var(--dim);
  text-align: center;
}

/* ── App ── */
#app {
  display: none;
  flex-direction: column;
  min-height: 100dvh;
}
#app.active { display: flex; }

.home-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: var(--s-4);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.home-wordmark {
  font-size: var(--text-title);
  font-weight: var(--w-thin);
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--text);
}
.home-avatar {
  width: 30px;
  height: 30px;
  border-radius: var(--r-pill);
  border: 1px solid var(--border2);
  object-fit: cover;
  cursor: pointer;
  transition: border-color var(--anim-micro);
  background: var(--raised);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: var(--w-medium);
  color: var(--muted);
  flex-shrink: 0;
  overflow: hidden;
}
.home-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.home-body {
  flex: 1;
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  padding: var(--s-5) var(--s-4);
  padding-bottom: var(--s-7);
}

.home-greeting {
  margin-bottom: var(--s-6);
}
.home-greeting .t-display {
  margin-bottom: 4px;
}

/* Module grid */
.module-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s-3);
}

.module-card {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--s-4);
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
  transition: background var(--anim-micro);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  min-height: 96px;
}
.module-card:hover  { background: var(--raised); }
.module-card:active { background: var(--active);  }

.module-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--m-accent, var(--border));
}

.module-dot {
  width: 7px;
  height: 7px;
  border-radius: var(--r-pill);
  background: var(--m-accent, var(--border));
  margin-bottom: var(--s-1);
}

.module-name {
  font-size: var(--text-label);
  font-weight: var(--w-medium);
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text);
}

.module-desc {
  font-size: var(--text-meta);
  color: var(--muted);
  line-height: 1.4;
}

.module-card.wide {
  grid-column: 1 / -1;
  flex-direction: row;
  align-items: center;
  gap: var(--s-4);
  min-height: auto;
}
.module-card.wide .module-dot { margin-bottom: 0; flex-shrink: 0; }
.module-card.wide .module-body { flex: 1; }

/* User menu */
.menu-bg {
  position: fixed; inset: 0; z-index: 90; display: none;
}
.menu-bg.open { display: block; }
.user-menu {
  position: fixed;
  top: 52px; right: var(--s-4);
  z-index: 91;
  background: var(--panel);
  border: 1px solid var(--border2);
  border-radius: var(--r-lg);
  min-width: 200px;
  overflow: hidden;
  display: none;
  animation: slideUp var(--anim-fast) forwards;
}
.user-menu.open { display: block; }
.menu-info {
  padding: var(--s-3) var(--s-4);
  border-bottom: 1px solid var(--border);
}
.menu-name  { font-size: var(--text-body); font-weight: var(--w-medium); }
.menu-email { font-size: var(--text-meta); color: var(--muted); margin-top: 2px; }
.menu-item {
  display: flex; align-items: center;
  padding: var(--s-3) var(--s-4);
  font-size: var(--text-body);
  color: var(--muted);
  cursor: pointer;
  transition: background var(--anim-micro), color var(--anim-micro);
  font-family: var(--font);
  background: none; border: none; width: 100%; text-align: left;
}
.menu-item:hover { background: var(--raised); color: var(--text); }
.menu-item.danger { color: var(--err); }
.menu-item.danger:hover { background: rgba(255,45,45,.06); }

</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-wordmark">
    <div class="logotype">PEARS</div>
    <div class="tagline">Household &middot; Finance &middot; Travel</div>
  </div>

  <button class="login-btn-google" onclick="Auth.login()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Continuar con Google
  </button>

  <div class="login-footer">Santi &amp; Caro &middot; 2026</div>
</div>

<!-- APP -->
<div id="app">

  <header class="home-header">
    <span class="home-wordmark">PEARS</span>
    <div class="home-avatar" id="avatar-btn" onclick="toggleMenu()">
      <span id="avatar-initials"></span>
    </div>
  </header>

  <div class="menu-bg" id="menu-bg" onclick="closeMenu()"></div>
  <div class="user-menu" id="user-menu">
    <div class="menu-info">
      <div class="menu-name"  id="menu-name"></div>
      <div class="menu-email" id="menu-email"></div>
    </div>
    <button class="menu-item danger" onclick="Auth.logout()">Cerrar sesión</button>
  </div>

  <main class="home-body">

    <div class="home-greeting">
      <div class="t-display" id="greeting-text">Hola.</div>
      <div class="t-meta" id="greeting-date"></div>
    </div>

    <div class="module-grid">

      <a class="module-card" href="compras/index.html"
         style="--m-accent: var(--accent-compras)">
        <div class="module-dot"></div>
        <div class="module-name">Compras</div>
        <div class="module-desc">Listas compartidas</div>
      </a>

      <a class="module-card" href="finanzas/index.html"
         style="--m-accent: var(--accent-hogar)">
        <div class="module-dot"></div>
        <div class="module-name">Hogar</div>
        <div class="module-desc">Gastos en común</div>
      </a>

      <a class="module-card" href="viajes/index.html"
         style="--m-accent: var(--accent-viajes)">
        <div class="module-dot"></div>
        <div class="module-name">Viajes</div>
        <div class="module-desc">Itinerarios</div>
      </a>

      <a class="module-card" href="prestamos/index.html"
         style="--m-accent: var(--accent-prestamos)">
        <div class="module-dot"></div>
        <div class="module-name">Préstamos</div>
        <div class="module-desc">Quién le debe a quién</div>
      </a>

      <a class="module-card wide" href="finanzas-personales/index.html"
         style="--m-accent: var(--accent-personal)">
        <div class="module-dot"></div>
        <div class="module-body">
          <div class="module-name">Finanzas Personales</div>
          <div class="module-desc">Cuentas, ingresos y gastos propios</div>
        </div>
      </a>

    </div>
  </main>

</div>

<div id="flash-wrap"></div>

<script src="shared/auth.js"></script>
<script src="shared/api.js"></script>
<script>

Auth.onReady(user => {
  const login = document.getElementById('login-screen');
  const app   = document.getElementById('app');

  if (!user) {
    login.classList.remove('hidden');
    return;
  }

  login.classList.add('hidden');
  app.classList.add('active');

  /* Avatar */
  const avatarBtn = document.getElementById('avatar-btn');
  if (user.avatar) {
    const img = document.createElement('img');
    img.src = user.avatar;
    img.alt = user.nombre;
    avatarBtn.innerHTML = '';
    avatarBtn.appendChild(img);
  } else {
    document.getElementById('avatar-initials').textContent =
      user.nombre.charAt(0).toUpperCase();
  }

  /* Menu */
  document.getElementById('menu-name').textContent  = user.nombre;
  document.getElementById('menu-email').textContent = user.email;

  /* Greeting */
  const firstName = user.nombre.split(' ')[0];
  const h = new Date().getHours();
  const saludo = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  document.getElementById('greeting-text').textContent = saludo + ', ' + firstName + '.';

  const hoy = new Date().toLocaleDateString('es-PY', {
    weekday: 'long', day: 'numeric', month: 'long'
  });
  document.getElementById('greeting-date').textContent =
    hoy.charAt(0).toUpperCase() + hoy.slice(1);
});

function toggleMenu() {
  const m = document.getElementById('user-menu');
  const b = document.getElementById('menu-bg');
  const open = m.classList.toggle('open');
  b.classList.toggle('open', open);
}
function closeMenu() {
  document.getElementById('user-menu').classList.remove('open');
  document.getElementById('menu-bg').classList.remove('open');
}

</script>
</body>
</html>
