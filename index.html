<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PEARS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="SATOLINAPP1.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared/auth.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #fff; color: #000; min-height: 100dvh; }

/* ── Login ── */
#login {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100dvh; gap: 32px;
}
#login.hidden { display: none; }
.login-title { font-size: 28px; font-weight: 300; letter-spacing: 8px; }
.login-btn {
  padding: 10px 24px; border: 1px solid #ccc; border-radius: 6px;
  background: #fff; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px;
}
.login-btn:hover { background: #f5f5f5; }

/* ── App ── */
#app { display: none; flex-direction: column; min-height: 100dvh; }
#app.active { display: flex; }

header {
  position: sticky; top: 0; background: #fff; border-bottom: 1px solid #e5e5e5;
  padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
  z-index: 50;
}
.header-logo { font-size: 13px; letter-spacing: 4px; font-weight: 400; }
.header-avatar {
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ddd;
  background: #f0f0f0; cursor: pointer; overflow: hidden;
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500;
}

main { padding: 24px 16px; max-width: 480px; width: 100%; margin: 0 auto; }
.greeting { font-size: 28px; font-weight: 300; margin-bottom: 8px; }
.greeting-date { font-size: 13px; color: #666; margin-bottom: 32px; }

/* ── Module list ── */
.modules { display: flex; flex-direction: column; gap: 8px; }
.module-card {
  display: block; padding: 16px 16px 16px 20px;
  border: 1px solid #e5e5e5; border-radius: 8px; text-decoration: none; color: #000;
  position: relative; background: #fff;
}
.module-card:hover { background: #fafafa; }
.module-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 4px; border-radius: 8px 0 0 8px;
  background: var(--c);
}
.module-name { font-size: 15px; font-weight: 500; margin-bottom: 2px; }
.module-desc { font-size: 12px; color: #666; }

/* ── User menu ── */
#menu-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:900 }
#menu-panel {
  display:none;position:fixed;top:0;right:0;bottom:0;width:260px;
  background:#fff;border-left:1px solid #e5e5e5;z-index:901;flex-direction:column;
}
#menu-panel.open, #menu-overlay.open { display:flex; }
#menu-overlay.open { display:block; }
.menu-profile { padding:20px 16px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:12px }
.menu-avatar { width:40px;height:40px;border-radius:50%;overflow:hidden;background:#f0f0f0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500 }
.menu-avatar img { width:100%;height:100%;object-fit:cover }
.menu-uname { font-size:14px;font-weight:600 }
.menu-email { font-size:12px;color:#666;margin-top:2px }
.menu-links { flex:1;overflow-y:auto }
.menu-item { display:block;padding:13px 16px;text-decoration:none;color:#333;border-bottom:1px solid #f0f0f0;font-size:14px }
.menu-item:hover { background:#fafafa }
.menu-bottom { border-top:1px solid #f0f0f0 }
.menu-logout { display:block;width:100%;padding:13px 16px;text-align:left;background:none;border:none;color:#e00;cursor:pointer;font-size:14px }
</style>
</head>
<body>

<!-- Login -->
<div id="login" style="display:none">
  <div class="login-title">PEARS</div>
  <button class="login-btn" onclick="Auth.login()">
    <svg width="16" height="16" viewBox="0 0 24 24">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Continuar con Google
  </button>
</div>

<!-- App -->
<div id="app">
  <header>
    <span class="header-logo">PEARS</span>
    <div class="header-avatar" id="avatar-btn" onclick="menuOpen()">
      <span id="avatar-initial"></span>
    </div>
  </header>

  <!-- User menu -->
  <div id="menu-overlay" onclick="menuClose()"></div>
  <div id="menu-panel" id="menu-panel">
    <div class="menu-profile">
      <div class="menu-avatar" id="menu-avatar"><span id="menu-initial"></span></div>
      <div>
        <div class="menu-uname" id="menu-name"></div>
        <div class="menu-email" id="menu-email"></div>
      </div>
    </div>
    <div class="menu-links">
      <a class="menu-item" href="compras/">Compras</a>
      <a class="menu-item" href="finanzas/">Hogar</a>
      <a class="menu-item" href="viajes/">Viajes</a>
      <a class="menu-item" href="prestamos/">Préstamos</a>
      <a class="menu-item" href="finanzas-personales/">Personal</a>
    </div>
    <div class="menu-bottom">
      <a class="menu-item" href="audit/" style="color:#666;font-size:13px">Audit Log</a>
      <button class="menu-logout" onclick="Auth.logout()">Cerrar sesión</button>
    </div>
  </div>

  <main>
    <div class="greeting" id="greeting">Hola.</div>
    <div class="greeting-date" id="greeting-date"></div>

    <div class="modules">
      <a class="module-card" href="compras/"   style="--c:#FF2D2D"><div class="module-name">Compras</div><div class="module-desc">Lista de compras compartida</div></a>
      <a class="module-card" href="finanzas/"  style="--c:#FF6B00"><div class="module-name">Hogar</div><div class="module-desc">Finanzas del hogar</div></a>
      <a class="module-card" href="viajes/"    style="--c:#FFE500"><div class="module-name">Viajes</div><div class="module-desc">Itinerarios</div></a>
      <a class="module-card" href="prestamos/" style="--c:#39FF5A"><div class="module-name">Préstamos</div><div class="module-desc">Préstamos entre pareja o a terceros</div></a>
      <a class="module-card" href="finanzas-personales/" style="--c:#00AAFF"><div class="module-name">Personal</div><div class="module-desc">Finanzas personales</div></a>
    </div>
  </main>
</div>

<script>
Auth.onReady(user => {
  if (!user) {
    document.getElementById('login').style.display = 'flex';
    return;
  }
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').classList.add('active');

  const first = user.nombre.split(' ')[0];
  const h = new Date().getHours();
  const saludo = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  document.getElementById('greeting').textContent = saludo + ', ' + first + '.';
  document.getElementById('greeting-date').textContent = new Date().toLocaleDateString('es-PY', { weekday:'long', day:'numeric', month:'long' });

  // Avatar button
  const btn = document.getElementById('avatar-btn');
  if (user.avatar) {
    btn.innerHTML = `<img src="${user.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  } else {
    document.getElementById('avatar-initial').textContent = first.charAt(0);
  }

  // Menu
  document.getElementById('menu-name').textContent  = first;
  document.getElementById('menu-email').textContent = user.email;
  const ma = document.getElementById('menu-avatar');
  if (user.avatar) {
    ma.innerHTML = `<img src="${user.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  } else {
    document.getElementById('menu-initial').textContent = first.charAt(0);
  }
});

function menuOpen()  { document.getElementById('menu-panel').classList.add('open'); document.getElementById('menu-overlay').classList.add('open'); }
function menuClose() { document.getElementById('menu-panel').classList.remove('open'); document.getElementById('menu-overlay').classList.remove('open'); }
</script>
</body>
</html>
