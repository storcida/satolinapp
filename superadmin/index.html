<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PEARS · Superadmin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Rock+Salt&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--s1:#080808;--s2:#111;--s3:#161616;
  --border:#1a1a1a;--border2:#2a2a2a;
  --text:#fff;--muted:#666;--dim:#333;--accent:#8dd900;
  --err:#ef4444;--ok:#22c55e;--warn:#F59E0B;
  --font:'Inter',-apple-system,sans-serif;
  --mono:'SF Mono','Fira Code',monospace;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100dvh;-webkit-font-smoothing:antialiased}

.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;height:52px;background:var(--bg);border-bottom:1px solid var(--border);padding:0 16px;gap:12px}
.topbar-logo{font-family:'Rock Salt',cursive;font-size:13px;color:var(--accent)}
.topbar-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:3px;flex:1}
.topbar-badge{font-size:9px;font-weight:500;letter-spacing:2px;text-transform:uppercase;padding:4px 8px;border-radius:4px;background:rgba(239,68,68,.1);color:var(--err);border:1px solid rgba(239,68,68,.2)}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;text-decoration:none;transition:color 120ms}
.back-btn:hover{color:var(--text)}

.content{padding:0 0 80px;max-width:800px;margin:0 auto}
.section-label{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:3px;color:var(--muted);padding:20px 16px 10px}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.stat{padding:16px;background:var(--bg)}
.stat-val{font-size:24px;font-weight:200;letter-spacing:-1px;color:var(--text)}
.stat-label{font-size:10px;font-weight:400;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-top:4px}

/* Household rows */
.hh-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 120ms}
.hh-row:hover{background:var(--s1)}
.hh-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hh-dot.active{background:var(--ok);box-shadow:0 0 6px rgba(34,197,94,.4)}
.hh-dot.inactive{background:var(--dim)}
.hh-body{flex:1;min-width:0}
.hh-name{font-size:14px;font-weight:400}
.hh-meta{font-size:11px;color:var(--muted);margin-top:3px}
.hh-right{text-align:right;flex-shrink:0}
.hh-amount{font-size:13px;font-weight:400;color:var(--accent)}
.hh-date{font-size:10px;color:var(--dim);margin-top:3px}
.hh-members{display:flex;gap:4px;margin-top:6px}
.member-tag{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--s2);border:1px solid var(--border2);color:var(--muted)}

/* Audit mini */
.audit-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);font-size:12px}
.audit-level{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.audit-level.error{background:var(--err)}
.audit-level.warn{background:var(--warn)}
.audit-level.info{background:var(--ok)}
.audit-module{font-family:var(--mono);font-size:10px;color:var(--muted);width:80px;flex-shrink:0}
.audit-msg{flex:1;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.audit-time{font-size:10px;color:var(--dim);flex-shrink:0}

/* Detail drawer */
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(400px,100%);background:var(--s1);border-left:1px solid var(--border);transform:translateX(100%);transition:transform 240ms ease-out;z-index:200;overflow-y:auto;padding:20px}
.drawer.open{transform:none}
.drawer-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border:none;background:var(--s2);border-radius:50%;color:var(--muted);cursor:pointer;font-size:16px}
.drawer h3{font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:2px;margin-bottom:16px}
.drawer-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.drawer-row .label{color:var(--muted);font-weight:300}

/* Loading */
.loading{padding:40px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="/">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    Inicio
  </a>
  <span class="topbar-title">Superadmin</span>
  <span class="topbar-badge">Acceso restringido</span>
</div>

<div class="content" id="content">
  <div class="loading">Verificando acceso…</div>
</div>

<div class="drawer" id="drawer">
  <button class="drawer-close" onclick="closeDrawer()">✕</button>
  <div id="drawer-content"></div>
</div>

<script>
const G_URL = 'https://hahhmpvfyrmwnaqxibvt.supabase.co';
const G_KEY = 'sb_publishable_WTjwtY_ghLdfShnDhkqHUA_u_1Hn762';
const SUPER_ID = 'fbf11248-6467-43fd-88a5-384c76e48a3f'; // Santi only

var G_sb = null;
var G_households = [];
var G_logs = [];

function waitAndBoot(){ if(typeof supabase!=='undefined') boot(); else setTimeout(waitAndBoot,50); }

async function boot() {
  G_sb = supabase.createClient(G_URL, G_KEY, {auth:{persistSession:true,autoRefreshToken:true}});
  var s = await G_sb.auth.getSession();
  if (!s.data?.session) { window.location.href='/'; return; }

  // Verify superadmin
  var ur = await G_sb.from('app_users').select('id').eq('auth_id', s.data.session.user.id).single();
  if (!ur.data || ur.data.id !== SUPER_ID) {
    document.getElementById('content').innerHTML = '<div class="loading" style="color:var(--err)">Acceso denegado.</div>';
    return;
  }

  await loadAll();
}

async function loadAll() {
  var [hhRes, usersRes, txRes, logsRes] = await Promise.all([
    G_sb.from('households').select('*').order('created_at', {ascending:false}),
    G_sb.from('app_users').select('*').order('created_at', {ascending:false}),
    G_sb.from('transactions').select('household_id,monto_pyg').limit(1000),
    G_sb.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(50),
  ]);

  G_households = hhRes.data || [];
  var users     = usersRes.data || [];
  var txs       = txRes.data || [];
  G_logs        = logsRes.data || [];

  // Enrich households
  G_households.forEach(function(hh){
    hh._members = users.filter(function(u){ return u.household_id === hh.id; });
    var hhTx = txs.filter(function(t){ return t.household_id === hh.id; });
    hh._txCount = hhTx.length;
    hh._totalGs = hhTx.reduce(function(s,t){ return s+(t.monto_pyg||0); }, 0);
  });

  render(users, txs);
}

function render(users, txs) {
  var errors = G_logs.filter(function(l){ return l.level==='error'; }).length;
  var FMT = function(n){ return new Intl.NumberFormat('es-PY').format(Math.round(n||0)); };
  var totalGs = txs.reduce(function(s,t){ return s+(t.monto_pyg||0); }, 0);

  var html = '';

  // Stats
  html += '<div class="stats-row">';
  html += stat(G_households.length, 'Hogares');
  html += stat(users.length, 'Usuarios');
  html += stat(txs.length, 'Movimientos');
  html += stat(errors, 'Errores', errors > 0 ? 'color:var(--err)' : '');
  html += '</div>';

  // Households
  html += '<div class="section-label">Hogares</div>';
  if (!G_households.length) {
    html += '<div class="loading">Sin hogares registrados</div>';
  } else {
    G_households.forEach(function(hh, i){
      var lastTx = hh._members.length > 0 ? (hh._members[0].updated_at || hh.created_at) : hh.created_at;
      var dateStr = new Date(lastTx).toLocaleDateString('es-PY',{day:'2-digit',month:'short',year:'numeric'});
      var memberTags = hh._members.map(function(m){ return '<span class="member-tag">'+ESC(m.nombre_corto||m.nombre||'?')+'</span>'; }).join('');
      html += '<div class="hh-row" onclick="openHH('+i+')">' +
        '<div class="hh-dot '+(hh._members.length>0?'active':'inactive')+'"></div>' +
        '<div class="hh-body">' +
          '<div class="hh-name">'+ESC(hh.nombre||hh.id.slice(0,8))+'</div>' +
          '<div class="hh-members">'+memberTags+'</div>' +
          '<div class="hh-meta">'+hh._txCount+' movimientos</div>' +
        '</div>' +
        '<div class="hh-right">' +
          '<div class="hh-amount">Gs. '+FMT(hh._totalGs)+'</div>' +
          '<div class="hh-date">'+dateStr+'</div>' +
        '</div>' +
      '</div>';
    });
  }

  // Audit tail
  html += '<div class="section-label">Audit log reciente</div>';
  G_logs.slice(0,20).forEach(function(l){
    var t = new Date(l.created_at).toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'});
    html += '<div class="audit-row">' +
      '<div class="audit-level '+l.level+'"></div>' +
      '<div class="audit-module">'+ESC(l.module||'—')+'</div>' +
      '<div class="audit-msg">'+ESC(l.message||l.event||'—')+'</div>' +
      '<div class="audit-time">'+t+'</div>' +
    '</div>';
  });

  if (!G_logs.length) html += '<div class="loading">Sin logs recientes</div>';

  html += '<div style="padding:16px;text-align:center"><a href="/audit/" style="font-size:12px;color:var(--accent);text-decoration:none">Ver audit completo →</a></div>';

  document.getElementById('content').innerHTML = html;
}

function stat(val, label, style) {
  return '<div class="stat"><div class="stat-val" '+(style?'style="'+style+'"':'')+'>'+val+'</div><div class="stat-label">'+label+'</div></div>';
}

function openHH(i) {
  var hh = G_households[i];
  if (!hh) return;
  var FMT = function(n){ return new Intl.NumberFormat('es-PY').format(Math.round(n||0)); };
  var rows = [
    ['ID', hh.id.slice(0,12)+'…'],
    ['Nombre', hh.nombre || '—'],
    ['Miembros', hh._members.length],
    ['Movimientos', hh._txCount],
    ['Total gastos', 'Gs. '+FMT(hh._totalGs)],
    ['Creado', new Date(hh.created_at).toLocaleDateString('es-PY')],
  ];
  var html = '<h3>'+ESC(hh.nombre||hh.id.slice(0,8))+'</h3>';
  rows.forEach(function(r){
    html += '<div class="drawer-row"><span class="label">'+r[0]+'</span><span>'+r[1]+'</span></div>';
  });
  html += '<div style="margin-top:20px"><div class="section-label" style="padding:0 0 8px">Miembros</div>';
  hh._members.forEach(function(m){
    html += '<div class="drawer-row"><span>'+ESC(m.nombre||'—')+'</span><span class="label">'+ESC(m.email||'—')+'</span></div>';
  });
  html += '</div>';
  document.getElementById('drawer-content').innerHTML = html;
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); }

function ESC(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.addEventListener('DOMContentLoaded', waitAndBoot);
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeDrawer(); });
</script>
</body>
</html>
