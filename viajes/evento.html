<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/pears-icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/pears-icon-32.png">
  <link rel="apple-touch-icon" href="/icon-apple-180.png">
  <link rel="manifest" href="/manifest.json">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PEARS · Evento</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--s1:#080808;--s2:#111;--s3:#161616;
  --border:#1a1a1a;--border2:#2a2a2a;
  --text:#fff;--muted:#666;--dim:#333;--accent:#8dd900;
  --err:#ef4444;--ok:#22c55e;
  --font:'Inter',-apple-system,sans-serif;
  --mono:'SF Mono','Fira Code',monospace;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

/* ── TOP BAR ── */
.topbar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;
  height:52px;background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:0 4px;
}
.tb-back{
  display:flex;align-items:center;justify-content:center;
  width:44px;height:44px;border:none;background:none;
  color:var(--muted);cursor:pointer;flex-shrink:0;
  transition:color 120ms;
}
.tb-back:hover{color:var(--text)}
.tb-title{
  flex:1;text-align:center;
  font-size:11px;font-weight:500;
  text-transform:uppercase;letter-spacing:3px;
  color:var(--text);
}
.tb-save{
  height:36px;padding:0 16px;
  background:var(--accent);border:none;border-radius:6px;
  color:#000;font-size:12px;font-weight:500;
  font-family:var(--font);cursor:pointer;
  margin-right:8px;transition:opacity 120ms;
  white-space:nowrap;
}
.tb-save:active{opacity:.8}
.tb-save:disabled{opacity:.4;cursor:not-allowed}

/* ── SCROLL BODY ── */
.body-scroll{padding:0 0 120px}

/* ── SECTION ── */
.section{border-bottom:1px solid var(--border)}
.section-label{
  font-size:9px;font-weight:500;
  text-transform:uppercase;letter-spacing:3px;
  color:var(--muted);
  padding:16px 16px 8px;
}

/* ── TIPO TOGGLE ── */
.tipo-row{
  display:flex;gap:1px;
  background:var(--border);
  border-top:1px solid var(--border);
}
.tipo-btn{
  flex:1;padding:12px 4px;
  border:none;background:var(--s1);
  color:var(--muted);font-family:var(--font);
  font-size:10px;font-weight:500;
  text-transform:uppercase;letter-spacing:1.5px;
  cursor:pointer;transition:background 120ms,color 120ms;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.tipo-btn .tipo-icon{display:flex;align-items:center;justify-content:center;height:20px}
.tipo-btn .tipo-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Seleccionado: fondo del acento, para que se vea cual esta activo */
.tipo-btn.active{background:var(--accent);color:#000;font-weight:700}
.tipo-btn.active .tipo-icon svg{stroke:#000;stroke-width:2.1}

/* ── FIELDS ── */
.field{padding:0 16px;border-bottom:1px solid var(--border)}
.field:last-child{border-bottom:none}
.field-row{display:flex;gap:0}
.field-row .field{flex:1;border-right:1px solid var(--border)}
.field-row .field:last-child{border-right:none}

.field-label{
  display:block;
  font-size:9px;font-weight:500;
  text-transform:uppercase;letter-spacing:2.5px;
  color:var(--muted);
  padding-top:14px;margin-bottom:6px;
}
.fi{
  width:100%;background:transparent;border:none;
  color:var(--text);font-family:var(--font);
  font-size:15px;font-weight:300;
  padding:0 0 14px;outline:none;
}
.fi::placeholder{color:var(--dim)}
.fi:focus{color:var(--text)}
textarea.fi{resize:none;line-height:1.6}
.fi[type="date"],.fi[type="time"]{
  color-scheme:dark;
  font-size:14px;
}

/* ── SEGMENTOS ── */
.seg-list{padding:8px 16px 4px}
.seg-item{
  background:var(--s1);
  border:1px solid var(--border2);
  border-radius:8px;
  margin-bottom:8px;
  overflow:hidden;
}
.seg-item-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;
  border-bottom:1px solid var(--border);
}
.seg-item-label{
  font-size:10px;font-weight:500;
  text-transform:uppercase;letter-spacing:2px;
  color:var(--muted);
}
.seg-remove{
  width:28px;height:28px;border:none;background:none;
  color:var(--muted);font-size:16px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  border-radius:4px;transition:background 120ms,color 120ms;
}
.seg-remove:hover{background:rgba(239,68,68,.15);color:var(--err)}

.seg-fields{padding:4px 12px 12px}
.seg-field{margin-top:10px}
.seg-field label{
  display:block;font-size:9px;font-weight:500;
  text-transform:uppercase;letter-spacing:2px;
  color:var(--muted);margin-bottom:5px;
}
.seg-fi{
  width:100%;background:var(--s2);border:1px solid var(--border2);
  border-radius:6px;padding:8px 10px;
  color:var(--text);font-family:var(--font);font-size:14px;font-weight:300;
  outline:none;transition:border-color 120ms;
}
.seg-fi:focus{border-color:var(--accent)}
.seg-fi::placeholder{color:var(--dim)}

/* modo pills */
.modo-row{display:flex;gap:4px;flex-wrap:wrap}
.modo-pill{
  padding:5px 10px;border-radius:20px;
  border:1px solid var(--border2);background:var(--s2);
  color:var(--muted);font-size:11px;font-weight:400;
  cursor:pointer;transition:all 120ms;
}
.modo-pill.active{background:var(--accent);border-color:var(--accent);color:#000}

/* color picker */
.cp-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.cp-row::-webkit-scrollbar{display:none}
.cp-swatch{
  width:22px;height:22px;border-radius:3px;
  cursor:pointer;border:2px solid transparent;
  transition:transform 100ms;flex-shrink:0;
}
.cp-swatch:hover{transform:scale(1.2)}
.cp-swatch.active{border-color:#fff}
.cp-sep{width:1px;height:22px;background:var(--border2);flex-shrink:0;margin:0 2px}
.cp-preview{width:22px;height:22px;border-radius:3px;border:1px solid var(--border2);flex-shrink:0}
.cp-hex{
  flex:1;min-width:80px;background:transparent;border:none;
  color:var(--text);font-family:var(--mono);font-size:13px;
  outline:none;padding:0;
}
.cp-hex::placeholder{color:var(--dim)}

/* add segment btn */
.add-seg-btn{
  display:flex;align-items:center;gap:8px;
  width:calc(100% - 32px);margin:0 16px 12px;
  padding:10px 14px;
  background:transparent;border:1px dashed var(--border2);
  border-radius:8px;color:var(--muted);
  font-family:var(--font);font-size:13px;font-weight:400;
  cursor:pointer;transition:border-color 120ms,color 120ms;
}
.add-seg-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── BOTTOM BAR ── */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg);border-top:1px solid var(--border);
  padding:12px 16px;
  display:flex;flex-direction:column;gap:8px;
  max-width:480px;margin:0 auto;
}
.btn-primary{
  width:100%;padding:15px;
  background:var(--accent);border:none;border-radius:8px;
  color:#000;font-family:var(--font);font-size:14px;font-weight:500;
  cursor:pointer;transition:opacity 120ms;
}
.btn-primary:active{opacity:.8}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-delete{
  background:none;border:none;
  color:var(--err);font-family:var(--font);font-size:13px;font-weight:400;
  cursor:pointer;padding:4px 0 8px;
  text-align:center;width:100%;
  transition:opacity 120ms;
}
.btn-delete:hover{opacity:.7}

/* ── FLASH ── */
#flash-wrap{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}

/* ── LOADING ── */
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--muted);font-size:13px}

/* ── ANIMATIONS ── */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.body-scroll{animation:fadeIn 200ms ease-out}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <button class="tb-back" onclick="goBack()" title="Volver">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>
  <span class="tb-title" id="page-title">Nuevo evento</span>
  <button class="tb-save" id="btn-save-top" onclick="saveEvento()" disabled>Guardar</button>
</div>

<div id="flash-wrap"></div>

<!-- BODY -->
<div class="body-scroll" id="body-content">
  <div class="loading" id="loading-state">Cargando…</div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar" id="bottom-bar" style="display:none">
  <button class="btn-primary" id="btn-save-bottom" onclick="saveEvento()">Guardar cambios</button>
  <button class="btn-delete" id="btn-delete" onclick="eliminarEvento()" style="display:none">Eliminar evento</button>
</div>

<script>
const G_URL = 'https://hahhmpvfyrmwnaqxibvt.supabase.co';
const G_KEY = 'sb_publishable_WTjwtY_ghLdfShnDhkqHUA_u_1Hn762';

var G_sb = null;
var G_hh = null;
var G_nombre = null;   // quien sube el adjunto (created_by)
var G_item = null;       // loaded item (edit mode)
var G_viajeId = null;    // for new mode
// Id del evento. En modo nuevo se reserva ANTES de guardar para poder
// adjuntar archivos sin obligar a guardar primero.
var G_nuevoId = null;
function idEvento() {
  if (G_editId) return G_editId;
  if (!G_nuevoId) {
    G_nuevoId = 'it_' + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'') : String(Date.now()));
  }
  return G_nuevoId;
}
var G_editId  = null;    // for edit mode
var G_tipo    = 'VUELO';
var G_segCount = 0;      // counter for unique seg IDs
var G_viajeRef = null;   // viaje record (for new mode defaults)

// ── URL params ──────────────────────────────────────────────
var G_params = new URLSearchParams(location.search);
var IS_NEW   = G_params.has('new');
G_editId     = G_params.get('id') || null;
G_viajeId    = G_params.get('viaje_id') || null;

// ── Metro colors ─────────────────────────────────────────────
// ROYGBIV (mapped to BCN metro) + 5 extra from the map
var METRO_COLORS = [
  '#EF3340', // R — L1 rojo
  '#8dd900', // O — L9 naranja
  '#FFCC00', // Y — L4 amarillo
  '#3DB54A', // G — L3 verde
  '#0064B4', // B — L5 azul
  '#A2278B', // I — L2 índigo/violeta
  '#9E3B8E', // V — L12 / FGC violeta oscuro
  '#23A0E3', // +1 L10 celeste
  '#9E7120', // +2 L7/L8 marrón
  '#CC0066', // +3 FGC magenta
  '#00BCD4', // +4 Tramvia teal
  '#3CB4C8', // +5 L11 verde-agua
];

// ── Boot ─────────────────────────────────────────────────────
function waitAndBoot() {
  if (typeof supabase !== 'undefined') boot(); else setTimeout(waitAndBoot, 50);
}

async function boot() {
  G_sb = supabase.createClient(G_URL, G_KEY, {auth:{persistSession:true,autoRefreshToken:true}});
  var s = await G_sb.auth.getSession();
  if (!s.data?.session) { window.location.href = '/'; return; }
  var hr = await G_sb.rpc('get_my_household_id');
  G_hh = hr.data;

  var au = s.data.session.user;
  var ur = await G_sb.from('app_users').select('nombre,nombre_corto').eq('auth_id', au.id).single();
  G_nombre = (ur.data?.nombre_corto || ur.data?.nombre || au.email.split('@')[0]).split(' ')[0];
  await cargarMiembrosPax();     // precarga los pasajeros con el hogar
  await cargarProgramasVuelo();  // numeros de viajero frecuente

  if (IS_NEW) {
    // Load viaje for defaults
    if (G_viajeId) {
      var vr = await G_sb.from('viaje_itinerario')
        .select('viaje_id')
        .eq('viaje_id', G_viajeId)
        .limit(1);
      // Load viaje record
      var vvr = await G_sb.from('viajes').select('*').eq('id', G_viajeId).single();
      G_viajeRef = vvr.data;
    }
    document.getElementById('page-title').textContent = 'Nuevo evento';
    renderForm(null);
  } else if (G_editId) {
    var r = await G_sb.from('viaje_itinerario').select('*').eq('id', G_editId).single();
    if (r.error || !r.data) { flash('Evento no encontrado','err'); return; }
    G_item = r.data;
    G_viajeId = G_item.viaje_id;
    document.getElementById('page-title').textContent = 'Editar evento';
    renderForm(G_item);
  } else {
    flash('Parámetros inválidos','err');
  }
}

// ── Render form ───────────────────────────────────────────────
function renderForm(item) {
  G_tipo = item ? (item.tipo || 'VUELO') : 'VUELO';

  var defaultFecha = item ? (item.fecha || '') : (G_viajeRef ? G_viajeRef.fecha_inicio : '');
  var defaultHora  = item ? (item.hora ? item.hora.slice(0,5) : '') : '09:00';
  var segs = item ? (item.transporte_segmentos || []) : [];

  var html = '';

  // ── Tipo ──
  html += '<div class="section">';
  html += '<div class="section-label">Tipo de evento</div>';
  html += '<div class="tipo-row">';
  var tipos = [
    // Avion de perfil, apuntando arriba a la derecha (no el clip rotado de antes)
    {k:'VUELO',      label:'Vuelo',  icon:'<svg viewBox="0 0 24 24"><path d="M21 15.5 13.5 12V5.5a1.5 1.5 0 0 0-3 0V12L3 15.5v2l7.5-2.2V19l-2 1.5v1.2l3.5-1 3.5 1v-1.2L13.5 19v-3.7l7.5 2.2z"/></svg>'},
    // Colectivo de frente: parabrisas, espejos y ruedas
    {k:'TRANSPORTE', label:'Trans.', icon:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="15" rx="2.5"/><path d="M5 12h14M8 18v2M16 18v2"/><path d="M3.5 8v3M20.5 8v3"/><circle cx="8.5" cy="15" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15" r="1" fill="currentColor" stroke="none"/></svg>'},
    {k:'ALOJAMIENTO',label:'Aloj.',  icon:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>'},
    // Tenedor de tres dientes + cuchillo, los dos completos
    {k:'COMIDA',     label:'Comida', icon:'<svg viewBox="0 0 24 24"><path d="M6 2v7M9 2v7M12 2v7"/><path d="M9 9v13"/><path d="M18 2c-1.8 1.4-2.5 3.6-2.5 6.5 0 2 .8 3 2.5 3.2V22"/></svg>'},
    // Entrada de espectaculo, con el troquel del medio
    {k:'ACTIVIDAD',  label:'Activ.', icon:'<svg viewBox="0 0 24 24"><path d="M3 8.5V6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v2.5a2 2 0 0 0 0 7V18a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2.5a2 2 0 0 0 0-7z"/><path d="M14 5v2M14 11v2M14 17v2" stroke-dasharray="2 2"/></svg>'},
  ];

  tipos.forEach(function(t){
    var active = G_tipo === t.k ? ' active' : '';
    html += '<button class="tipo-btn'+active+'" onclick="setTipo(\''+t.k+'\')"><span class="tipo-icon">'+t.icon+'</span>'+t.label+'</button>';
  });
  html += '</div></div>';

  // ── Datos básicos ──
  html += '<div class="section">';
  html += '<div class="section-label">Datos básicos</div>';

  html += '<div class="field">';
  html += '<label class="field-label" id="lbl-titulo">Título</label>';
  html += '<input class="fi" id="f-titulo" placeholder="Ej: Metro L5 · Sagrada Família → Passeig de Gràcia" oninput="checkReady()" value="'+esc(item ? item.titulo : '')+'">';
  html += '<div id="hint-titulo" style="display:none;font-size:11px;color:var(--dim);margin-top:5px;line-height:1.5">Se arma solo con la ruta del vuelo.</div>';
  html += '</div>';

  html += '<div class="field-row">';
  html += '<div class="field"><label class="field-label">Fecha</label><input class="fi" id="f-fecha" type="date" value="'+esc(defaultFecha)+'" oninput="checkReady()"></div>';
  html += '<div class="field"><label class="field-label" id="lbl-hora">Hora</label><input class="fi" id="f-hora" type="time" value="'+esc(defaultHora)+'"></div>';
  html += '<div class="field" id="fld-hfin"><label class="field-label">Hora fin</label><input class="fi" id="f-hfin" type="time" value="'+esc((item && item.detalle && item.detalle.hora_fin)||'')+'"></div>';
  html += '</div>';

  html += '<div class="field" id="fld-lugar">';
  html += '<label class="field-label">Lugar</label>';
  html += '<input class="fi" id="f-lugar" placeholder="Ej: Els Quatre Gats · Carrer de Montsió 3" value="'+esc((item && item.detalle && item.detalle.lugar)||'')+'">';
  html += '</div>';

  html += '<div class="field" id="fld-ciudad">';
  html += '<label class="field-label">Ciudad</label>';
  html += '<input class="fi" id="f-ciudad" placeholder="Barcelona" value="'+esc(item ? (item.ciudad||'') : '')+'">';
  html += '</div>';

  html += '<div class="field">';
  html += '<label class="field-label">Descripción</label>';
  html += '<textarea class="fi" id="f-desc" rows="4" placeholder="Detalles, instrucciones, notas de logística…">'+esc(item ? (item.descripcion||'') : '')+'</textarea>';
  html += '</div>';

  html += '</div>'; // end section

  // ── VUELO: datos del vuelo + datos de cada pasajero ──
  var d = (item && item.detalle) ? item.detalle : {};
  G_PAX = (d.pasajeros && d.pasajeros.length) ? d.pasajeros.slice() : null;

  html += '<div class="section" id="sec-vuelo">';

  G_RT = (d.tramo === 'ida' && d.vuelta) ? true : !!d.vuelta;

  html += '<div class="tipo-row" style="margin-bottom:14px">';
  html +=   '<button class="tipo-btn'+(G_RT?'':' active')+'" id="rt-one" onclick="setRT(false)">Solo ida</button>';
  html +=   '<button class="tipo-btn'+(G_RT?' active':'')+'" id="rt-round" onclick="setRT(true)">Ida y vuelta</button>';
  html += '</div>';

  html += '<div class="section-label">Ida · salida</div>';
  html += '<div class="frow">';
  html +=   '<div class="field"><label class="field-label">Aerolínea</label><input class="fi" id="fv-aerolinea" placeholder="Iberia" value="'+esc(d.aerolinea||'')+'"></div>';
  html +=   '<div class="field"><label class="field-label">Nº de vuelo</label><input class="fi" id="fv-numero" style="font-family:var(--mono);letter-spacing:1px" placeholder="IB0407" value="'+esc(d.numero||'')+'"></div>';
  html += '</div>';
  html += '<div class="field"><label class="field-label">Código de reserva</label><input class="fi" id="fv-pnr" style="font-family:var(--mono);letter-spacing:2px;text-transform:uppercase" placeholder="7EJ6JX" value="'+esc(d.pnr||'')+'"></div>';
  html += '<div style="font-size:11px;color:var(--dim);margin:-6px 0 12px;line-height:1.5">El código de reserva es uno solo para toda la reserva. El nº de ticket y el asiento son de cada pasajero.</div>';
  html += '<div class="frow">';
  html +=   '<div class="field"><label class="field-label">Origen</label><input class="fi" id="fv-origen" oninput="autoTitulo()" style="text-transform:uppercase" maxlength="4" placeholder="MAD" value="'+esc(d.origen||'')+'"></div>';
  html +=   '<div class="field"><label class="field-label">Destino</label><input class="fi" id="fv-destino" oninput="autoTitulo()" style="text-transform:uppercase" maxlength="4" placeholder="BCN" value="'+esc(d.destino||'')+'"></div>';
  html += '</div>';
  html += '<div class="frow">';
  html +=   '<div class="field"><label class="field-label">Terminal salida</label><input class="fi" id="fv-tsal" placeholder="T4" value="'+esc(d.terminal_sal||'')+'"></div>';
  html +=   '<div class="field"><label class="field-label">Terminal llegada</label><input class="fi" id="fv-tlleg" placeholder="T1" value="'+esc(d.terminal_lleg||'')+'"></div>';
  html += '</div>';

  html += '<div class="section-label" style="margin-top:16px">Ida · llegada</div>';
  html += '<div class="frow">';
  html +=   '<div class="field"><label class="field-label">Fecha</label><input class="fi" id="fv-fllega" type="date" value="'+esc(d.fecha_llegada||'')+'"></div>';

// ── Build segment HTML ────────────────────────────────────────
function buildSegHTML(seg) {
  var id = ++G_segCount;
  var modo = seg.modo || 'metro';
  var linea = esc(seg.linea || '');
  var color = seg.color || '#8dd900';
  var desde = esc(seg.desde || '');
  var hasta = esc(seg.hasta || '');

  var modos = ['metro','bus','tram','tren','ferry','a pie'];
  var modoRow = modos.map(function(m){
    return '<span class="modo-pill'+(modo===m?' active':'')+'" onclick="setModo(\'seg-'+id+'\',\''+m+'\',this)">'+m+'</span>';
  }).join('');

  var swatches = METRO_COLORS.map(function(c){
    var active = c === color ? ' active' : '';
    return '<div class="cp-swatch'+active+'" style="background:'+c+'" onclick="setSegColor(\'seg-'+id+'\',\''+c+'\',this)" title="'+c+'"></div>';
  }).join('');

  return '<div class="seg-item" id="seg-'+id+'" data-modo="'+modo+'" data-color="'+color+'">' +
    '<div class="seg-item-head">' +
      '<span class="seg-item-label">Segmento '+id+'</span>' +
      '<button class="seg-remove" onclick="removeSegmento(\'seg-'+id+'\')" title="Quitar">✕</button>' +
    '</div>' +
    '<div class="seg-fields">' +
      '<div class="seg-field"><label>Modo</label><div class="modo-row" id="seg-'+id+'-modos">'+modoRow+'</div></div>' +
      '<div class="seg-field" id="seg-'+id+'-linea-wrap">' +
        '<label>Línea</label>' +
        '<input class="seg-fi" id="seg-'+id+'-linea" placeholder="L5, Bus 40, Tram T1…" value="'+linea+'">' +
      '</div>' +
      '<div class="seg-field">' +
        '<label>Color de línea</label>' +
        '<div class="cp-row" id="seg-'+id+'-swatches">'+swatches+
        '<div class="cp-sep"></div>' +
        '<div class="cp-preview" id="seg-'+id+'-preview" style="background:'+color+'"></div>' +
        '<input class="cp-hex" id="seg-'+id+'-hex" value="'+color+'" maxlength="7" oninput="syncSegHex(\'seg-'+id+'\')" placeholder="#8dd900">' +
        '</div>' +
      '</div>' +
      '<div class="seg-field"><label>Parada de salida</label><input class="seg-fi" id="seg-'+id+'-desde" placeholder="Ej: Collblanc" value="'+desde+'"></div>' +
      '<div class="seg-field"><label>Parada de llegada</label><input class="seg-fi" id="seg-'+id+'-hasta" placeholder="Ej: Maragall" value="'+hasta+'"></div>' +
      '<div class="seg-field"><label>Salida estimada</label><input class="seg-fi" type="time" id="seg-'+id+'-hsal" value="'+esc(seg.hora_salida||'')+'"></div>' +
      '<div class="seg-field"><label>Llegada estimada</label><input class="seg-fi" type="time" id="seg-'+id+'-hlleg" value="'+esc(seg.hora_llegada||'')+'"></div>' +
    '</div>' +
  '</div>';
}

// ── Segment actions ───────────────────────────────────────────
function addSegmento() {
  var list = document.getElementById('seg-list');
  var div = document.createElement('div');
  div.innerHTML = buildSegHTML({});
  list.appendChild(div.firstChild);
}

function removeSegmento(sid) {
  var el = document.getElementById(sid);
  if (el) el.remove();
}

function setModo(sid, modo, pill) {
  document.getElementById(sid).dataset.modo = modo;
  document.querySelectorAll('#'+sid+'-modos .modo-pill').forEach(function(p){
    p.classList.toggle('active', p.textContent === modo);
  });
  // Hide line name for 'a pie'
  var wrap = document.getElementById(sid+'-linea-wrap');
  if (wrap) wrap.style.display = (modo === 'a pie') ? 'none' : 'block';
}

function setSegColor(sid, hex, swatch) {
  document.getElementById(sid).dataset.color = hex;
  document.getElementById(sid+'-preview').style.background = hex;
  document.getElementById(sid+'-hex').value = hex;
  document.querySelectorAll('#'+sid+'-swatches .cp-swatch').forEach(function(s){
    s.classList.toggle('active', s.title === hex);
  });
}

function syncSegHex(sid) {
  var val = (document.getElementById(sid+'-hex').value || '').trim();
  if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
    document.getElementById(sid).dataset.color = val;
    document.getElementById(sid+'-preview').style.background = val;
    document.querySelectorAll('#'+sid+'-swatches .cp-swatch').forEach(function(s){s.classList.remove('active');});
  }
}

    b.classList.toggle('active', b.getAttribute('onclick').includes("'"+tipo+"'"));

// metro, y a un traslado urbano no se le piden terminales.

function _v(id) {
  var e = document.getElementById(id);
  return e ? (e.value || '').trim() : '';
}

// ── Alojamiento ──
function calcNoches() {
  var e = _v('fa-entrada'), sa = _v('fa-salida');
  var el = document.getElementById('fa-noches');
  if (!el) return;
  if (!e || !sa) { el.textContent = ''; return; }
  var n = Math.round((new Date(sa) - new Date(e)) / 86400000);
  el.textContent = (n > 0) ? (n + ' noche' + (n === 1 ? '' : 's'))
                 : (n === 0 ? 'Entrada y salida el mismo día' : '⚠ El check-out es anterior al check-in');
  el.style.color = (n < 0) ? '#f59e0b' : 'var(--muted)';
}

function setAlojTipo(el) {
  var cont = document.getElementById('aloj-tipos');
  if (!cont) return;
  cont.querySelectorAll('.modo-pill').forEach(function(p){ p.classList.remove('active'); });
  el.classList.add('active');
}

function leerAlojTipo() {
  var a = document.querySelector('#aloj-tipos .modo-pill.active');
  return a ? a.textContent.trim() : 'Hotel';
}

function leerDetalleAloj() {
  var d = {
    alojamiento:  leerAlojTipo(),
    entrada:      _v('fa-entrada'),
    salida:       _v('fa-salida'),
    hora_entrada: _v('fa-hent'),
    hora_salida:  _v('fa-hsal'),
    pnr:          _v('fa-pnr').toUpperCase(),
    habitacion:   _v('fa-hab'),
    huespedes:    _v('fa-hues'),
    incluye:      _v('fa-incluye')
  };
  Object.keys(d).forEach(function(k){ if (!d[k]) delete d[k]; });
  return d;
}

// ══════════════════════════════════════════
// TITULO ESTANDAR DE VUELO
// Siempre «ORIGEN → DESTINO». La aerolinea y el numero ya viven en el
// detalle; repetirlos en el titulo solo hace la lista mas dificil de leer.
// En un vuelo el campo no se edita a mano: se arma solo.
// ══════════════════════════════════════════
function tituloVuelo(or, de) {
  or = (or || '').toUpperCase().trim();
  de = (de || '').toUpperCase().trim();
  if (or && de) return or + ' → ' + de;
  return or || de || '';
}

function autoTitulo() {
  if (G_tipo !== 'VUELO') return;
  var t = document.getElementById('f-titulo');
  if (!t) return;
  var nuevo = tituloVuelo(_v('fv-origen'), _v('fv-destino'));
  if (nuevo) t.value = nuevo;
  if (typeof checkReady === 'function') checkReady();
}

// En vuelos el titulo es de solo lectura; en el resto, editable
function modoTitulo() {
  var t = document.getElementById('f-titulo');
  var h = document.getElementById('hint-titulo');
  if (!t) return;
  var esVuelo = (G_tipo === 'VUELO');
  t.readOnly = esVuelo;
  t.style.opacity = esVuelo ? '.75' : '';
  t.placeholder = esVuelo ? 'ASU → AEP' : 'Ej: Metro L5 · Sagrada Família → Passeig de Gràcia';
  if (h) h.style.display = esVuelo ? 'block' : 'none';
  if (esVuelo) autoTitulo();
}

var G_RT = false;

function setRT(on) {
  G_RT = !!on;

// Al activar la vuelta, invertir la ruta: casi siempre es eso
function prefillVuelta() {
  var set = function(id, val) {
    var e = document.getElementById(id);
    if (e && !e.value) e.value = val || '';
  };
  set('rv-origen',    _v('fv-destino'));
  set('rv-destino',   _v('fv-origen'));
  set('rv-aerolinea', _v('fv-aerolinea'));
  set('rv-tsal',      _v('fv-tlleg'));
  set('rv-tlleg',     _v('fv-tsal'));
  // Por defecto, el dia que termina el viaje
  var e = document.getElementById('rv-fecha');
  if (e && !e.value && G_viajeRef && G_viajeRef.fecha_fin) e.value = G_viajeRef.fecha_fin;
}

function leerVuelta() {
  if (!G_RT) return null;
  var v = {
    fecha:         _v('rv-fecha'),
    hora:          _v('rv-hora'),
    numero:        _v('rv-numero').toUpperCase(),
    aerolinea:     _v('rv-aerolinea') || _v('fv-aerolinea'),
    origen:        _v('rv-origen').toUpperCase(),
    destino:       _v('rv-destino').toUpperCase(),
    terminal_sal:  _v('rv-tsal'),
    terminal_lleg: _v('rv-tlleg'),
    fecha_llegada: _v('rv-fllega'),
    hora_llegada:  _v('rv-hllega')
  };
  if (!v.fecha) return null;   // sin fecha no hay tramo
  Object.keys(v).forEach(function(k){ if (!v[k]) delete v[k]; });
  return v;
}

function leerDetalleVuelo() {
  var d = {
    aerolinea:     _v('fv-aerolinea'),
    numero:        _v('fv-numero').toUpperCase(),
    origen:        _v('fv-origen').toUpperCase(),
    destino:       _v('fv-destino').toUpperCase(),
    terminal_sal:  _v('fv-tsal'),
    terminal_lleg: _v('fv-tlleg'),
    fecha_llegada: _v('fv-fllega'),
    hora_llegada:  _v('fv-hllega'),
    pnr:           _v('fv-pnr').toUpperCase()
  };
  Object.keys(d).forEach(function(k){ if (!d[k]) delete d[k]; });
  var pax = leerPax();
  if (pax.length) d.pasajeros = pax;
  var vta = leerVuelta();
  if (vta) { d.vuelta = vta; d.tramo = 'ida'; }
  return d;
}

// ══════════════════════════════════════════
// PASAJEROS
// El codigo de reserva es de la reserva; el ticket y el asiento son de cada
// persona. Por eso van separados y no en un solo bloque.
// ══════════════════════════════════════════
var G_PAX = null;
var G_MIEMBROS_PAX = [];
var G_PROGRAMAS = [];

async function cargarMiembrosPax() {
  if (G_MIEMBROS_PAX.length || !G_hh) return;
  try {
    var rm = await G_sb.from('household_members').select('user_id').eq('household_id', G_hh);
    var ids = (rm.data || []).map(function(m){ return m.user_id; });
    if (!ids.length) return;
    var ru = await G_sb.from('app_users').select('nombre,nombre_corto').in('id', ids);
    G_MIEMBROS_PAX = (ru.data || []).map(function(u){ return u.nombre || u.nombre_corto || ''; }).filter(Boolean);
  } catch (e) { console.warn('[pax]', e.message); }
}

async function cargarProgramasVuelo() {
  if (G_PROGRAMAS.length || !G_hh) return;
  try {
    var r = await G_sb.from('programas').select('dueno,nombre,numero_socio,nivel')
              .eq('tipo','aerolinea').not('numero_socio','is',null);
    G_PROGRAMAS = r.data || [];
  } catch (e) { console.warn('[programas]', e.message); }
}

// Sugiere los numeros de socio cargados en Configuracion
function opcionesFF(nombrePax) {
  if (!G_PROGRAMAS.length) return '';
  var n = (nombrePax || '').toLowerCase();
  var propios = [], resto = [];
  G_PROGRAMAS.forEach(function(p) {
    var o = '<option value="'+esc(p.numero_socio)+'">'+esc(p.nombre)+
            (p.nivel ? ' · '+esc(p.nivel) : '')+' — '+esc(p.dueno)+'</option>';
    if (n && p.dueno && n.indexOf(p.dueno.toLowerCase().split(' ')[0]) !== -1) propios.push(o);
    else resto.push(o);
  });
  return propios.concat(resto).join('');
}

function buildPaxHTML(pax, i) {
  var n = i + 1;
  return '<div data-pax="'+i+'" style="border:1px solid var(--border2);border-radius:10px;padding:12px;margin-bottom:10px">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">' +
      '<span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--accent)">Pasajero '+n+'</span>' +
      (i > 0 ? '<button style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:16px;padding:0 4px" onclick="delPax('+i+')" title="Quitar">×</button>' : '') +
    '</div>' +
    '<div class="field"><label class="field-label">Nombre completo</label>' +
      '<input class="fi px-nombre" placeholder="Como figura en el pasaporte" value="'+esc(pax.nombre||'')+'"></div>' +
    '<div class="frow">' +
      '<div class="field"><label class="field-label">Nº de ticket</label>' +
        '<input class="fi px-ticket" style="font-family:var(--mono)" placeholder="075-1234567890" value="'+esc(pax.ticket||'')+'"></div>' +
      '<div class="field"><label class="field-label">Asiento</label>' +
        '<input class="fi px-asiento" style="font-family:var(--mono);text-transform:uppercase" placeholder="06A" value="'+esc(pax.asiento||'')+'"></div>' +
    '</div>' +
    '<div class="frow">' +
      '<div class="field"><label class="field-label">Equipaje</label>' +
        '<input class="fi px-equipaje" placeholder="1PC 23kg + mano 8kg" value="'+esc(pax.equipaje||'')+'"></div>' +
      '<div class="field"><label class="field-label">Viajero frecuente</label>' +
        '<input class="fi px-ff" list="ff-'+i+'" style="font-family:var(--mono)" placeholder="Opcional" value="'+esc(pax.frecuente||'')+'">' +
        '<datalist id="ff-'+i+'">' + opcionesFF(pax.nombre) + '</datalist></div>' +
    '</div>' +
  '</div>';
}

function renderPax() {
  var el = document.getElementById('pax-list');
  if (!el) return;
  if (!G_PAX) {
    G_PAX = G_MIEMBROS_PAX.length
      ? G_MIEMBROS_PAX.map(function(n){ return { nombre: n }; })
      : [{}];
  }
  el.innerHTML = G_PAX.map(buildPaxHTML).join('');
}

function leerPax() {
  var out = [];
  document.querySelectorAll('#pax-list [data-pax]').forEach(function(box) {
    var g = function(cls) {
      var e = box.querySelector('.' + cls);
      return e ? (e.value || '').trim() : '';
    };
    var p = {
      nombre:    g('px-nombre'),
      ticket:    g('px-ticket'),
      asiento:   g('px-asiento').toUpperCase(),
      equipaje:  g('px-equipaje'),
      frecuente: g('px-ff')
    };
    Object.keys(p).forEach(function(k){ if (!p[k]) delete p[k]; });
    if (Object.keys(p).length) out.push(p);
  });
  return out;
}

function addPax() { G_PAX = leerPax(); G_PAX.push({}); renderPax(); }
function delPax(i) {
  G_PAX = leerPax(); G_PAX.splice(i, 1);
  if (!G_PAX.length) G_PAX = [{}];
  renderPax();
}

// ══════════════════════════════════════════
// ADJUNTOS — ticket en PDF o imagen, por evento
// El bucket viajes-docs es privado: se sirve con URL firmada temporal.
// ══════════════════════════════════════════
var ADJ = [];

async function cargarAdjuntos() {
  var est = document.getElementById('adj-estado');
  var fi  = document.getElementById('adj-file');
  if (fi) fi.disabled = false;
  if (est) est.textContent = '';
  if (!G_editId && !G_nuevoId) { pintarAdjuntos(); return; }  // nuevo y sin adjuntos
  try {
    var r = await G_sb.from('viaje_documentos').select('*').eq('itinerario_id', idEvento()).order('created_at');
    ADJ = r.data || [];
    pintarAdjuntos();
  } catch (e) { console.warn('[adjuntos]', e.message); }
}

function pintarAdjuntos() {
  var el = document.getElementById('adj-list');
  if (!el) return;
  if (!ADJ.length) { el.innerHTML = '<div style="font-size:12px;color:var(--dim)">Sin adjuntos.</div>'; return; }
  el.innerHTML = ADJ.map(function(a) {
    var ico = (a.tipo === 'application/pdf') ? '📄' : '🖼';
    return '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;margin-bottom:6px">' +
      '<span>'+ico+'</span>' +
      '<span style="flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(a.nombre)+'</span>' +
      '<button style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:11px" onclick="abrirAdjunto(\''+a.id+'\')">Ver</button>' +
      '<button style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:15px" onclick="borrarAdjunto(\''+a.id+'\')">×</button>' +
    '</div>';
  }).join('');
}

async function subirAdjunto(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { alert('El archivo supera los 10 MB.'); input.value=''; return; }

  var est = document.getElementById('adj-estado');
  est.textContent = 'Subiendo ' + file.name + '…';

  var path = G_hh + '/' + G_viajeId + '/' + idEvento() + '/' + Date.now() + '_' + file.name.replace(/[^\w.\-]/g, '_');
  var up = await G_sb.storage.from('viajes-docs').upload(path, file, { upsert: false });
  if (up.error) { est.textContent=''; alert('No se pudo subir: ' + up.error.message); input.value=''; return; }

  var r = await G_sb.from('viaje_documentos').insert({
    id: 'doc_' + (crypto.randomUUID ? crypto.randomUUID().substring(0,12) : Date.now()),
    viaje_id: G_viajeId, itinerario_id: idEvento(),
    nombre: file.name, tipo: file.type, archivo_url: path,
    created_by: G_nombre || null, household_id: G_hh
  });
  input.value = '';
  if (r.error) { est.textContent=''; alert('Se subió el archivo pero no se pudo registrar: ' + r.error.message); return; }
  est.textContent = '';
  cargarAdjuntos();
}

async function abrirAdjunto(id) {
  var a = ADJ.find(function(x){ return x.id === id; });
  if (!a) return;
  var r = await G_sb.storage.from('viajes-docs').createSignedUrl(a.archivo_url, 300);
  if (r.error) { alert('No se pudo abrir: ' + r.error.message); return; }
  window.open(r.data.signedUrl, '_blank');
}

async function borrarAdjunto(id) {
  var a = ADJ.find(function(x){ return x.id === id; });
  if (!a || !confirm('¿Eliminar "' + a.nombre + '"?')) return;
  await G_sb.storage.from('viajes-docs').remove([a.archivo_url]);
  var r = await G_sb.from('viaje_documentos').delete().eq('id', id);
  if (r.error) { alert('No se pudo eliminar: ' + r.error.message); return; }
  cargarAdjuntos();
}

function updateSegVisibility() {
  var esVuelo = (G_tipo === 'VUELO');

  var vuelo = document.getElementById('sec-vuelo');
  if (vuelo) vuelo.style.display = esVuelo ? 'block' : 'none';

  var pax = document.getElementById('sec-pax');
  if (pax) {
    pax.style.display = esVuelo ? 'block' : 'none';
    if (esVuelo) renderPax();
  }

  modoTitulo();

  var blqV = document.getElementById('blq-vuelta');
  if (blqV) blqV.style.display = (esVuelo && G_RT) ? 'block' : 'none';

  var aloj = document.getElementById('sec-aloj');
  if (aloj) {
    aloj.style.display = (G_tipo === 'ALOJAMIENTO') ? 'block' : 'none';
    if (G_tipo === 'ALOJAMIENTO') calcNoches();
  }

  // Los segmentos (linea, color, paradas) son cosa del transporte terrestre.
  // Una actividad no tiene lineas de metro: si hay un traslado, es su propio
  // evento de tipo Transporte.
  var segs = document.getElementById('sec-segmentos');
  if (segs) segs.style.display = (G_tipo === 'TRANSPORTE') ? 'block' : 'none';

  // La ciudad solo aporta donde ubica algo que no se deduce de la ruta
  var ciu = document.getElementById('fld-ciudad');
  if (ciu) ciu.style.display = esVuelo ? 'none' : 'block';

  // Lugar concreto: el restaurante, el museo. En vuelo y transporte no aplica.
  var lug = document.getElementById('fld-lugar');
  if (lug) lug.style.display = (G_tipo === 'COMIDA' || G_tipo === 'ACTIVIDAD') ? 'block' : 'none';

  // Vuelo y alojamiento tienen su propio campo de reserva: no repetirlo
  var cod = document.getElementById('fld-codigo');
  if (cod) cod.style.display = (esVuelo || G_tipo === 'ALOJAMIENTO') ? 'none' : 'block';

  // Hora de fin: util en lo que dura un rato; en un vuelo la llegada va aparte
  var hf = document.getElementById('fld-hfin');
  if (hf) hf.style.display = (G_tipo === 'ACTIVIDAD' || G_tipo === 'COMIDA') ? 'block' : 'none';

  var lh = document.getElementById('lbl-hora');
  if (lh) lh.textContent = (G_tipo === 'ACTIVIDAD' || G_tipo === 'COMIDA') ? 'Hora inicio' : 'Hora';

  var lbl = document.getElementById('lbl-adjuntos');
  if (lbl) {
    lbl.textContent = esVuelo ? 'Ticket y adjuntos'
      : (G_tipo === 'ALOJAMIENTO' ? 'Reserva y adjuntos' : 'Adjuntos');
  }
}

// ── Read segments ─────────────────────────────────────────────
function readSegmentos() {
  var segs = [];
  document.querySelectorAll('#seg-list .seg-item').forEach(function(el){
    var sid = el.id;
    var modo  = el.dataset.modo || 'metro';
    var color = el.dataset.color || '#8dd900';
    var lineaEl = document.getElementById(sid+'-linea');
    var desdeEl = document.getElementById(sid+'-desde');
    var hastaEl = document.getElementById(sid+'-hasta');
    var hsalEl  = document.getElementById(sid+'-hsal');
    var hllegEl = document.getElementById(sid+'-hlleg');
    var linea = lineaEl ? lineaEl.value.trim() : '';
    var desde = desdeEl ? desdeEl.value.trim() : '';
    var hasta = hastaEl ? hastaEl.value.trim() : '';
    segs.push({modo:modo, linea:linea, color:color, desde:desde, hasta:hasta,
               hora_salida:  hsalEl  ? hsalEl.value  : '',
               hora_llegada: hllegEl ? hllegEl.value : ''});
  });
  return segs;
}

// ── Validation ────────────────────────────────────────────────
function checkReady() {
  var titulo = (document.getElementById('f-titulo') || {}).value || '';
  var fecha  = (document.getElementById('f-fecha')  || {}).value || '';
  var ok = titulo.trim().length > 0 && fecha.length > 0;
  document.getElementById('btn-save-top').disabled    = !ok;
  document.getElementById('btn-save-bottom').disabled = !ok;
}

// ── Save ──────────────────────────────────────────────────────
async function saveEvento() {
  var titulo  = document.getElementById('f-titulo').value.trim();
  var fecha   = document.getElementById('f-fecha').value;
  var hora    = document.getElementById('f-hora').value || null;
  var ciudad  = document.getElementById('f-ciudad').value.trim() || null;
  var desc    = document.getElementById('f-desc').value.trim() || null;
  var codigo  = document.getElementById('f-codigo').value.trim() || null;
  var link    = document.getElementById('f-link').value.trim() || null;
  var precio  = parseFloat(document.getElementById('f-precio').value) || null;
  var moneda  = document.getElementById('f-moneda').value;
  var notas   = document.getElementById('f-notas').value.trim() || null;

  if (!titulo || !fecha) { flash('Título y fecha son obligatorios','warn'); return; }

  var segs = readSegmentos();

  // For backward compat: populate transporte / transporte_color from first seg
  var firstSeg = segs.length > 0 ? segs[0] : null;

  if (G_tipo === 'VUELO') {
    var tStd = tituloVuelo(_v('fv-origen'), _v('fv-destino'));
    if (tStd) titulo = tStd;
  }

  var payload = {
    titulo, fecha,
    hora: hora || null,
    ciudad, descripcion: desc,
    tipo: G_tipo,
    codigo_acceso: codigo,
    link_web: link,
    precio_ref: precio,
    moneda: moneda,
    notas,
    transporte_segmentos: (G_tipo === 'TRANSPORTE') ? segs : [],
    transporte:       firstSeg ? (firstSeg.linea || null) : null,
    transporte_color: firstSeg ? (firstSeg.color || null) : null,
    detalle:          (G_tipo === 'VUELO') ? leerDetalleVuelo()
                      : (G_tipo === 'ALOJAMIENTO') ? leerDetalleAloj()
                      : (function(){
                          var x = {};
                          if (_v('f-hfin'))  x.hora_fin = _v('f-hfin');
                          if (_v('f-lugar')) x.lugar    = _v('f-lugar');
                          return x;
                        })(),
  };

  setBusy(true);
  // Ida y vuelta: una sola carga, DOS eventos. El itinerario es una linea de
  // tiempo; si la vuelta viviera dentro del registro de la ida, el dia del
  // regreso no aparece nada. Se vinculan por un id de grupo compartido.
  var vta   = (G_tipo === 'VUELO') ? (payload.detalle && payload.detalle.vuelta) : null;
  var grupo = (payload.detalle && payload.detalle.grupo) ||
              ('rt_' + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'').slice(0,12) : String(Date.now())));

  var r;
  if (G_editId) {
    if (vta) { payload.detalle.grupo = grupo; payload.detalle.tramo = 'ida'; }
    r = await G_sb.from('viaje_itinerario').update(payload).eq('id', G_editId);
  } else {
    payload.id           = idEvento();   // el mismo con el que se subieron los adjuntos
    payload.viaje_id     = G_viajeId;
    payload.household_id = G_hh;
    if (vta) { payload.detalle.grupo = grupo; payload.detalle.tramo = 'ida'; }
    r = await G_sb.from('viaje_itinerario').insert(payload);
  }

  // El tramo de vuelta: mismo grupo, misma reserva, mismos pasajeros
  if (!r.error && vta) {
    var pv = {
      viaje_id:     G_viajeId,
      household_id: G_hh,
      fecha:        vta.fecha,
      hora:         vta.hora || null,
      tipo:         'VUELO',
      titulo:       tituloVuelo(vta.origen, vta.destino) || (titulo + ' (vuelta)'),
      ciudad:       vta.destino || '',
      codigo_acceso: payload.codigo_acceso,
      notas:        notas,
      detalle: {
        aerolinea:     vta.aerolinea,
        numero:        vta.numero,
        origen:        vta.origen,
        destino:       vta.destino,
        terminal_sal:  vta.terminal_sal,
        terminal_lleg: vta.terminal_lleg,
        fecha_llegada: vta.fecha_llegada,
        hora_llegada:  vta.hora_llegada,
        pnr:           payload.detalle.pnr,
        pasajeros:     payload.detalle.pasajeros,
        grupo:         grupo,
        tramo:         'vuelta'
      }
    };
    Object.keys(pv.detalle).forEach(function(k){ if (!pv.detalle[k]) delete pv.detalle[k]; });

    // Si ya existia el tramo de vuelta de este grupo, se actualiza; si no, se crea
    var ex = await G_sb.from('viaje_itinerario').select('id')
               .eq('viaje_id', G_viajeId).eq('detalle->>grupo', grupo).eq('detalle->>tramo', 'vuelta').maybeSingle();
    if (ex.data && ex.data.id) {
      r = await G_sb.from('viaje_itinerario').update(pv).eq('id', ex.data.id);
    } else {
      pv.id = 'it_' + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'') : String(Date.now()+1));
      r = await G_sb.from('viaje_itinerario').insert(pv);
    }
  }

  setBusy(false);

  if (r.error) { flash('Error: '+r.error.message,'err'); return; }
  flash(vta ? 'Ida y vuelta guardadas ✓' : (G_editId ? 'Cambios guardados ✓' : 'Evento creado ✓'), 'ok');
  setTimeout(function(){ goBack(); }, 900);
}

// ── Delete ────────────────────────────────────────────────────
async function eliminarEvento() {
  if (!confirm('¿Eliminar este evento del itinerario? Esta acción no se puede deshacer.')) return;
  setBusy(true);
  var r = await G_sb.from('viaje_itinerario').delete().eq('id', G_editId);
  setBusy(false);
  if (r.error) { flash('Error: '+r.error.message,'err'); return; }
  flash('Evento eliminado','ok');
  setTimeout(function(){ window.location.href = '/viajes/'; }, 600);
}

// ── Helpers ───────────────────────────────────────────────────
function goBack() {
  if (document.referrer) history.back();
  else window.location.href = '/viajes/';
}

function setBusy(b) {
  document.getElementById('btn-save-top').disabled    = b;
  document.getElementById('btn-save-bottom').disabled = b;
  document.getElementById('btn-save-bottom').textContent = b ? 'Guardando…' : (G_editId ? 'Guardar cambios' : 'Crear evento');
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function flash(msg,type) {
  var c = {ok:'#22c55e',err:'#ef4444',warn:'#F59E0B'}[type||'ok'];
  var el = document.createElement('div');
  el.style.cssText='display:inline-block;background:#111;border:1px solid '+c+';color:'+c+';padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;pointer-events:none;white-space:nowrap';
  el.textContent = msg;
  document.getElementById('flash-wrap').appendChild(el);
  setTimeout(function(){ el.remove(); }, 2800);
}

document.addEventListener('DOMContentLoaded', waitAndBoot);
</script>
