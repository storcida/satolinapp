<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/pears-icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/pears-icon-32.png">
  <link rel="apple-touch-icon" href="/icon-apple-180.png">
  <link rel="manifest" href="/manifest.json">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PEARS · Viajes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/logger.js"></script>
<script src="../shared/auth.js"></script>
<link rel="stylesheet" href="../shared/header.css">
<script src="../shared/modules.js"></script>
<script src="../shared/header.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--s1:#080808;--s2:#111;--border:#1a1a1a;--border2:#2a2a2a;
  --text:#fff;--muted:#666;--dim:#333;--accent:#8dd900;
  --ok:#22c55e;--font:'Inter',-apple-system,sans-serif;
  --mono:'SF Mono','Fira Code',monospace;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

.h2{position:sticky;top:48px;z-index:99;background:var(--bg);border-bottom:1px solid var(--border)}
.breadcrumb{display:flex;align-items:center;gap:6px;padding:8px 16px 6px;font-size:11px;color:var(--muted);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.breadcrumb::-webkit-scrollbar{display:none}
.breadcrumb a,.breadcrumb .clickable{color:var(--muted);text-decoration:none;cursor:pointer}
.breadcrumb a:hover,.breadcrumb .clickable:hover{color:var(--text)}
.breadcrumb .sep{color:var(--dim);font-size:10px}
.breadcrumb .current{color:var(--text);font-weight:500}
.tabs{display:flex;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 8px 9px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:2px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;transition:color 120ms,border-color 120ms;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font);white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.content{max-width:480px;margin:0 auto;padding-bottom:100px}
.tab-panel{display:none}.tab-panel.active{display:block}

/* ── FLIGHT BOARD ── */
.board-wrap{padding:0}
.board-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;
  border-bottom:1px solid var(--border2);
}
.board-header-left{
  font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:4px;text-transform:uppercase;color:var(--accent);
}
.board-header-right{
  font-family:var(--mono);font-size:10px;color:var(--muted);
  letter-spacing:1px;
}
.board-cols{
  display:grid;
  grid-template-columns:6px 1fr 80px 54px;
  gap:0 12px;
  padding:6px 16px;
  border-bottom:1px solid var(--border);
}
.board-col-label{
  font-size:8px;font-weight:600;letter-spacing:3px;
  text-transform:uppercase;color:var(--dim);
  font-family:var(--mono);
}
.board-rows{border-bottom:1px solid var(--border)}

/* each row */
.brow{
  display:grid;
  grid-template-columns:6px 1fr 80px 54px;
  gap:0 12px;align-items:center;
  padding:14px 16px;
  border-top:1px solid var(--border);
  cursor:pointer;
  transition:background 120ms;
  /* flip-in animation */
  animation:rowFlip 260ms ease-out both;
  transform-origin:top center;
}
.brow:hover{background:var(--s1)}
.brow:active{background:var(--s2)}

@keyframes rowFlip{
  0%  {opacity:0;transform:perspective(400px) rotateX(-25deg) translateY(-6px)}
  100%{opacity:1;transform:perspective(400px) rotateX(0deg)   translateY(0)}
}

/* status dot */
.brow-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--dim);flex-shrink:0;justify-self:center;
}
.brow-dot.upcoming{background:var(--accent);box-shadow:0 0 6px rgba(141,217,0,.5)}
.brow-dot.active  {background:var(--ok);   box-shadow:0 0 6px rgba(34,197,94,.5)}
.brow-dot.past    {background:var(--dim)}

/* destination */
.brow-dest{min-width:0}
.brow-name{
  font-family:var(--mono);font-size:13px;font-weight:400;
  letter-spacing:.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-transform:uppercase;
}
.brow-date{
  font-size:10px;font-weight:300;color:var(--muted);
  font-family:var(--mono);margin-top:3px;letter-spacing:.5px;
}

/* departure date */
.brow-dep{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  text-align:right;letter-spacing:.5px;line-height:1.4;
}

/* countdown */
.brow-etd{text-align:right}
.brow-etd-days{
  font-family:var(--mono);font-size:13px;font-weight:500;
  color:var(--accent);letter-spacing:-0.5px;
}
.brow-etd-days.active{color:var(--ok)}
.brow-etd-days.past  {color:var(--dim)}
.brow-etd-label{
  font-size:8px;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted);margin-top:2px;
  font-family:var(--mono);
}
.brow-etd-label.upcoming{color:var(--accent)}
.brow-etd-label.active  {color:var(--ok)}

/* empty board */
.board-empty{
  padding:48px 16px;text-align:center;
  font-family:var(--mono);font-size:11px;letter-spacing:3px;
  text-transform:uppercase;color:var(--dim);
}

/* Itin header */
.itin-header{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.itin-trip-name{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.itin-trip-meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}

/* Day groups */
.day-group{border-bottom:1px solid var(--border)}
.day-header{display:flex;align-items:center;gap:12px;padding:12px 16px 8px;background:var(--s1)}
.day-num{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--text);line-height:1;width:28px}
.day-label{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted)}
.day-date{font-size:11px;color:var(--dim);margin-top:2px}

/* Segment rows */
/* ══ EQUIPAJE ══ */
.eq-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.eq-viaje{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--muted)}
.eq-add{background:none;border:1px solid var(--border2);border-radius:99px;padding:6px 12px;color:var(--accent);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer}
.eq-add:hover{border-color:var(--accent)}
.bulto{margin:0 16px 12px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--s1)}
.bulto-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.bulto-ico{flex:0 0 auto;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05)}
.bulto-ico svg{width:16px;height:16px}
.bulto-info{flex:1;min-width:0}
.bulto-nombre{font-size:14px;font-weight:600;line-height:1.2}
.bulto-meta{font-size:11px;color:var(--muted);margin-top:2px}
.bulto-dueno{display:inline-flex;align-items:center;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;padding:2px 8px;border-radius:99px;margin-left:6px}
.bulto-chev{flex:0 0 auto;color:var(--dim);transition:transform 160ms}
.bulto-chev.open{transform:rotate(90deg)}
.bulto-body{display:none;border-top:1px solid var(--border);padding:4px 0 8px}
.bulto-body.open{display:block}
.eq-item{display:flex;align-items:center;gap:10px;padding:8px 14px}
.eq-item:hover{background:var(--s2)}
.eq-check{flex:0 0 auto;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;background:none}
.eq-check.on{background:var(--accent);border-color:var(--accent)}
.eq-check svg{width:11px;height:11px;stroke:#000;display:none}
.eq-check.on svg{display:block}
.eq-nom{flex:1;min-width:0;font-size:13px}
.eq-nom.done{text-decoration:line-through;opacity:.45}
.eq-det{font-size:11px;color:var(--muted)}
.eq-qty{flex:0 0 auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.eq-del{flex:0 0 auto;background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px;padding:2px 6px}
.eq-additem{display:flex;gap:6px;padding:8px 14px 4px}
.eq-additem input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border2);border-radius:7px;padding:8px 10px;color:var(--text);font-family:inherit;font-size:12.5px;outline:none}
.eq-additem input:focus{border-color:var(--accent)}
.eq-additem button{flex:0 0 auto;background:var(--accent);border:none;border-radius:7px;padding:0 13px;color:#000;font-weight:700;font-size:15px;cursor:pointer}
.eq-sug{margin:0 14px;border:1px solid var(--border2);border-radius:8px;overflow:hidden;display:none}
.eq-sug.show{display:block}
.eq-sug div{padding:8px 11px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--border)}
.eq-sug div:last-child{border-bottom:none}
.eq-sug div:hover{background:var(--s2);color:var(--accent)}
.eq-sug small{color:var(--dim);margin-left:6px}

/* ══ ITINERARIO — tres tratamientos ══
   El transporte urbano NO es un evento: es lo que conecta dos momentos.
   Por eso va como riel fino entre tarjetas, no como tarjeta propia.
   Los vuelos y trayectos largos SI son tarjeta: parten el viaje en dos.  */

/* 1. RIEL — traslado corto entre dos puntos */
.rail{display:flex;align-items:center;gap:8px;padding:5px 16px 5px 72px;font-size:11px;color:var(--muted);cursor:pointer;transition:background 120ms}
.rail:hover{background:var(--s1)}
.rail-track{position:absolute;left:60px;width:2px;top:0;bottom:0;background:var(--border2);opacity:.5}
.rail-ico{flex:0 0 auto;width:16px;height:16px;opacity:.7;display:flex;align-items:center;justify-content:center}
.rail-ico svg{width:13px;height:13px}
.rail-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-dur{flex:0 0 auto;font-variant-numeric:tabular-nums;opacity:.65}
.rail.colored .rail-ico,.rail.colored .rail-txt{color:inherit;opacity:1}

/* 2. TARJETA DE QUIEBRE — vuelo / alojamiento.
   Un color por tipo, siempre el mismo. */
.seg-row.major{background:var(--s1);border-left:3px solid var(--accent);padding-top:14px;padding-bottom:14px}
.seg-row.major .seg-title{font-size:15px;font-weight:600}
.seg-row.vuelo{border-left-color:var(--vuelo)}
.seg-row.vuelo .seg-type{color:var(--vuelo)}
.seg-row.vuelo .seg-dot{border-color:var(--vuelo);background:var(--vuelo)}
.seg-row.aloj{border-left-color:var(--aloj)}
.seg-row.aloj .seg-type{color:var(--aloj)}
.seg-row.aloj .seg-dot{border-color:var(--aloj);background:var(--aloj)}
/* Chip de tramo: IDA / VUELTA, a la vista en la tarjeta */
.tramo{display:inline-flex;align-items:center;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;padding:2px 7px;border-radius:99px;margin-left:8px;vertical-align:middle}
.tramo.ida{color:var(--vuelo);background:rgba(125,185,255,.12);border:1px solid rgba(125,185,255,.35)}
.tramo.vuelta{color:#f59e0b;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35)}

/* 3. TARJETA NORMAL — chevron y lapiz */
.seg-acts{display:flex;align-items:center;gap:2px;flex-shrink:0;align-self:center}
.seg-act{background:none;border:none;padding:6px;cursor:pointer;color:var(--dim);display:flex;align-items:center;border-radius:6px;transition:color 120ms,background 120ms}
.seg-act:hover{color:var(--text);background:var(--s2)}
.seg-act svg{width:15px;height:15px}
.seg-chev{transition:transform 160ms}
.seg-chev.open{transform:rotate(90deg)}
.seg-more{display:none;padding:10px 16px 14px 72px;font-size:12.5px;color:var(--muted);line-height:1.55;border-top:1px dashed var(--border);white-space:pre-wrap}
.seg-more.open{display:block}
.seg-more b{color:var(--text);font-weight:600}

.seg-row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-top:1px solid var(--border);cursor:pointer;transition:background 120ms}
.seg-row:hover{background:var(--s1)}
.seg-time-col{width:44px;flex-shrink:0;text-align:right}
.seg-time{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text)}
.seg-duration{font-size:10px;color:var(--dim);margin-top:2px}
.seg-line{width:3px;background:var(--border2);align-self:stretch;flex-shrink:0;margin-top:4px;position:relative;border-radius:2px}
.seg-line.colored{width:4px}
.seg-dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--border2);background:var(--bg);position:absolute;top:0;left:50%;transform:translateX(-50%)}
.seg-dot.active{border-color:var(--accent);background:var(--accent)}
.seg-dot.colored{border-width:2px;background:currentColor}
.seg-linelabel{position:absolute;top:50%;left:8px;transform:translateY(-50%);font-size:8px;font-weight:700;letter-spacing:1px;white-space:nowrap;color:inherit;opacity:.85}
.seg-body{flex:1;min-width:0}
.seg-type{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:3px}
.seg-title{font-size:14px;font-weight:500;line-height:1.3}
.seg-sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.seg-badge{display:inline-block;margin-top:5px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;padding:2px 7px;border-radius:99px;background:var(--s2);border:1px solid var(--border2);color:var(--muted)}
.seg-badge.ok{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.2);color:var(--ok)}
.seg-right{flex-shrink:0;text-align:right}
.seg-code{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text)}
.seg-seat{font-size:11px;color:var(--muted);margin-top:2px}

/* Filter chips */
.filter-row{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.filter-row::-webkit-scrollbar{display:none}
.fchip{padding:5px 12px;border-radius:99px;background:var(--s1);border:1px solid var(--border2);color:var(--muted);font-size:11px;font-weight:500;cursor:pointer;transition:all 120ms;white-space:nowrap;font-family:var(--font)}
.fchip.active{background:rgba(141,217,0,.1);border-color:rgba(141,217,0,.3);color:var(--accent)}

/* FAB */
/* ── MODAL NUEVO VIAJE ── */
.nv-bg{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.65);align-items:flex-end;justify-content:center;padding:0}
.nv-bg.open{display:flex}
.nv-modal{width:100%;max-width:480px;background:var(--surface,#18181b);border:1px solid var(--border,#27272a);border-bottom:none;border-radius:16px 16px 0 0;padding:20px 18px 28px;max-height:90vh;overflow-y:auto}
.nv-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.nv-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:2.5px;color:var(--text,#fafafa)}
.nv-close{background:none;border:none;color:var(--muted,#a1a1aa);font-size:16px;cursor:pointer;padding:4px 8px}
.nv-field{margin-bottom:14px}
.nv-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nv-label{display:block;font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:2px;color:var(--muted,#a1a1aa);margin-bottom:6px}
.nv-input{width:100%;box-sizing:border-box;background:var(--s1,#09090b);border:1px solid var(--border2,#3f3f46);border-radius:8px;padding:11px 12px;color:var(--text,#fafafa);font-family:inherit;font-size:14px;outline:none}
.nv-input:focus{border-color:var(--accent,#8dd900)}
.nv-btn{width:100%;margin-top:6px;padding:13px;border:none;border-radius:10px;background:var(--accent,#8dd900);color:#000;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer}
.nv-btn:disabled{opacity:.5;cursor:default}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{width:min(480px,100%);max-height:92dvh;overflow-y:auto;background:#0d0d0d;border:1px solid var(--border2);border-radius:16px 16px 0 0;padding:20px 16px 32px;animation:slideUp 220ms ease-out}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:2.5px}
.mclose{width:28px;height:28px;border-radius:50%;background:var(--s2);border:none;color:var(--muted);cursor:pointer;font-size:13px;font-family:var(--font)}
.field{margin-bottom:13px}
.field-label{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted);margin-bottom:5px;display:block}
.fi{width:100%;background:var(--s1);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:10px 12px;font-size:14px;font-family:var(--font);outline:none;transition:border-color 120ms;appearance:none}
.fi:focus{border-color:var(--accent)}.fi::placeholder{color:var(--dim)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle-row{display:flex;gap:6px;flex-wrap:wrap}
.toggle-btn{flex:1;min-width:50px;padding:8px 4px;background:var(--s1);border:1px solid var(--border2);border-radius:6px;color:var(--muted);font-size:12px;font-weight:500;font-family:var(--font);cursor:pointer;transition:all 120ms;text-align:center}
.toggle-btn.active{background:var(--s2);border-color:var(--accent);color:var(--text)}
.submit-btn{width:100%;padding:13px;background:var(--accent);border:none;border-radius:8px;color:#000;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;margin-top:8px}

/* Transport line pills */
.seg-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}
.seg-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.seg-pill-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.seg-pill-arrow{color:var(--dim);font-size:10px;margin:0 2px}
.seg-pill.walk{background:rgba(255,255,255,.06);border:1px solid var(--border2);color:var(--muted)}

/* Event detail drawer */
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:180;align-items:flex-end;justify-content:center}
.drawer-overlay.open{display:flex}
.drawer{width:min(480px,100%);max-height:85dvh;overflow-y:auto;background:#0d0d0d;border:1px solid var(--border2);border-radius:16px 16px 0 0;padding:0 0 32px;animation:slideUp 200ms ease-out}
.drawer-handle{width:36px;height:4px;background:var(--dim);border-radius:2px;margin:12px auto 0}
.drawer-head{padding:16px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.drawer-tipo{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted);margin-bottom:4px}
.drawer-title{font-size:18px;font-weight:600;line-height:1.3;flex:1}
.drawer-hora{font-family:var(--mono);font-size:14px;color:var(--muted);flex-shrink:0;margin-top:3px}
.drawer-body{padding:16px}
.drawer-sec{margin-bottom:16px}
.drawer-sec-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted);margin-bottom:8px}
.drawer-desc{font-size:14px;color:#ccc;line-height:1.6}
.drawer-segment{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.drawer-segment:last-child{border-bottom:none}
.drawer-seg-line{width:4px;height:40px;border-radius:2px;flex-shrink:0}
.drawer-seg-body{flex:1}
.drawer-seg-linea{font-size:12px;font-weight:700}
.drawer-seg-route{font-size:12px;color:var(--muted);margin-top:2px}
.drawer-actions{display:flex;gap:8px;padding:0 16px;margin-top:4px}

<script>
const G_URL  = 'https://hahhmpvfyrmwnaqxibvt.supabase.co';
const G_KEY  = 'sb_publishable_WTjwtY_ghLdfShnDhkqHUA_u_1Hn762';
const ESC    = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// Avatar seguro: sin innerHTML, y solo URLs http(s)
function setAvatar(el, url) {
  el.textContent = '';
  var u = String(url||'');
  if (!/^https?:\/\//i.test(u)) return;
  var im = document.createElement('img');
  im.src = u;
  im.referrerPolicy = 'no-referrer';
  im.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%';
  el.appendChild(im);
}
const DIAS   = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES  = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESC   = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

let G_sb, G_hh, G_nombre = '';   // G_nombre: quien crea (created_by)
let G_viajes = [];
let G_items  = [];   // itinerario del viaje activo
let G_viaje  = null; // viaje activo
let G_filter = 'TODOS';

async function boot() {
  try {
    G_sb = supabase.createClient(G_URL, G_KEY, {auth:{persistSession:true,autoRefreshToken:true}});
    var s = await G_sb.auth.getSession();
    if (!s.data?.session) { window.location.href='/'; return; }
    var au = s.data.session.user;
    var ur = await G_sb.from('app_users').select('id,nombre,nombre_corto,avatar_url').eq('auth_id',au.id).single();
    var nombre = (ur.data?.nombre_corto||ur.data?.nombre||au.email.split('@')[0]).split(' ')[0];
    G_nombre = nombre;
    var ini=document.getElementById('pears-avatar-initial'); if(ini) ini.textContent=nombre.charAt(0).toUpperCase();
    var pn=document.getElementById('pm-name'); if(pn) pn.textContent=nombre;
    var pe=document.getElementById('pm-email'); if(pe) pe.textContent=au.email;
    if(ur.data?.avatar_url){var av=document.getElementById('pears-avatar');if(av)setAvatar(av, ur.data.avatar_url);}
    var hr = await G_sb.rpc('get_my_household_id');
    G_hh = hr.data;
    if(!G_hh){document.getElementById('viajes-grid').innerHTML='<div class="board-empty">— Error: sin household —</div>';return;}
    await loadViajes();
  startBoardClock();
  } catch(e) { console.error(e); }
}

async function loadViajes() {
  var r = await G_sb.from('viajes').select('*').eq('household_id',G_hh).order('fecha_inicio',{ascending:false});
  G_viajes = r.data || [];
  renderGrid();
}

function renderGrid() {
  var el = document.getElementById('viajes-grid');
  if (!G_viajes.length) {
    el.innerHTML = '<div class="board-empty">— Sin vuelos programados —</div>';
    return;
  }
  var now = new Date();
  var MESC = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

  el.innerHTML = G_viajes.map(function(v, i) {
    var inicio   = new Date(v.fecha_inicio + 'T00:00:00');
    var fin      = v.fecha_fin ? new Date(v.fecha_fin + 'T00:00:00') : null;
    var diffMs   = inicio - now;
    var diffDays = Math.ceil(diffMs / (1000*60*60*24));

    var dotClass, etdDays, etdLabel, etdLabelClass;
    if (diffDays > 0) {
      dotClass     = 'upcoming';
      etdDays      = diffDays + 'd';
      etdLabel     = 'ETD';
      etdLabelClass = 'upcoming';
    } else if (fin && now <= fin) {
      dotClass     = 'active';
      etdDays      = 'LIVE';
      etdLabel     = 'EN CURSO';
      etdLabelClass = 'active';
    } else {
      dotClass     = 'past';
      etdDays      = '—';
      etdLabel     = 'DONE';
      etdLabelClass = '';
    }

    var d   = inicio.getDate();
    var m   = MESC[inicio.getMonth()];
    var dep = d + ' ' + m;
    var nombre = (v.nombre || v.destino || 'SIN NOMBRE').toUpperCase();

    var dur = '';
    if (v.fecha_fin) {
      var dias = Math.round((fin - inicio) / (1000*60*60*24)) + 1;
      dur = '<div class="brow-date">' + dias + ' días</div>';
    }

    return '<div class="brow" onclick="openViaje(\''+v.id+'\')" style="animation-delay:'+(i*60)+'ms">' +
      '<div class="brow-dot '+dotClass+'"></div>' +
      '<div class="brow-dest">' +
        '<div class="brow-name">'+ESC(nombre)+'</div>' +
        dur +
      '</div>' +
      '<div class="brow-dep">'+dep+'</div>' +
      '<div class="brow-etd">' +
        '<div class="brow-etd-days '+dotClass+'">'+etdDays+'</div>' +
        '<div class="brow-etd-label '+etdLabelClass+'">'+etdLabel+'</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// Live clock for board header
function startBoardClock() {
  function tick() {
    var el = document.getElementById('board-clock');
    if (!el) return;
    var now = new Date();
    var hh  = String(now.getHours()).padStart(2,'0');
    var mm  = String(now.getMinutes()).padStart(2,'0');
    var ss  = String(now.getSeconds()).padStart(2,'0');
    el.textContent = hh + ':' + mm + ':' + ss;
  }
  tick();
  setInterval(tick, 1000);
}

async function openViaje(id) {
  G_viaje = G_viajes.find(function(v){return v.id===id;});
  if (!G_viaje) return;

  // Update breadcrumb
  document.getElementById('bc-sep2').style.display='inline';
  var bc=document.getElementById('bc-current');
  bc.style.display='inline';
  bc.textContent=G_viaje.nombre||G_viaje.destino;

  // Update header
  document.getElementById('itin-title').textContent   = G_viaje.nombre||G_viaje.destino;
  document.getElementById('itin-destino').textContent = G_viaje.destino||'';
  document.getElementById('itin-dates').textContent   = fmtFechaCorta(G_viaje.fecha_inicio)+(G_viaje.fecha_fin?' – '+fmtFechaCorta(G_viaje.fecha_fin):'');

  // Load items
  var r = await G_sb.from('viaje_itinerario').select('*')
    .eq('viaje_id', id)
    .order('fecha', {ascending:true})
    .order('hora',  {ascending:true});
  G_items = r.data || [];

  document.getElementById('itin-count').textContent = G_items.length + ' eventos';
  G_filter = 'TODOS';
  document.querySelectorAll('.fchip').forEach(function(c){c.classList.remove('active');});
  document.querySelector('.fchip').classList.add('active');

  document.getElementById('view-list').style.display   = 'none';
  document.getElementById('view-detail').style.display = 'block';
  document.getElementById('fab-btn').style.display = 'flex';
  var fnv = document.getElementById('fab-nuevo-viaje');
  if (fnv) fnv.style.display = 'none';
  renderItinerary();
}


// ══════════════════════════════════════════
// CREAR VIAJE
// Antes no existia: el modulo solo sabia LEER viajes. El unico que habia
// se habia cargado a mano por SQL.
// ══════════════════════════════════════════
function nvFmt(el) {
  var raw = (el.value || '').replace(/\D/g, '');
  el.value = raw ? new Intl.NumberFormat('es-PY').format(parseInt(raw)) : '';
}

function abrirNuevoViaje() {
  ['nv-nombre','nv-destino','nv-desde','nv-hasta','nv-presu','nv-nota']
    .forEach(function(id){ var e = document.getElementById(id); if (e) e.value = ''; });
  // Por defecto: salida hoy, regreso en una semana
  var hoy = new Date();
  var fmt = function(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  document.getElementById('nv-desde').value = fmt(hoy);
  var mas = new Date(hoy.getTime() + 7*24*60*60*1000);
  document.getElementById('nv-hasta').value = fmt(mas);
  document.getElementById('mNV').classList.add('open');
  setTimeout(function(){ document.getElementById('nv-nombre').focus(); }, 150);
}

function cerrarNuevoViaje() {
  document.getElementById('mNV').classList.remove('open');
}

async function crearViaje() {
  var nombre  = (document.getElementById('nv-nombre').value  || '').trim();
  var destino = (document.getElementById('nv-destino').value || '').trim();
  var desde   = document.getElementById('nv-desde').value;
  var hasta   = document.getElementById('nv-hasta').value;
  var presu   = parseInt((document.getElementById('nv-presu').value || '').replace(/\D/g,'')) || 0;
  var nota    = (document.getElementById('nv-nota').value || '').trim();

  if (!nombre)  { alert('Ponele un nombre al viaje.'); return; }
  if (!desde)   { alert('¿Cuándo salís?'); return; }
  if (hasta && hasta < desde) { alert('El regreso no puede ser antes de la salida.'); return; }
  if (!G_hh)    { alert('No se pudo identificar tu hogar. Recargá la página.'); return; }

  var btn = document.getElementById('nv-save');
  btn.disabled = true; btn.textContent = 'Creando...';

  var viaje = {
    id: 'v_' + (crypto.randomUUID ? crypto.randomUUID().substring(0,12) : Date.now()),
    nombre: nombre,
    destino: destino || null,
    fecha_inicio: desde,
    fecha_fin: hasta || null,
    presupuesto_pyg: presu,
    nota: nota || null,
    status: 'PLANIFICADO',
    created_by: G_nombre,
    household_id: G_hh
  };

  var r = await G_sb.from('viajes').insert(viaje);
  btn.disabled = false; btn.textContent = 'Crear viaje';

  if (r.error) { alert('No se pudo crear: ' + r.error.message); console.error(r.error); return; }

  cerrarNuevoViaje();
  await loadViajes();
  openViaje(viaje.id);   // entrar directo a cargar el itinerario
}

// ══════════════════════════════════════════
// ITINERARIO — riel vs tarjeta
// Criterio: el transporte URBANO conecta dos momentos (riel fino).
// El vuelo o trayecto largo abre un capitulo del viaje (tarjeta ancha).
// ══════════════════════════════════════════
var MODO_SVG = {
  metro:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="13" rx="2"/><path d="M8 20l-2 2M16 20l2 2M4 16h16"/><circle cx="8.5" cy="12.5" r=".8" fill="currentColor"/><circle cx="15.5" cy="12.5" r=".8" fill="currentColor"/></svg>',
  bus:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="M4 11h16M7 20v-2M17 20v-2"/></svg>',
  caminar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="13" cy="4" r="1.6"/><path d="M11 21l2-5-2-3 1-4 3 2 2 1M11 13l-2 3"/></svg>',
  taxi:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17h14M4 13l1.5-5h13L20 13v4H4z"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/><path d="M9 5h6"/></svg>',
  tren:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="13" rx="2"/><path d="M5 11h14M8 20l-2 2M16 20l2 2"/></svg>',
  barco:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 18c2 0 2 1.5 4.5 1.5S10 18 12 18s2 1.5 4.5 1.5S19 18 21 18M5 18l1.5-6h11L19 18M12 12V5M8 8h8"/></svg>',
  otro:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
};

function modoDe(item) {
  var t = ((item.transporte || '') + ' ' + (item.titulo || '')).toLowerCase();
  if (/metro|subte|u-?bahn|tube|linea\s*\d|línea\s*\d|^l\d/.test(t)) return 'metro';
  if (/bus|colectivo|micro|autobus|autobús/.test(t))                   return 'bus';
  if (/pie|caminar|walk|caminata/.test(t))                             return 'caminar';
  if (/taxi|uber|cabify|bolt|remis/.test(t))                           return 'taxi';
  if (/tren|train|rail|ferrocarril/.test(t))                           return 'tren';
  if (/ferry|barco|boat/.test(t))                                      return 'barco';
  return 'otro';
}

// ¿Va como riel fino?
// El default es TARJETA. El riel hay que ganarselo: solo saltos urbanos
// cortos (metro, bus, a pie, taxi) o eventos con linea/segmentos cargados.
// Asi un "Tren Bergen → Oslo" sigue siendo una tarjeta, que es lo correcto:
// un trayecto de horas parte el viaje, no lo conecta.
function esRiel(item) {
  if (item.tipo !== 'TRANSPORTE') return false;

  // Con segmentos de transporte cargados, es claramente un traslado urbano
  if (item.transporte_segmentos && item.transporte_segmentos.length) return true;

  var t = ((item.transporte || '') + ' ' + (item.titulo || '')).toLowerCase();

  // Trayectos que abren capitulo: siempre tarjeta
  if (/tren|train|vuelo|flight|aeropuerto|airport|puerto|ferry|crucero|rental|alquiler|intercity|nocturno/.test(t)) return false;

  // Saltos urbanos: riel
  return /metro|subte|u-?bahn|tube|bus|colectivo|micro|tranv|tram|taxi|uber|cabify|bolt|a pie|caminar|walk|línea\s*\d|linea\s*\d|\bl\d\b/.test(t);
}

// Detalle que se despliega con el chevron
function detalleDe(item) {
  var p = [];
  // Un vuelo muestra lo suyo primero: ruta, horarios, reserva, asiento
  var d = item.detalle || {};
  if (item.tipo === 'ALOJAMIENTO' && Object.keys(d).length) {
    if (d.alojamiento) p.push('<b>Tipo:</b> ' + ESC(d.alojamiento));
    if (d.entrada || d.salida) {
      var noches = (d.entrada && d.salida)
        ? Math.round((new Date(d.salida) - new Date(d.entrada)) / 86400000) : null;
      p.push('<b>Estadía:</b> ' + ESC((d.entrada||'?').split('-').reverse().join('/')) +
             ' → ' + ESC((d.salida||'?').split('-').reverse().join('/')) +
             (noches > 0 ? ' · ' + noches + ' noche' + (noches===1?'':'s') : ''));
    }
    if (d.hora_entrada || d.hora_salida)
      p.push('<b>Horarios:</b> in ' + ESC(d.hora_entrada||'—') + ' · out ' + ESC(d.hora_salida||'—'));
    if (d.habitacion) p.push('<b>Habitación:</b> ' + ESC(d.habitacion));
    if (d.huespedes)  p.push('<b>Huéspedes:</b> ' + ESC(String(d.huespedes)));
    if (d.pnr)        p.push('<b>Reserva:</b> ' + ESC(d.pnr));
    if (d.incluye)    p.push('<b>Incluye:</b> ' + ESC(d.incluye));
  }
  if (item.tipo === 'VUELO' && Object.keys(d).length) {
    if (d.aerolinea || d.numero)
      p.push('<b>Vuelo:</b> ' + ESC([d.aerolinea, d.numero].filter(Boolean).join(' ')));
    if (d.origen || d.destino)
      p.push('<b>Ruta:</b> ' + ESC(d.origen||'?') +
             (d.terminal_sal ? ' ('+ESC(d.terminal_sal)+')' : '') + ' → ' + ESC(d.destino||'?') +
             (d.terminal_lleg ? ' ('+ESC(d.terminal_lleg)+')' : ''));
    if (d.hora_llegada)
      p.push('<b>Llegada:</b> ' + ESC(d.hora_llegada) +
             (d.fecha_llegada && d.fecha_llegada !== item.fecha ? ' del ' + ESC(d.fecha_llegada.split('-').reverse().join('/')) : ''));
    if (d.pnr) p.push('<b>Reserva:</b> ' + ESC(d.pnr));
    if (d.pasajeros && d.pasajeros.length) {
      d.pasajeros.forEach(function(px, i) {
        var linea = [];
        if (px.asiento)  linea.push('asiento ' + ESC(px.asiento));
        if (px.ticket)   linea.push('ticket ' + ESC(px.ticket));
        if (px.equipaje) linea.push(ESC(px.equipaje));
        p.push('<b>' + ESC(px.nombre || ('Pasajero ' + (i+1))) + ':</b> ' +
               (linea.length ? linea.join(' · ') : 'sin datos'));
      });
    }
    // Vuelos cargados antes de separar por pasajero
    if (!d.pasajeros && d.asiento)  p.push('<b>Asiento:</b> ' + ESC(d.asiento));
    if (!d.pasajeros && d.equipaje) p.push('<b>Equipaje:</b> ' + ESC(d.equipaje));
  }
  if (d.lugar)            p.push('<b>Lugar:</b> ' + ESC(d.lugar));
  if (d.hora_fin)         p.push('<b>Hasta:</b> ' + ESC(d.hora_fin));
  // Segmentos de transporte: linea, paradas y horarios estimados
  if (item.transporte_segmentos && item.transporte_segmentos.length) {
    item.transporte_segmentos.forEach(function(sg) {
      var t = [];
      if (sg.linea) t.push(ESC(sg.linea));
      if (sg.desde || sg.hasta) t.push(ESC(sg.desde||'?') + ' → ' + ESC(sg.hasta||'?'));
      if (sg.hora_salida || sg.hora_llegada)
        t.push(ESC(sg.hora_salida||'—') + '–' + ESC(sg.hora_llegada||'—'));
      if (t.length) p.push('<b>' + ESC(sg.modo||'Tramo') + ':</b> ' + t.join(' · '));
    });
  }
  if (item.ciudad)        p.push('<b>Ciudad:</b> ' + ESC(item.ciudad));
  if (item.direccion)     p.push('<b>Dirección:</b> ' + ESC(item.direccion));
  if (item.transporte)    p.push('<b>Línea:</b> ' + ESC(item.transporte));
  if (item.codigo_acceso) p.push('<b>Código:</b> ' + ESC(item.codigo_acceso));
  if (item.precio_ref)    p.push('<b>Precio:</b> ' + ESC(String(item.precio_ref)) + ' ' + ESC(item.moneda || ''));
  if (item.link_web)      p.push('<b>Link:</b> ' + ESC(item.link_web));
  if (item.descripcion)   p.push(ESC(item.descripcion));
  if (item.notas)         p.push(ESC(item.notas));
  return p.length ? p.join('\n') : 'Sin detalles cargados.';
}

function toggleDetalle(id, btn) {

function renderItinerary() {
  var el = document.getElementById('itin-days');
  var items = G_filter==='TODOS' ? G_items : G_items.filter(function(i){return i.tipo===G_filter;});

  if (!items.length) {
    el.innerHTML='<div style="padding:40px 16px;text-align:center;color:var(--dim);font-size:13px">Sin eventos de este tipo</div>';
    return;
  }

  // Group by fecha
  var byDay = {};
  var dayOrder = [];
  items.forEach(function(item) {
    var f = item.fecha;
    if (!byDay[f]) { byDay[f]=[]; dayOrder.push(f); }
    byDay[f].push(item);
  });

  var startDate = G_viaje.fecha_inicio;
  var html = '';
  dayOrder.forEach(function(fecha) {
    var dayItems = byDay[fecha];
    var dt = new Date(fecha+'T00:00:00');
    var startDt = new Date(startDate+'T00:00:00');
    var dayNum = Math.round((dt-startDt)/(86400000))+1;

    html += '<div class="day-group">' +
      '<div class="day-header">' +
        '<div class="day-num">'+String(dayNum).padStart(2,'0')+'</div>' +
        '<div>' +
          '<div class="day-label">'+DIAS[dt.getDay()]+'</div>' +
          '<div class="day-date">'+dt.getDate()+' '+MESES[dt.getMonth()]+' '+dt.getFullYear()+'</div>' +
        '</div>' +
      '</div>';

    dayItems.forEach(function(item) {
      var hora = item.hora ? item.hora.slice(0,5) : '';
      var tipo = normTipo(item.tipo);
      var isVuelo = item.tipo==='VUELO';
      var dotClass = (isVuelo||item.tipo==='ALOJAMIENTO') ? ' active' : '';
      var lineColor = item.transporte_color || '';
      var lineStyle = lineColor ? 'background:'+lineColor+';color:'+lineColor : '';
      var lineClass = lineColor ? ' colored' : '';
      var dotStyle  = lineColor ? 'border-color:'+lineColor+';background:'+lineColor : '';

      // Extract flight code from title for right column
      var code='', seat='';
      if (isVuelo) {
        var m = (item.titulo||'').match(/([A-Z]{2}\d{3,4}|[A-Z0-9]{2}\s\d{3,4})/);
        if (m) code=m[0].replace(' ','');
      }

      // Line number badge for colored transport (e.g. "L5" from transporte field)
      var lineNum = '';
      if (lineColor && item.transporte) {
        lineNum = '<span class="seg-linelabel">'+ESC(item.transporte)+'</span>';
      }

      // Badge if confirmed/has code
      var badge = item.codigo_acceso ? '<span class="seg-badge ok">Confirmado</span>' : '';
      // Color chip badge
      var colorChip = lineColor ? '<span class="seg-badge" style="background:'+lineColor+'22;border-color:'+lineColor+'55;color:'+lineColor+'">'+ESC(item.transporte||'Línea')+'</span>' : '';

      // Transport pills from transporte_segmentos
      var pills = '';
      var segs = item.transporte_segmentos;
      if (segs && segs.length) {
        pills = '<div class="seg-pills">';
        segs.forEach(function(seg, si) {
          if (seg.modo === 'caminar' || seg.modo === 'walk') {
            pills += '<span class="seg-pill walk">🚶 A pie</span>';
          } else if (seg.linea || seg.color) {
            var bg   = seg.color ? seg.color+'22' : 'rgba(255,255,255,.06)';
            var bdr  = seg.color ? seg.color+'55' : 'var(--border2)';
            var col  = seg.color || 'var(--muted)';
            pills += '<span class="seg-pill" style="background:'+bg+';border:1px solid '+bdr+';color:'+col+'">' +
              '<span class="seg-pill-dot" style="background:'+col+'"></span>' +
              ESC(seg.linea||seg.modo||'Línea') +
              (seg.hasta ? '<span style="font-weight:400;opacity:.75"> → '+ESC(seg.hasta)+'</span>' : '') +
            '</span>';
          }
          if (si < segs.length-1 && segs[si+1] && segs[si+1].modo !== 'caminar') {
            pills += '<span class="seg-pill-arrow">→</span>';
          }
        });
        pills += '</div>';
      }

      // ── 1. RIEL: traslado urbano. No es un evento, es el pegamento. ──
      if (esRiel(item)) {
        var modo = modoDe(item);
        var col  = lineColor ? 'color:'+lineColor : '';
        var partes = [];
        if (item.transporte) partes.push(ESC(item.transporte));
        if (item.ciudad)     partes.push('→ ' + ESC(item.ciudad));
        if (!partes.length)  partes.push(ESC(item.titulo || 'Traslado'));
        html += '<div class="rail'+(lineColor?' colored':'')+'" style="'+col+'" onclick="openEvento(\''+item.id+'\')">' +
          '<span class="rail-ico">'+(MODO_SVG[modo]||MODO_SVG.otro)+'</span>' +
          '<span class="rail-txt">'+partes.join(' ')+'</span>' +
          (hora?'<span class="rail-dur">'+hora+'</span>':'') +
        '</div>';
        return;
      }

      // ── 2. TARJETA. Vuelos y alojamiento como quiebre; el resto normal. ──
      var esAloj  = (item.tipo === 'ALOJAMIENTO');
      var esMajor = isVuelo || esAloj;
      var clsTipo = isVuelo ? ' vuelo' : (esAloj ? ' aloj' : '');
      var det = detalleDe(item);

      // Chip IDA / VUELTA, visible sin desplegar
      var tramo = (item.detalle && item.detalle.tramo) ? item.detalle.tramo : '';
      var chipTramo = tramo
        ? '<span class="tramo '+(tramo==='vuelta'?'vuelta':'ida')+'">'+(tramo==='vuelta'?'Vuelta':'Ida')+'</span>'
        : '';

      html += '<div class="seg-row'+(esMajor?' major':'')+clsTipo+'">' +
        '<div class="seg-time-col">' +
          (hora?'<div class="seg-time">'+hora+'</div>':'') +
        '</div>' +
        '<div class="seg-line'+lineClass+'" style="'+lineStyle+'">' +
          '<div class="seg-dot'+(lineColor?' colored':dotClass)+'" style="'+dotStyle+'"></div>' +
          lineNum +
        '</div>' +
        '<div class="seg-body" onclick="toggleDetalle(\''+item.id+'\', this.parentNode.querySelector(\'.seg-act\'))">' +
          '<div class="seg-type">'+tipo+'</div>' +
          '<div class="seg-title">'+ESC(item.titulo||'—')+chipTramo+'</div>' +
          (item.descripcion?'<div class="seg-sub">'+ESC(item.descripcion.split('\n')[0].slice(0,100))+'</div>':'') +
          badge + colorChip + pills +
        '</div>' +
        (code?'<div class="seg-right"><div class="seg-code">'+code+'</div></div>':'') +
        '<div class="seg-acts">' +
          '<button class="seg-act" title="Ver más" onclick="event.stopPropagation();toggleDetalle(\''+item.id+'\', this)">' +
            '<svg class="seg-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>' +
          '</button>' +
          '<button class="seg-act" title="Editar" onclick="event.stopPropagation();openEvento(\''+item.id+'\')">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div class="seg-more" id="more-'+item.id+'">'+det+'</div>';
    });

    html += '</div>';
  });

  el.innerHTML = html;
}

// ── Helpers ──────────────────────────────────────
function normTipo(t) {
  var map={VUELO:'Vuelo',TRANSPORTE:'Transporte',ALOJAMIENTO:'Alojamiento',COMIDA:'Comida',ACTIVIDAD:'Actividad'};
  return map[t] || (t||'Evento').charAt(0)+t.slice(1).toLowerCase();
}
function fmtFechaCorta(d) {
  if (!d) return '';
  var dt = new Date(d+'T00:00:00');
  return dt.getDate()+' '+MESC[dt.getMonth()]+' '+dt.getFullYear();
}

var EQ_BULTOS = [], EQ_ITEMS = {}, EQ_CAT = [], EQ_MIEMBROS = [];

var BULTO_SVG = {
  valija:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3M3 12h18"/></svg>',

function colorDe(nombre) {
  if (!nombre) return 'var(--compartido)';
  var n = nombre.toLowerCase();
  if (n.indexOf('caro') === 0)  return 'var(--caro)';
  if (n.indexOf('santi') === 0) return 'var(--santi)';
  return 'var(--compartido)';
}

async function cargarEquipaje() {
  if (!G_viaje) {
    document.getElementById('eq-vacio').style.display = 'block';
    document.getElementById('eq-wrap').style.display  = 'none';
    return;
  }
  document.getElementById('eq-vacio').style.display = 'none';
  document.getElementById('eq-wrap').style.display  = 'block';
  document.getElementById('eq-viaje-nombre').textContent = G_viaje.nombre || '';

  try {
    if (!EQ_CAT.length) {
      var rc = await G_sb.from('productos').select('id,nombre,categoria')
                 .eq('modulo','equipaje').order('categoria').order('nombre');
      EQ_CAT = rc.data || [];
    }
    if (!EQ_MIEMBROS.length) {
      var rm = await G_sb.from('household_members').select('user_id').eq('household_id', G_hh);
      var ids = (rm.data || []).map(function(m){ return m.user_id; });
      if (ids.length) {
        var ru = await G_sb.from('app_users').select('nombre,nombre_corto').in('id', ids);
        EQ_MIEMBROS = (ru.data || []).map(function(u){ return (u.nombre_corto||u.nombre||'').split(' ')[0]; }).filter(Boolean);
      }
    }
    var rb = await G_sb.from('bultos').select('*').eq('viaje_id', G_viaje.id).order('orden').order('created_at');
    EQ_BULTOS = rb.data || [];

    EQ_ITEMS = {};
    if (EQ_BULTOS.length) {
      var ri = await G_sb.from('bulto_items').select('*')
                 .in('bulto_id', EQ_BULTOS.map(function(b){ return b.id; }))
                 .order('orden').order('added_at');
      (ri.data || []).forEach(function(it) {
        (EQ_ITEMS[it.bulto_id] = EQ_ITEMS[it.bulto_id] || []).push(it);
      });
    }
    renderEquipaje();
  } catch (e) { console.error('[equipaje]', e); }
}

function renderEquipaje() {
  var el = document.getElementById('eq-bultos');
  if (!EQ_BULTOS.length) {
    el.innerHTML = '<div style="padding:28px 16px;text-align:center;color:var(--dim);font-size:13px;line-height:1.6">' +
      'Sin bultos todavía.<br>Creá una valija, una mochila o un neceser.</div>';
    return;
  }
  el.innerHTML = EQ_BULTOS.map(function(b) {
    var items = EQ_ITEMS[b.id] || [];
    var listos = items.filter(function(i){ return i.checked; }).length;
    var col = colorDe(b.dueno);
    var rot = b.dueno
      ? '<span class="bulto-dueno" style="color:'+col+';background:'+col+'1a;border:1px solid '+col+'40">'+ESC(b.dueno)+'</span>'
      : '<span class="bulto-dueno" style="color:var(--compartido);background:rgba(161,161,170,.1);border:1px solid rgba(161,161,170,.3)">Compartido</span>';
    var peso = [];
    if (b.peso_real_kg) peso.push(b.peso_real_kg + ' kg');
    if (b.limite_kg)    peso.push('máx ' + b.limite_kg + ' kg');

    return '<div class="bulto">' +
      '<div class="bulto-head" onclick="toggleBulto(\''+b.id+'\', this)">' +
        '<span class="bulto-ico" style="color:'+col+'">'+(BULTO_SVG[b.tipo]||BULTO_SVG.otro)+'</span>' +
        '<span class="bulto-info">' +
          '<span class="bulto-nombre">'+ESC(b.nombre)+rot+'</span>' +
          '<div class="bulto-meta">'+listos+' de '+items.length+' listo'+(items.length===1?'':'s')+
            (peso.length?' · '+peso.join(' · '):'')+'</div>' +
        '</span>' +
        '<svg class="bulto-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="16" height="16"><path d="M9 6l6 6-6 6"/></svg>' +
        '<button class="eq-del" onclick="event.stopPropagation();borrarBulto(\''+b.id+'\')" title="Eliminar bulto">×</button>' +
      '</div>' +
      '<div class="bulto-body" id="bb-'+b.id+'">' +
        items.map(function(it) {
          var det = [it.marca, it.color].filter(Boolean).join(' · ');
          return '<div class="eq-item">' +
            '<button class="eq-check'+(it.checked?' on':'')+'" onclick="tildarItem(\''+it.id+'\')">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' +
            '</button>' +
            '<span class="eq-nom'+(it.checked?' done':'')+'">'+ESC(it.nombre)+
              (det?'<span class="eq-det"> · '+ESC(det)+'</span>':'')+'</span>' +
            (it.cantidad > 1 ? '<span class="eq-qty">×'+it.cantidad+'</span>' : '') +
            '<button class="eq-del" onclick="borrarItem(\''+it.id+'\')">×</button>' +
          '</div>';
        }).join('') +
        '<div class="eq-additem">' +
          '<input id="ai-'+b.id+'" placeholder="Agregar — ej: Medias térmicas" autocomplete="off" ' +
            'oninput="sugEq(\''+b.id+'\', this.value)" onblur="setTimeout(function(){ocultarSug(\''+b.id+'\')},160)" ' +
            'onkeydown="if(event.key===\'Enter\')agregarItem(\''+b.id+'\')">' +
          '<button onclick="agregarItem(\''+b.id+'\')">+</button>' +
        '</div>' +
        '<div class="eq-sug" id="sug-'+b.id+'"></div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ── Texto predictivo sobre el catalogo de equipaje ──
function sugEq(bultoId, q) {
  var box = document.getElementById('sug-' + bultoId);
  var t = (q || '').toLowerCase().trim();
  if (t.length < 2) { box.classList.remove('show'); return; }
  var res = EQ_CAT.filter(function(p){ return p.nombre.toLowerCase().indexOf(t) !== -1; }).slice(0, 6);
  if (!res.length) { box.classList.remove('show'); return; }
  box.innerHTML = res.map(function(p) {
    return '<div onmousedown="pickEq(\''+bultoId+'\',\''+ESC(p.nombre).replace(/'/g,"\\'")+'\')">' +
      ESC(p.nombre) + '<small>' + ESC(p.categoria||'') + '</small></div>';
  }).join('');
  box.classList.add('show');
}
function pickEq(bultoId, nombre) {
  document.getElementById('ai-' + bultoId).value = nombre;
  ocultarSug(bultoId);
  agregarItem(bultoId);
}
function ocultarSug(bultoId) {
  var b = document.getElementById('sug-' + bultoId);
  if (b) b.classList.remove('show');
}

async function agregarItem(bultoId) {
  var inp = document.getElementById('ai-' + bultoId);
  var n = (inp.value || '').trim();
  if (n.length < 2) return;
  ocultarSug(bultoId);
  var cat = EQ_CAT.find(function(p){ return p.nombre.toLowerCase() === n.toLowerCase(); });
  var r = await G_sb.from('bulto_items').insert({
    bulto_id: bultoId, household_id: G_hh, nombre: n,
    categoria: cat ? cat.categoria : null,
    producto_id: cat ? cat.id : null,
    cantidad: 1, added_by: G_nombre,
    orden: (EQ_ITEMS[bultoId] || []).length + 1
  });
  if (r.error) { alert('No se pudo agregar: ' + r.error.message); return; }
  inp.value = '';
  await cargarEquipaje();
  var b = document.getElementById('bb-' + bultoId);
  if (b) { b.classList.add('open'); document.getElementById('ai-' + bultoId).focus(); }
}

async function tildarItem(id) {
  var actual = null;
  Object.keys(EQ_ITEMS).forEach(function(k) {
    var f = EQ_ITEMS[k].find(function(i){ return i.id === id; });
    if (f) actual = f;
  });
  if (!actual) return;
  var r = await G_sb.from('bulto_items').update({ checked: !actual.checked }).eq('id', id);
  if (r.error) { alert('No se pudo marcar: ' + r.error.message); return; }
  actual.checked = !actual.checked;
  var abiertos = Array.prototype.map.call(document.querySelectorAll('.bulto-body.open'), function(e){ return e.id; });
  renderEquipaje();
  abiertos.forEach(function(bid) {
    var e = document.getElementById(bid);
    if (e) { e.classList.add('open'); var h = e.parentNode.querySelector('.bulto-chev'); if (h) h.classList.add('open'); }
  });
}

async function borrarItem(id) {
  var r = await G_sb.from('bulto_items').delete().eq('id', id);
  if (r.error) { alert('No se pudo eliminar: ' + r.error.message); return; }
  cargarEquipaje();
}

async function abrirNuevoBulto() {
  if (!G_viaje) { alert('Elegí un viaje primero.'); return; }
  var tipo = prompt('Tipo de bulto:\n\nvalija · mochila · neceser · bolso · otro', 'valija');
  if (!tipo) return;
  tipo = tipo.trim().toLowerCase();
  if (['valija','mochila','neceser','bolso','otro'].indexOf(tipo) === -1) { alert('Tipo no válido.'); return; }

  var nombre = prompt('Nombre del bulto:', tipo.charAt(0).toUpperCase() + tipo.slice(1));
  if (!nombre) return;

  var opciones = EQ_MIEMBROS.concat(['compartido']);
  var dueno = prompt('¿De quién es?\n\n' + opciones.join(' · '), EQ_MIEMBROS[0] || 'compartido');
  if (dueno === null) return;
  dueno = dueno.trim();
  if (!dueno || dueno.toLowerCase() === 'compartido') dueno = null;

  var lim = prompt('Límite de peso en kg (opcional):', tipo === 'valija' ? '23' : '');
  var limite = lim ? parseFloat(lim.replace(',', '.')) : null;

  var r = await G_sb.from('bultos').insert({
    viaje_id: G_viaje.id, household_id: G_hh, tipo: tipo,
    nombre: nombre.trim(), dueno: dueno,
    limite_kg: (limite && !isNaN(limite)) ? limite : null,
    orden: EQ_BULTOS.length + 1, created_by: G_nombre
  });
  if (r.error) { alert('No se pudo crear: ' + r.error.message); return; }
  cargarEquipaje();
}

async function borrarBulto(id) {
  var b = EQ_BULTOS.find(function(x){ return x.id === id; });
  var n = (EQ_ITEMS[id] || []).length;
  if (!confirm('¿Eliminar "' + (b ? b.nombre : '') + '"?' + (n ? '\n\nSe borran también sus ' + n + ' artículos.' : ''))) return;
  var r = await G_sb.from('bultos').delete().eq('id', id);
  if (r.error) { alert('No se pudo eliminar: ' + r.error.message); return; }
  cargarEquipaje();
}

// ── PDF Itinerario ──────────────────────────────────
function exportItinerarioPDF() {
  if (!window.jspdf) { flash('Cargando PDF...','ok'); return; }
  if (!G_viaje || !G_items || !G_items.length) { flash('Sin datos para exportar','warn'); return; }

  var { jsPDF } = window.jspdf;
  var doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  var W = doc.internal.pageSize.getWidth();
  var H = doc.internal.pageSize.getHeight();
  var MAR = 14;

  var nombre = (G_viaje.nombre || G_viaje.destino || 'Viaje');
  var fechas  = fmtFechaCorta(G_viaje.fecha_inicio) + (G_viaje.fecha_fin ? ' – ' + fmtFechaCorta(G_viaje.fecha_fin) : '');

  // ── Header (ink-friendly, no blocks) ──
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.setTextColor(141,217,0);
  doc.text('PEARS', MAR, 13);

  var pearsW = doc.getTextWidth('PEARS');

  doc.setFontSize(13); doc.setFont('helvetica','bold');
  doc.setTextColor(30,30,30);
  doc.text(nombre, MAR + pearsW + 3, 13);

  doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.setTextColor(120,120,120);
  doc.text(fechas + '  ·  ' + G_items.length + ' eventos  ·  ' + new Date().toLocaleDateString('es-PY'), MAR, 19);

  // thin orange rule under header
  doc.setDrawColor(141,217,0);
  doc.setLineWidth(0.5);
  doc.line(MAR, 23, W - MAR, 23);

  // ── Group by day ──
  var byDay = {};
  var dayOrder = [];
  G_items.forEach(function(item){
    var d = item.fecha || '—';
    if (!byDay[d]) { byDay[d] = []; dayOrder.push(d); }
    byDay[d].push(item);
  });
  dayOrder.sort();

  var DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  var MESC = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var TIPO_ICON = { VUELO:'✈', TRANSPORTE:'⬡', ALOJAMIENTO:'⌂', COMIDA:'◈', ACTIVIDAD:'◆', OTRO:'·' };

  var curY = 30;
  var dayNum = 0;

  function addPage() {
    // footer on current page
    doc.setFontSize(7); doc.setTextColor(180,180,180);
    doc.setDrawColor(220,220,220); doc.setLineWidth(0.3);
    doc.line(MAR, H-12, W-MAR, H-12);
    doc.text('PEARS · ' + nombre, MAR, H-7);
    doc.text('Pág. ' + doc.internal.getCurrentPageInfo().pageNumber, W-MAR, H-7, {align:'right'});
    doc.addPage();
    curY = 16;
  }

  dayOrder.forEach(function(fecha){
    dayNum++;
    var eventos = byDay[fecha];
    if (curY > H - 45) addPage();

    var dateObj  = new Date(fecha + 'T00:00:00');
    var dayLabel = 'DÍA ' + dayNum + '  ' + DIAS[dateObj.getDay()].toUpperCase() + ' ' + dateObj.getDate() + ' ' + MESC[dateObj.getMonth()].toUpperCase();

    // Day header: thin gray line + orange label
    doc.setDrawColor(220,220,220); doc.setLineWidth(0.3);
    doc.line(MAR, curY, W-MAR, curY);
    doc.setFontSize(8); doc.setFont('helvetica','bold');
    doc.setTextColor(141,217,0);
    doc.text(dayLabel, MAR, curY + 5);
    curY += 10;

    eventos.forEach(function(item){
      if (curY > H - 22) addPage();

      var hora  = item.hora ? item.hora.slice(0,5) : '—:—';
      var tipo  = item.tipo || 'OTRO';
      var title = (item.titulo || '—').substring(0,52);
      var segs  = item.transporte_segmentos || [];

      // ── Row: hora | title ──
      doc.setFontSize(8); doc.setFont('helvetica','normal');
      doc.setTextColor(150,150,150);
      doc.text(hora, MAR, curY);

      doc.setFontSize(9); doc.setFont('helvetica','bold');
      doc.setTextColor(20,20,20);
      doc.text(title, MAR+14, curY);

      curY += 5;

      // ── Detail line ──
      var details = [];

      // Vuelo: número + aerolínea desde descripción
      if (tipo === 'VUELO') {
        if (item.codigo_acceso) details.push('Ref: ' + item.codigo_acceso);
        if (item.descripcion) {
          // extract flight number pattern (e.g. AY1654, IB3456)
          var flightMatch = item.descripcion.match(/\b[A-Z]{2}\d{3,4}\b/g);
          if (flightMatch) details.push(flightMatch.join(' · '));
          // extract airline if "operado por" pattern
          var operMatch = item.descripcion.match(/operado por ([^,\n]+)/i);
          if (operMatch) details.push(operMatch[1].trim().substring(0,30));
        }
      }

      // Transporte / metro: segments con color
      if (segs.length) {
        segs.forEach(function(s){
          if (s.linea || s.modo) {
            var segStr = [s.linea, s.desde && s.hasta ? s.desde + ' → ' + s.hasta : ''].filter(Boolean).join('  ');
            details.push(segStr.substring(0,45));
          }
        });
      }

      // Alojamiento: código acceso
      if (tipo === 'ALOJAMIENTO' && item.codigo_acceso) {
        details.push('Ref: ' + item.codigo_acceso);
      }

      // Generic: pull from descripcion if nothing yet
      if (!details.length && item.descripcion) {
        details.push(item.descripcion.split('\n')[0].substring(0,55));
      }

      if (details.length) {
        details.forEach(function(det, di){
          if (curY > H-18) return;
          // colored dot for seg color if available
          if (segs[di] && segs[di].color) {
            var hex = segs[di].color.replace('#','');
            var r = parseInt(hex.substring(0,2),16);
            var g = parseInt(hex.substring(2,4),16);
            var b = parseInt(hex.substring(4,6),16);
            doc.setFillColor(r,g,b);
            doc.circle(MAR+13, curY-1.2, 1.5, 'F');
            doc.setFontSize(7.5); doc.setFont('helvetica','normal');
            doc.setTextColor(90,90,90);
            doc.text(det, MAR+17, curY);
          } else {
            doc.setFontSize(7.5); doc.setFont('helvetica','normal');
            doc.setTextColor(90,90,90);
            doc.text('  ' + det, MAR+12, curY);
          }
          curY += 4.5;
        });
      }

      curY += 2; // item spacing
    });

    curY += 3; // day spacing
  });

  // footer last page
  doc.setFontSize(7); doc.setTextColor(180,180,180);
  doc.setDrawColor(220,220,220); doc.setLineWidth(0.3);
  doc.line(MAR, H-12, W-MAR, H-12);
  doc.text('PEARS · ' + nombre + ' · ' + fechas, MAR, H-7);
  doc.text('pearsapp.vercel.app', W-MAR, H-7, {align:'right'});

  var filename = 'PEARS_' + (G_viaje.nombre||'Viaje').replace(/\s+/g,'_').substring(0,30) + '.pdf';
  doc.save(filename);
}
</script>
