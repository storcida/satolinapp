<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PEARS · Hogar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/logger.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--s1:#080808;--s2:#111;--s3:#161616;
  --border:#1a1a1a;--border2:#2a2a2a;
  --text:#fff;--muted:#666;--dim:#333;--accent:#F97316;
  --err:#ef4444;--ok:#22c55e;--warn:#F59E0B;
  --caro:#f9a8d4;
  --font:'Inter',-apple-system,sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

/* ── TOP BAR ── */
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;height:52px;background:var(--bg);border-bottom:1px solid var(--border);padding:0 4px}
.tb-back{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:none;background:none;color:var(--muted);cursor:pointer;flex-shrink:0;transition:color 120ms}
.tb-back:hover{color:var(--text)}
.tb-title{flex:1;text-align:center;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:3px}
.tb-save{height:36px;padding:0 16px;background:var(--accent);border:none;border-radius:6px;color:#000;font-size:12px;font-weight:500;font-family:var(--font);cursor:pointer;margin-right:8px;transition:opacity 120ms;white-space:nowrap}
.tb-save:active{opacity:.8}
.tb-save:disabled{opacity:.4;cursor:not-allowed}

/* ── BODY ── */
.body-scroll{padding:0 0 120px;animation:fadeIn 200ms ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── SECTIONS ── */
.section{border-bottom:1px solid var(--border)}
.section-label{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:3px;color:var(--muted);padding:16px 16px 8px}

/* ── GASTOS FIJOS CHIPS ── */
.gf-chip{
  flex:0 0 auto;padding:10px 14px;
  background:var(--s1);border:none;border-bottom:2px solid transparent;
  color:var(--muted);font-family:var(--font);
  cursor:pointer;transition:background 120ms,border-color 120ms,color 120ms;
  -webkit-tap-highlight-color:transparent;text-align:left;
}
.gf-chip:hover{background:var(--s2);color:var(--text)}
.gf-chip.active{background:#141414;color:var(--text);border-bottom-color:var(--accent)}
.gf-chip-title{display:block;font-size:12px;font-weight:400;white-space:nowrap}
.gf-chip-monto{display:block;font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap}
.gf-chip.active .gf-chip-monto{color:var(--muted)}

/* ── TOGGLE ROW ── */
.toggle-row{display:flex;gap:0;border-top:1px solid var(--border)}
.toggle-btn{
  flex:1;padding:13px 8px;border:none;border-bottom:2px solid transparent;
  background:var(--s1);color:var(--muted);
  font-family:var(--font);font-size:13px;font-weight:400;
  cursor:pointer;transition:background 120ms,color 120ms,border-color 120ms;
  -webkit-tap-highlight-color:transparent;
}
.toggle-btn.active{
  background:#141414;color:var(--text);
  border-bottom-color:var(--accent);
}

/* ── FIELDS ── */
.field{padding:0 16px;border-bottom:1px solid var(--border)}
.field:last-child{border-bottom:none}
.field-row{display:flex}
.field-row .field{flex:1;border-right:1px solid var(--border)}
.field-row .field:last-child{border-right:none}
.field-label{display:block;font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted);padding-top:14px;margin-bottom:6px}
.fi,.fs{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:15px;font-weight:300;padding:0 0 14px;outline:none;appearance:none}
.fi::placeholder{color:var(--dim)}
.fi[type="date"]{color-scheme:dark;font-size:14px}
.fs option{background:var(--s2)}

/* ── MONTO ── */
.monto-wrap{display:flex;align-items:baseline;gap:6px;padding-bottom:14px}
.monto-prefix{font-size:13px;color:var(--muted);font-weight:300;padding-top:0}
.monto-input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:24px;font-weight:200;outline:none;padding:0}
.monto-input::placeholder{color:var(--dim)}

/* ── PILLS ── */
.pill-row{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px}
.pill{padding:5px 10px;border-radius:20px;border:1px solid var(--border2);background:var(--s1);color:var(--muted);font-size:12px;cursor:pointer;transition:all 120ms;-webkit-tap-highlight-color:transparent}
.pill:hover,.pill.active{background:var(--accent);border-color:var(--accent);color:#000}

/* ── CONDITIONAL FIELD ── */
.cond-field{display:none}
.cond-field.visible{display:block}

/* ── BOTTOM BAR ── */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:12px 16px;display:flex;flex-direction:column;gap:8px;max-width:480px;margin:0 auto}
.btn-primary{width:100%;padding:15px;background:var(--accent);border:none;border-radius:8px;color:#000;font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;transition:opacity 120ms}
.btn-primary:active{opacity:.8}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-delete{background:none;border:none;color:var(--err);font-family:var(--font);font-size:13px;cursor:pointer;padding:4px 0 8px;text-align:center;width:100%;transition:opacity 120ms}
.btn-delete:hover{opacity:.7}

/* ── FLASH ── */
#flash-wrap{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
</style>
</head>
<body>

<div class="topbar">
  <button class="tb-back" onclick="goBack()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <span class="tb-title" id="page-title">Nuevo movimiento</span>
  <button class="tb-save" id="btn-save-top" onclick="guardar()" disabled>Guardar</button>
</div>

<div id="flash-wrap"></div>

<!-- GASTOS FIJOS CHIPS -->
<div id="gf-section" style="display:none;border-bottom:1px solid var(--border)">
  <div style="font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:3px;color:var(--muted);padding:12px 16px 8px">Gastos fijos</div>
  <div id="gf-chips" style="display:flex;gap:1px;background:var(--border);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch"></div>
</div>

<div class="body-scroll" id="body-scroll">

  <!-- PAGÓ -->
  <div class="section">
    <div class="section-label">Pagó</div>
    <div class="toggle-row">
      <button class="toggle-btn" data-field="pagador" onclick="setToggle(this)">Caro</button>
      <button class="toggle-btn active" data-field="pagador" onclick="setToggle(this)">Santi</button>
    </div>
  </div>

  <!-- BENEFICIARIO -->
  <div class="section">
    <div class="section-label">Beneficiario</div>
    <div class="toggle-row">
      <button class="toggle-btn active" data-field="benef" onclick="setToggle(this)">Ambos</button>
      <button class="toggle-btn" data-field="benef" onclick="setToggle(this)">Caro</button>
      <button class="toggle-btn" data-field="benef" onclick="setToggle(this)">Santi</button>
    </div>
  </div>

  <!-- MONTO + FECHA -->
  <div class="section">
    <div class="field">
      <label class="field-label">Monto</label>
      <div class="monto-wrap">
        <span class="monto-prefix">Gs.</span>
        <input class="monto-input" id="f-monto" type="text" inputmode="numeric" placeholder="0" oninput="fmtMonto(this);checkReady()">
      </div>
    </div>
    <div class="field">
      <label class="field-label">Fecha</label>
      <input class="fi" id="f-fecha" type="date" onchange="checkReady()">
    </div>
  </div>

  <!-- CATEGORÍA -->
  <div class="section">
    <div class="field">
      <label class="field-label">Categoría</label>
      <select class="fs" id="f-cat" onchange="onCatChange(this.value)">
        <option>Alquiler</option><option>Auto</option><option>Celebraciones</option>
        <option>Educación</option><option>Entretenimiento/Ocio</option><option>Farmacia</option>
        <option>Hogar</option><option>Impuestos</option><option>Mascotas</option>
        <option>Ropa</option><option>Salud</option><option>Seguro</option>
        <option>Servicios</option><option selected>Supermercado</option>
        <option>Transporte</option><option>Viaje</option>
      </select>
    </div>
  </div>

  <!-- LUGAR -->
  <div class="section">
    <div class="field">
      <label class="field-label">Lugar</label>
      <div class="pill-row" id="lugar-pills">
        <span class="pill" onclick="setPill('f-lugar',this,'Casa Rica')">Casa Rica</span>
        <span class="pill" onclick="setPill('f-lugar',this,'Norma Vallejos')">Norma Vallejos</span>
        <span class="pill" onclick="setPill('f-lugar',this,'Nueva Americana')">Nueva Americana</span>
        <span class="pill" onclick="setPill('f-lugar',this,'Biggie')">Biggie</span>
        <span class="pill" onclick="setPill('f-lugar',this,'ANDE')">ANDE</span>
        <span class="pill" onclick="setPill('f-lugar',this,'Internet Personal')">Internet Personal</span>
        <span class="pill" onclick="setPill('f-lugar',this,'Starbucks')">Starbucks</span>
        <span class="pill" onclick="setPill('f-lugar',this,'Tonina')">Tonina</span>
        <span class="pill" onclick="setPill('f-lugar',this,'Uber')">Uber</span>
      </div>
      <input class="fi" id="f-lugar" placeholder="o escribí..." oninput="onLugarInput(this.value);filterLugar(this.value);checkReady()" autocomplete="off" onfocus="filterLugar(this.value)" onblur="setTimeout(hideLugar,200)">
      <div id="lugar-dropdown" style="display:none;background:var(--s2);border:1px solid var(--border2);border-radius:6px;margin-top:4px;overflow:hidden;max-height:160px;overflow-y:auto"></div>
    </div>

    <!-- Condicional: Servicio (solo Norma Vallejos) -->
    <div class="field cond-field" id="field-servicio">
      <label class="field-label">Servicio</label>
      <div class="pill-row">
        <span class="pill" onclick="setPill('f-item',this,'Limpieza')">Limpieza</span>
        <span class="pill" onclick="setPill('f-item',this,'Cocina')">Cocina</span>
        <span class="pill" onclick="setPill('f-item',this,'Limpieza + Cocina')">Limpieza + Cocina</span>
      </div>
      <input class="fi" id="f-item" placeholder="o escribí...">
    </div>

    <!-- Condicional: Evento (solo Celebraciones) -->
    <div class="field cond-field" id="field-evento">
      <label class="field-label">Tipo de evento</label>
      <div class="pill-row">
        <span class="pill" onclick="setEvento(this,'Cumpleaños')">Cumpleaños</span>
        <span class="pill" onclick="setEvento(this,'Baby shower')">Baby shower</span>
        <span class="pill" onclick="setEvento(this,'Bautismo')">Bautismo</span>
        <span class="pill" onclick="setEvento(this,'Casamiento')">Casamiento</span>
        <span class="pill" onclick="setEvento(this,'Comunión')">Comunión</span>
        <span class="pill" onclick="setEvento(this,'Asado')">Asado</span>
        <span class="pill" onclick="setEvento(this,'Evento')">Evento</span>
      </div>
      <input class="fi" id="f-evento-nombre" placeholder="Nombre de quien..." oninput="buildEventoLugar()">
      <input type="hidden" id="f-evento-tipo">
    </div>
  </div>

  <!-- MÉTODO DE PAGO -->
  <div class="section">
    <div class="section-label">Método de pago</div>
    <div class="toggle-row">
      <button class="toggle-btn active" data-field="metodo" onclick="setToggle(this)">Crédito</button>
      <button class="toggle-btn" data-field="metodo" onclick="setToggle(this)">Débito</button>
      <button class="toggle-btn" data-field="metodo" onclick="setToggle(this)">Transferencia</button>
      <button class="toggle-btn" data-field="metodo" onclick="setToggle(this)">Efectivo</button>
      <button class="toggle-btn" data-field="metodo" onclick="setToggle(this)">Trueque</button>
    </div>
  </div>

  <!-- BANCO + FACTURA -->
  <div class="section">
    <div class="field-row">
      <div class="field">
        <label class="field-label">Banco</label>
        <select class="fs" id="f-banco">
          <option value="">—</option>
          <option>GNB</option><option>Itaú</option><option>Sudameris</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">Factura</label>
        <select class="fs" id="f-factura">
          <option value="Sin factura">Sin factura</option>
          <option>Caro</option><option>Santi</option>
        </select>
      </div>
    </div>
  </div>

  <!-- NOTA -->
  <div class="section">
    <div class="field">
      <label class="field-label">Nota</label>
      <input class="fi" id="f-nota" placeholder="Opcional">
    </div>
  </div>

</div><!-- /body-scroll -->

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="btn-primary" id="btn-save-bottom" onclick="guardar()">Guardar</button>
  <button class="btn-delete" id="btn-delete" style="display:none" onclick="eliminar()">Eliminar movimiento</button>
</div>

<script>
const G_URL = 'https://hahhmpvfyrmwnaqxibvt.supabase.co';
const G_KEY = 'sb_publishable_WTjwtY_ghLdfShnDhkqHUA_u_1Hn762';

var G_sb = null, G_hh = null, G_nombre = null;
var G_params = new URLSearchParams(location.search);
var IS_NEW   = G_params.has('new');
var G_editId = G_params.get('id') || null;
var G_row    = null;

// ── Boot ─────────────────────────────────────────────
function waitAndBoot() {
  if (typeof supabase !== 'undefined') boot(); else setTimeout(waitAndBoot, 50);
}

async function boot() {
  G_sb = supabase.createClient(G_URL, G_KEY, {auth:{persistSession:true,autoRefreshToken:true}});
  var s = await G_sb.auth.getSession();
  if (!s.data?.session) { window.location.href = '/'; return; }

  var authUser = s.data.session.user;
  var ur = await G_sb.from('app_users').select('nombre,nombre_corto').eq('auth_id', authUser.id).single();
  G_nombre = (ur.data?.nombre_corto || ur.data?.nombre || authUser.email.split('@')[0]);

  var hr = await G_sb.rpc('get_my_household_id');
  G_hh = hr.data;

  if (!G_hh) { flash('Sin household','err'); return; }

  // Load gastos fijos chips (only for new mode)
  if (IS_NEW && !G_params.get('gf_id')) loadGFChips();

  // Default pagador = usuario de la sesión
  var nombreCorto = G_nombre.split(' ')[0]; // "Santi" o "Carolina" → "Carolina"
  document.querySelectorAll('[data-field="pagador"]').forEach(function(b){
    b.classList.toggle('active', b.textContent.trim().toLowerCase() === nombreCorto.toLowerCase());
  });

  // Set today as default
  document.getElementById('f-fecha').value = new Date().toISOString().slice(0,10);

  // Pre-populate from gasto fijo params if present
  var pp = new URLSearchParams(location.search);
  if (pp.get('lugar'))    { document.getElementById('f-lugar').value = pp.get('lugar'); highlightPill('f-lugar', pp.get('lugar')); onLugarInput(pp.get('lugar')); }
  if (pp.get('categoria')){ document.getElementById('f-cat').value = pp.get('categoria'); onCatChange(pp.get('categoria')); }
  if (pp.get('banco'))    { document.getElementById('f-banco').value = pp.get('banco'); }
  if (pp.get('titulo'))   { document.getElementById('page-title').textContent = pp.get('titulo'); }

  if (G_editId) {
    var r = await G_sb.from('transactions').select('*').eq('id', G_editId).single();
    if (r.error || !r.data) { flash('Movimiento no encontrado','err'); return; }
    G_row = r.data;
    document.getElementById('page-title').textContent = 'Editar movimiento';
    document.getElementById('btn-save-top').textContent = 'Guardar';
    document.getElementById('btn-save-bottom').textContent = 'Guardar cambios';
    document.getElementById('btn-delete').style.display = 'block';
    populateEdit(G_row);
  }

  checkReady();
}

function populateEdit(t) {
  // Pagador
  document.querySelectorAll('[data-field="pagador"]').forEach(function(b){
    b.classList.toggle('active', b.textContent.trim() === t.pagador);
  });
  // Beneficiario
  document.querySelectorAll('[data-field="benef"]').forEach(function(b){
    b.classList.toggle('active', b.textContent.trim() === (t.beneficiario||'Ambos'));
  });
  // Monto
  document.getElementById('f-monto').value = fmtN(t.monto_pyg);
  // Fecha
  document.getElementById('f-fecha').value = t.fecha || '';
  // Cat
  document.getElementById('f-cat').value = t.categoria || 'Supermercado';
  onCatChange(t.categoria);
  // Lugar
  document.getElementById('f-lugar').value = t.lugar || '';
  highlightPill('f-lugar', t.lugar);
  onLugarInput(t.lugar);
  if (t.item) document.getElementById('f-item').value = t.item;
  // Banco
  document.getElementById('f-banco').value = t.banco || '';
  // Metodo
  if (t.metodo) document.querySelectorAll('[data-field="metodo"]').forEach(function(b){ b.classList.toggle('active', b.textContent.trim() === t.metodo); });
  // Factura
  document.getElementById('f-factura').value = t.factura_nombre || 'Sin factura';
  // Nota
  document.getElementById('f-nota').value = t.nota || '';
}

// ── Helpers ───────────────────────────────────────────
function setToggle(btn) {
  btn.closest('.toggle-row').querySelectorAll('.toggle-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
}

function setPill(fieldId, pill, val) {
  document.getElementById(fieldId).value = val;
  var container = pill.closest('.pill-row');
  if (container) container.querySelectorAll('.pill').forEach(function(p){p.classList.remove('active');});
  pill.classList.add('active');
  checkReady();
}

function highlightPill(fieldId, val) {
  document.querySelectorAll('#lugar-pills .pill').forEach(function(p){
    p.classList.toggle('active', p.textContent.trim() === val);
  });
}

function onLugarInput(val) {
  var show = (val||'').trim().toLowerCase() === 'norma vallejos';
  document.getElementById('field-servicio').classList.toggle('visible', show);
}

function onCatChange(val) {
  document.getElementById('field-evento').classList.toggle('visible', val === 'Celebraciones');
}

function setEvento(pill, tipo) {
  document.getElementById('f-evento-tipo').value = tipo;
  document.querySelectorAll('#field-evento .pill').forEach(function(p){p.classList.remove('active');});
  pill.classList.add('active');
  buildEventoLugar();
}

function buildEventoLugar() {
  var tipo = document.getElementById('f-evento-tipo').value;
  var nom  = document.getElementById('f-evento-nombre').value.trim();
  document.getElementById('f-lugar').value = tipo ? (nom ? tipo+' '+nom : tipo) : nom;
  checkReady();
}

function fmtN(n) { return new Intl.NumberFormat('es-PY').format(Math.round(n||0)); }

function fmtMonto(input) {
  var raw = input.value.replace(/\D/g,'');
  if (raw) input.value = new Intl.NumberFormat('es-PY').format(parseInt(raw));
  else input.value = '';
}

function checkReady() {
  var mon = parseInt((document.getElementById('f-monto').value||'').replace(/\D/g,''))||0;
  var lug = (document.getElementById('f-lugar').value||'').trim();
  var fec = document.getElementById('f-fecha').value;
  var ok  = mon > 0 && lug.length > 0 && fec.length > 0;
  document.getElementById('btn-save-top').disabled    = !ok;
  document.getElementById('btn-save-bottom').disabled = !ok;
}

// ── Save ──────────────────────────────────────────────
async function guardar() {
  var pag  = document.querySelector('.toggle-btn.active[data-field="pagador"]').textContent.trim();
  var ben  = document.querySelector('.toggle-btn.active[data-field="benef"]').textContent.trim();
  var mon  = parseInt((document.getElementById('f-monto').value||'').replace(/\D/g,''))||0;
  var fec  = document.getElementById('f-fecha').value;
  var cat  = document.getElementById('f-cat').value;
  var lug  = document.getElementById('f-lugar').value.trim();
  var itm  = document.getElementById('f-item').value.trim()||null;
  var ban  = document.getElementById('f-banco').value||null;
  var met  = document.querySelector('.toggle-btn.active[data-field="metodo"]').textContent.trim();
  var fac  = document.getElementById('f-factura').value;
  var not  = document.getElementById('f-nota').value.trim()||null;

  if (!mon || !lug) { flash('Completá monto y lugar','warn'); return; }

  saveLugar(lug);
  setBusy(true);
  var payload = {
    pagador:pag, beneficiario:ben, lugar:lug, item:itm,
    categoria:cat, monto:mon, monto_pyg:mon, moneda:'guaranies',
    metodo:met, banco:ban, factura_nombre:fac, nota:not, fecha:fec, month:fec.slice(0,7),
    updated_by: G_nombre
  };

  var r;
  if (G_editId) {
    r = await G_sb.from('transactions').update(payload).eq('id', G_editId);
  } else {
    payload.household_id = G_hh;
    payload.created_by   = G_nombre;
    r = await G_sb.from('transactions').insert(payload);
  }
  setBusy(false);

  if (r.error) { flash('Error: '+r.error.message,'err'); return; }
  flash(G_editId ? 'Cambios guardados ✓' : 'Movimiento guardado ✓','ok');
  setTimeout(goBack, 700);
}

// ── Delete ────────────────────────────────────────────
async function eliminar() {
  if (!confirm('¿Eliminar este movimiento? No se puede deshacer.')) return;
  setBusy(true);
  var r = await G_sb.from('transactions').delete().eq('id', G_editId);
  setBusy(false);
  if (r.error) { flash('Error: '+r.error.message,'err'); return; }
  flash('Eliminado','ok');
  setTimeout(function(){ window.location.href = '/finanzas/'; }, 600);
}

// ── Helpers ───────────────────────────────────────────
function goBack() {
  if (document.referrer) history.back(); else window.location.href = '/finanzas/';
}
function setBusy(b) {
  document.getElementById('btn-save-top').disabled    = b;
  document.getElementById('btn-save-bottom').disabled = b;
  document.getElementById('btn-save-bottom').textContent = b ? 'Guardando…' : (G_editId ? 'Guardar cambios' : 'Guardar');
}
function flash(msg,type) {
  if (type === 'err' && window.Logger) Logger.error('hogar','FLASH_ERROR',msg);
  var c = {ok:'#22c55e',err:'#ef4444',warn:'#F59E0B'}[type||'ok'];
  var el = document.createElement('div');
  el.style.cssText='display:inline-block;background:#111;border:1px solid '+c+';color:'+c+';padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;pointer-events:none;white-space:nowrap';
  el.textContent = msg;
  document.getElementById('flash-wrap').appendChild(el);
  setTimeout(function(){ el.remove(); }, 2800);
}

// ── Gastos fijos chips ────────────────────────────────
async function loadGFChips() {
  var r = await G_sb.from('gastos_fijos')
    .select('*').eq('household_id', G_hh).eq('activo', true).order('orden');
  var gf = r.data || [];
  if (!gf.length) return;
  var sec = document.getElementById('gf-section');
  var chips = document.getElementById('gf-chips');
  sec.style.display = 'block';
  chips.innerHTML = gf.map(function(g){
    var ml = g.monto_fijo ? 'Gs. '+fmtN(g.monto_fijo) : 'Variable';
    var encoded = encodeURIComponent(JSON.stringify(g));
    return '<button class="gf-chip" onclick="applyGF(decodeAndParse(\''+encoded+'\'))">' +
      '<span class="gf-chip-title">'+ESC2(g.titulo)+'</span>' +
      '<span class="gf-chip-monto">'+ml+'</span></button>';
  }).join('');
}

function decodeAndParse(s) { try { return JSON.parse(decodeURIComponent(s)); } catch { return {}; } }

function applyGF(g) {
  if (g.lugar)     { document.getElementById('f-lugar').value = g.lugar; highlightPill('f-lugar', g.lugar); onLugarInput(g.lugar); }
  if (g.categoria) { document.getElementById('f-cat').value = g.categoria; onCatChange(g.categoria); }
  if (g.banco)     { document.getElementById('f-banco').value = g.banco; }
  if (g.monto_fijo){ document.getElementById('f-monto').value = fmtN(g.monto_fijo); }
  document.getElementById('page-title').textContent = g.titulo;
  // Active state: orange underline + gray bg
  document.querySelectorAll('.gf-chip').forEach(function(c){
    c.classList.toggle('active', c.querySelector('.gf-chip-title').textContent === g.titulo);
  });
  checkReady();
}

function ESC2(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Lugar autocomplete ────────────────────────────────
var LS_KEY = 'pears_hogar_lugares';

function getLugares() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { return []; }
}

function saveLugar(val) {
  if (!val || val.length < 2) return;
  var list = getLugares().filter(function(l){ return l !== val; });
  list.unshift(val);
  if (list.length > 30) list = list.slice(0, 30);
  localStorage.setItem(LS_KEY, JSON.stringify(list));
}

function filterLugar(query) {
  var dd = document.getElementById('lugar-dropdown');
  var q  = (query||'').trim().toLowerCase();
  var all = getLugares();
  var matches = q
    ? all.filter(function(l){ return l.toLowerCase().includes(q); })
    : all.slice(0, 8);
  if (!matches.length) { dd.style.display = 'none'; return; }
  dd.style.display = 'block';
  dd.innerHTML = matches.map(function(l){
    return '<div style="padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 120ms" ' +
      'onmousedown="pickLugar(\''+l.replace(/'/g,"\\'")+'\')" ' +
      'onmouseover="this.style.background=\'var(--s3)\'" ' +
      'onmouseout="this.style.background=\'\'">'+ESC(l)+'</div>';
  }).join('');
}

function pickLugar(val) {
  document.getElementById('f-lugar').value = val;
  highlightPill('f-lugar', val);
  onLugarInput(val);
  hideLugar();
  checkReady();
}

function hideLugar() {
  var dd = document.getElementById('lugar-dropdown');
  if (dd) dd.style.display = 'none';
}

function ESC(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.addEventListener('DOMContentLoaded', waitAndBoot);
</script>
