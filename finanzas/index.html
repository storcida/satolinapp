<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PEARS · Hogar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/auth.js"></script>
<link rel="stylesheet" href="../shared/header.css">
<script src="../shared/header.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--s1:#080808;--s2:#111;--border:#1a1a1a;--border2:#2a2a2a;
  --text:#fff;--muted:#666;--dim:#333;--accent:#F97316;
  --ok:#22c55e;--err:#ef4444;--warn:#F59E0B;
  --caro:#F9A8D4;--santi:#93C5FD;
  --font:'Inter',-apple-system,sans-serif;--mono:'SF Mono','Fira Code',monospace;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

/* H2 */
.h2{position:sticky;top:48px;z-index:99;background:var(--bg);border-bottom:1px solid var(--border)}
.breadcrumb{display:flex;align-items:center;gap:6px;padding:8px 16px 6px;font-size:11px;color:var(--muted);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.breadcrumb::-webkit-scrollbar{display:none}
.breadcrumb a{color:var(--muted);text-decoration:none}
.breadcrumb a:hover{color:var(--text)}
.breadcrumb .sep{color:var(--dim);font-size:10px}
.breadcrumb .current{color:var(--text);font-weight:500}
.tabs{display:flex;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 8px 9px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:2px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;transition:color 120ms,border-color 120ms;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font);white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}

/* Content */
.content{max-width:480px;margin:0 auto;padding-bottom:100px}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* Month nav */
.month-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.month-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;padding:0 10px;font-family:var(--font);line-height:1;transition:color 120ms}
.month-btn:hover{color:var(--text)}
.month-label{font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.kpi-card{background:var(--s1);padding:16px}
.kpi-label{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted);margin-bottom:8px}
.kpi-value{font-size:20px;font-weight:600;line-height:1.1}
.kpi-value.ok{color:var(--ok)}
.kpi-value.err{color:var(--err)}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}

/* Waveform */
.waveform{display:flex;align-items:center;gap:3px;height:22px}
.wf-tick{width:2px;height:14px;border-radius:1px;background:rgba(255,255,255,.85);flex-shrink:0}
.wf-tick.empty{background:#222}
.wf-head{width:2px;height:22px;border-radius:1px;background:var(--accent);flex-shrink:0}

/* Budget */
.budget-section{padding:16px;border-bottom:1px solid var(--border)}
.budget-meta{display:flex;justify-content:space-between;margin-bottom:8px}
.budget-meta span{font-size:11px;color:var(--muted)}
.budget-meta strong{color:var(--text);font-weight:500}

/* Conciliaciones */
.concil-section{padding:16px;border-bottom:1px solid var(--border)}
.section-label{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:3px;color:var(--muted);margin-bottom:10px}
.concil-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.concil-cell{background:var(--s1);padding:12px}
.concil-head{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:6px}
.concil-who{font-size:13px;font-weight:500;margin-bottom:4px}
.concil-amt{font-size:17px;font-weight:700}

/* Categorías */
.cats-section{padding:16px;border-bottom:1px solid var(--border)}
.cat-row{margin-bottom:14px}
.cat-row:last-child{margin-bottom:0}
.cat-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.cat-name{font-size:13px;font-weight:400}
.cat-amt{font-size:12px;color:var(--muted)}
.cat-pct{font-size:10px;color:var(--dim);margin-left:6px}

/* Movimientos */
.mov-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)}
.mov-date{font-family:var(--mono);font-size:10px;color:var(--muted);width:28px;flex-shrink:0;text-align:center;line-height:1.3}
.mov-date .day{font-size:15px;font-weight:500;color:var(--text);display:block}
.mov-body{flex:1;min-width:0}
.mov-concept{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov-meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mov-cat{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;padding:2px 6px;border-radius:99px;background:var(--s2);border:1px solid var(--border2);color:var(--muted)}
.badge-caro{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;padding:2px 7px;border-radius:99px;background:rgba(249,168,212,.1);border:1px solid rgba(249,168,212,.25);color:var(--caro)}
.badge-santi{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;padding:2px 7px;border-radius:99px;background:rgba(147,197,253,.1);border:1px solid rgba(147,197,253,.25);color:var(--santi)}
.badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.mov-right{text-align:right;flex-shrink:0}
.mov-amount{font-size:14px;font-weight:500}
.mov-banco{font-size:11px;color:var(--muted);margin-top:1px}
.mov-actions{display:flex;gap:4px;align-items:center;flex-shrink:0;margin-left:4px}
.mov-action-btn{width:28px;height:28px;border-radius:6px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:color 120ms,background 120ms}
.mov-action-btn:hover{background:var(--s2)}
.mov-action-btn.del:hover{color:var(--err)}
.mov-action-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* FAB */
.fab{position:fixed;bottom:24px;right:20px;width:48px;height:48px;background:var(--accent);border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(249,115,22,.35);z-index:50;transition:transform 120ms}
.fab:active{transform:scale(.92)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{width:min(480px,100%);max-height:90dvh;overflow-y:auto;background:#0d0d0d;border:1px solid var(--border2);border-radius:16px 16px 0 0;padding:20px 16px 32px;animation:slideUp 220ms ease-out}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:2.5px}
.mclose{width:28px;height:28px;border-radius:50%;background:var(--s2);border:none;color:var(--muted);cursor:pointer;font-size:13px;font-family:var(--font)}
.field{margin-bottom:13px}
.field-label{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted);margin-bottom:5px;display:block}
.fi,.fs{width:100%;background:var(--s1);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:10px 12px;font-size:14px;font-family:var(--font);outline:none;transition:border-color 120ms;appearance:none}
.fi:focus,.fs:focus{border-color:var(--accent)}
.fi::placeholder{color:var(--dim)}
.fs option{background:var(--s2)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle-row{display:flex;gap:8px}
.toggle-btn{flex:1;padding:9px;background:var(--s1);border:1px solid var(--border2);border-radius:6px;color:var(--muted);font-size:13px;font-weight:500;font-family:var(--font);cursor:pointer;transition:all 120ms}
.toggle-btn.active{background:var(--s2);border-color:var(--accent);color:var(--text)}
.submit-btn{width:100%;padding:13px;background:var(--accent);border:none;border-radius:8px;color:#000;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;margin-top:8px}

/* Flash */
#flash-wrap{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:400;pointer-events:none}
</style>
</head>
<body>

<!-- HEADER LOCKED -->
<header id="pears-h1">

<!-- H2 -->

<script>
// ══════════════════════════════════════════════════════
// HOGAR MOTOR — inline para evitar SW cache
// ══════════════════════════════════════════════════════

const MONTHS_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const BUDGET    = 8_000_000;
const SPLIT     = { Caro: 50, Santi: 50 };
const FMT = n => new Intl.NumberFormat('es-PY').format(Math.round(n || 0));
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let H_sb, H_user, H_hh;
let HH_month = '';
let H_rows  = [];

// ── Boot ──────────────────────────────────
Auth.onReady(async user => {
  if (!user) { window.location.href = '/'; return; }
  H_sb  = Auth.client();
  H_user = user;

  // Get household_id via RPC (bypasses RLS)
  H_hh = user.household_id;
  if (!_hhId) {
    const { data } = await H_sb.rpc('get_my_household_id');
    H_hh = data || null;
  }
  if (!H_hh) { err('Sin household. Contactá al admin.'); return; }

  PearsHeader.init('hogar');

  // Set default date for new movimiento form
  document.getElementById('mov-fecha').value = new Date().toISOString().slice(0,10);

  // Wire nav buttons here — not in onclick attr, no SW interference
  document.getElementById('btn-prev').onclick = () => go(-1);
  document.getElementById('btn-next').onclick = () => go(1);

  // Load current month
  const now = new Date();
  _month = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  await load(H_month);
});

// ── Navigation ────────────────────────────
function go(dir) {
  // Pure arithmetic — no Date object
  let [y, mo] = H_month.split('-').map(Number);
  mo += dir;
  if (mo === 0)  { mo = 12; y--; }
  if (mo === 13) { mo = 1;  y++; }
  const next = y + '-' + String(mo).padStart(2,'0');
  load(next);
}

// ── Load month ────────────────────────────
async function load(month) {
  H_month = month;
  const [y, mo] = month.split('-').map(Number);
  document.getElementById('month-label').textContent =
    MONTHS_ES[mo-1].charAt(0).toUpperCase() + MONTHS_ES[mo-1].slice(1) + ' ' + y;

  const content = document.getElementById('tablero-content');
  content.style.opacity = '.4';

  const { data, error } = await H_sb
    .from('transactions')
    .select('*')
    .eq('household_id', H_hh)
    .eq('month', month)
    .order('fecha', { ascending: false });

  content.style.opacity = '1';

  if (error) { err('Error: ' + error.message); return; }
  H_rows = data || [];
  render();
}

// ── Render ────────────────────────────────
function render() {
  const total = H_rows.reduce((s,t) => s + Number(t.monto_pyg||0), 0);
  const rem   = BUDGET - total;
  const pct   = Math.min(100, Math.round(total / BUDGET * 100));

  // KPIs
  document.getElementById('kpi-total').textContent     = FMT(total);
  document.getElementById('kpi-remanente').textContent = FMT(Math.abs(rem));
  document.getElementById('kpi-remanente').className   = 'kpi-value ' + (rem >= 0 ? 'ok' : 'err');
  document.getElementById('kpi-rem-sub').textContent   = rem >= 0 ? 'Gs. · remanente' : 'Gs. · sobre presupuesto';
  document.getElementById('budget-total').textContent  = FMT(BUDGET);
  document.getElementById('budget-movs').textContent   = _rows.length + ' movimientos';
  document.getElementById('budget-pct').textContent    = pct + '% utilizado';
  waveform(document.getElementById('hogar-progress'), pct/100);

  // Conciliaciones
  const porPag = {}, porFac = {};
  H_rows.forEach(t => {
    const p = t.pagador || '—';
    porPag[p] = (porPag[p]||0) + Number(t.monto_pyg||0);
    const f = t.factura_nombre;
    if (f && f !== 'Sin factura') porFac[f] = (porFac[f]||0) + Number(t.monto_pyg||0);
  });

  const members = ['Caro','Santi'];
  const fin = members.map(m => {
    const pago = porPag[m]||0, corr = total * SPLIT[m]/100;
    return { m, pago, delta: pago - corr };
  });
  const totalFac = Object.values(porFac).reduce((s,v)=>s+v,0);
  const fis = members.map(m => {
    const facs = porFac[m]||0, corr = totalFac * SPLIT[m]/100;
    return { m, facs, delta: facs - corr };
  });

  const acreedor = fin.find(f => f.delta > 0);
  const deudor   = fin.find(f => f.delta < 0);
  const fisDeud  = fis.find(f => f.delta < 0);

  const cg = document.getElementById('concil-grid');
  cg.innerHTML = `
    <div class="concil-cell">
      <div class="concil-head">Financiera</div>
      ${deudor && acreedor
        ? `<div class="concil-who">${deudor.m} → ${acreedor.m}</div>
           <div class="concil-amt" style="color:var(--err)">Gs. ${FMT(Math.abs(deudor.delta))}</div>`
        : `<div class="concil-who" style="color:var(--ok)">✓ Equilibrado</div>`}
    </div>
    <div class="concil-cell">
      <div class="concil-head">Fiscal</div>
      ${fisDeud && Math.abs(fisDeud.delta) > 0
        ? `<div class="concil-who">${fisDeud.m} debe facturas</div>
           <div class="concil-amt" style="color:var(--warn)">Gs. ${FMT(Math.abs(fisDeud.delta))}</div>`
        : `<div class="concil-who" style="color:var(--ok)">✓ Equilibrado</div>`}
    </div>`;

  // Categorías
  const porCat = {};
  H_rows.forEach(t => { const c = t.categoria||'Otro'; porCat[c] = (porCat[c]||0)+Number(t.monto_pyg||0); });
  const cl = document.getElementById('cat-list');
  cl.innerHTML = '';
  Object.entries(porCat).sort((a,b)=>b[1]-a[1]).forEach(([cat, monto]) => {
    const p = total > 0 ? Math.round(monto/total*100) : 0;
    const row = document.createElement('div');
    row.className = 'cat-row';
    const wId = 'cw-' + cat.replace(/\W/g,'');
    row.innerHTML = `<div class="cat-head"><span class="cat-name">${esc(cat)}</span><span class="cat-amt">Gs. ${FMT(monto)}<span class="cat-pct"> ${p}%</span></span></div><div id="${wId}"></div>`;
    cl.appendChild(row);
    waveform(document.getElementById(wId), p/100);
  });

  // Movimientos
  const ml = document.getElementById('mov-list');
  if (!H_rows.length) {
    ml.innerHTML = '<div style="padding:40px 16px;text-align:center;color:var(--dim);font-size:13px">Sin movimientos este mes</div>';
    return;
  }
  const ico = {
    p: `<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
    t: `<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
  };
  ml.innerHTML = H_rows.map(t => {
    const d   = t.fecha ? t.fecha.slice(8,10) : '?';
    const mo  = t.fecha ? MONTHS_ES[parseInt(t.fecha.slice(5,7))-1].slice(0,3).toUpperCase() : '?';
    const bc  = t.pagador === 'Caro' ? 'badge-caro' : 'badge-santi';
    return `<div class="mov-item">
      <div class="mov-date"><span class="day">${d}</span>${mo}</div>
      <div class="mov-body">
        <div class="mov-concept">${esc(t.lugar||t.item||'—')}</div>
        <div class="mov-meta">
          <span class="mov-cat">${esc(t.categoria||'—')}</span>
          <span class="${bc}"><span class="badge-dot"></span>${esc(t.pagador||'—')}</span>
        </div>
      </div>
      <div class="mov-right">
        <div class="mov-amount">Gs. ${FMT(t.monto_pyg)}</div>
        <div class="mov-banco">${esc(t.banco||'—')}</div>
      </div>
      <div class="mov-actions">
        <button class="mov-action-btn edit" onclick="editMov('${t.id}')">${ico.p}</button>
        <button class="mov-action-btn del"  onclick="delMov('${t.id}')">${ico.t}</button>
      </div>
    </div>`;
  }).join('');
}

// ── CRUD ──────────────────────────────────
async function saveMovimiento() {
  const pagador = document.querySelector('.toggle-btn.active[data-field="pagador"]')?.textContent?.trim() || 'Santi';
  const benef   = document.querySelector('.toggle-btn.active[data-field="benef"]')?.textContent?.trim() || 'Ambos';
  const monto   = parseInt((document.getElementById('mov-monto').value||'').replace(/\D/g,''))||0;
  const fecha   = document.getElementById('mov-fecha').value;
  const cat     = document.getElementById('mov-cat').value;
  const lugar   = document.getElementById('mov-lugar').value.trim();
  const banco   = document.getElementById('mov-banco').value||null;
  const factura = document.getElementById('mov-factura').value;
  const nota    = document.getElementById('mov-nota').value.trim()||null;

  if (!monto||!lugar) { flash('Completá monto y lugar','warn'); return; }
  const month = fecha.slice(0,7);

  const { error } = await H_sb.from('transactions').insert({
    household_id: H_hh, pagador, beneficiario: benef,
    lugar, categoria: cat, monto, monto_pyg: monto, moneda:'guaranies',
    banco, factura_nombre: factura, nota, fecha, month,
    created_by: H_user.nombre_corto||H_user.nombre,
    updated_by: H_user.nombre_corto||H_user.nombre,
  });
  if (error) { flash('Error: '+error.message,'err'); return; }
  flash('Guardado ✓','ok');
  modalClose();
  await load(H_month);
}

function editMov(id) {
  const t = H_rows.find(r => r.id === id);
  if (!t) return;
  document.getElementById('edit-id').value    = id;
  document.getElementById('edit-monto').value = FMT(t.monto_pyg);
  document.getElementById('edit-fecha').value = t.fecha||'';
  document.getElementById('edit-cat').value   = t.categoria||'';
  document.getElementById('edit-lugar').value = t.lugar||'';
  document.getElementById('edit-banco').value = t.banco||'';
  document.getElementById('edit-factura').value = t.factura_nombre||'Sin factura';
  document.getElementById('edit-nota').value  = t.nota||'';
  document.querySelectorAll('[data-field="edit-pagador"]').forEach(b =>
    b.classList.toggle('active', b.textContent.trim() === t.pagador)
  );
  document.getElementById('modal-edit').classList.add('open');
}

async function saveEdit() {
  const id     = document.getElementById('edit-id').value;
  const pagador= document.querySelector('.toggle-btn.active[data-field="edit-pagador"]')?.textContent?.trim();
  const monto  = parseInt((document.getElementById('edit-monto').value||'').replace(/\D/g,''))||0;
  const fecha  = document.getElementById('edit-fecha').value;
  const { error } = await H_sb.from('transactions').update({
    pagador, monto, monto_pyg: monto, fecha,
    categoria: document.getElementById('edit-cat').value,
    lugar:     document.getElementById('edit-lugar').value.trim(),
    banco:     document.getElementById('edit-banco').value||null,
    factura_nombre: document.getElementById('edit-factura').value,
    nota:      document.getElementById('edit-nota').value.trim()||null,
    month:     fecha.slice(0,7),
    updated_by: H_user.nombre_corto||H_user.nombre,
  }).eq('id',id);
  if (error) { flash('Error: '+error.message,'err'); return; }
  flash('Guardado ✓','ok');
  document.getElementById('modal-edit').classList.remove('open');
  await load(H_month);
}

async function delMov(id) {
  if (!confirm('¿Eliminar este movimiento?')) return;
  const { error } = await H_sb.from('transactions').delete().eq('id',id);
  if (error) { flash('Error al eliminar','err'); return; }
  flash('Eliminado','ok');
  await load(H_month);
}

// ── Waveform ──────────────────────────────
function waveform(el, pct) {
  if (!el) return;
  const N = 48, f = Math.round(N * Math.min(pct,1));
  el.className = 'waveform';
  el.innerHTML = '';
  for (let i=0;i<N;i++) {
    if (i===f) { const h=document.createElement('div'); h.className='wf-head'; el.appendChild(h); }
    const d=document.createElement('div');
    d.className='wf-tick'+(i<f?'':' empty');
    el.appendChild(d);
  }
}

// ── Helpers ───────────────────────────────
function switchTab(btn, panel, label) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+panel).classList.add('active');
  document.getElementById('bc-current').textContent = label;
}
function modalOpen()  { document.getElementById('modal-overlay').classList.add('open'); }
function modalClose() { document.getElementById('modal-overlay').classList.remove('open'); }
function setToggle(btn) {
  btn.closest('.toggle-row').querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function flash(msg, type='ok') {
  const colors={ok:'#22c55e',err:'#ef4444',warn:'#F59E0B'};
  const el=document.createElement('div');
  el.style.cssText=`display:inline-block;background:#111;border:1px solid ${colors[type]||colors.ok};color:${colors[type]||colors.ok};padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.5);margin:4px`;
  el.textContent=msg;
  document.getElementById('flash-wrap').appendChild(el);
  setTimeout(()=>el.remove(),3000);
}
function err(msg) {
  document.getElementById('tablero-content').innerHTML =
    `<div style="padding:40px 16px;text-align:center;color:var(--err);font-size:13px">${msg}</div>`;
}
</script>
