<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/pears-icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/pears-icon-32.png">
  <link rel="apple-touch-icon" href="/icon-apple-180.png">
  <link rel="manifest" href="/manifest.json">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PEARS · Cierre de Mes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/logger.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--s1:#080808;--s2:#111;--s3:#161616;
  --border:#1a1a1a;--border2:#2a2a2a;
  --text:#fff;--muted:#666;--dim:#333;--accent:#8dd900;
  --err:#ef4444;--ok:#22c55e;--warn:#F59E0B;
  --font:'Inter',-apple-system,sans-serif;
  --mono:'SF Mono','Fira Code',monospace;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;height:52px;background:var(--bg);border-bottom:1px solid var(--border);padding:0 4px}
.tb-back{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:none;background:none;color:var(--muted);cursor:pointer;flex-shrink:0;transition:color 120ms}
.tb-back:hover{color:var(--text)}
.tb-title{flex:1;text-align:center;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:3px}
.tb-badge{height:28px;padding:0 12px;border-radius:6px;border:none;font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;font-family:var(--font);flex-shrink:0;margin-right:8px;display:flex;align-items:center;gap:6px}
.tb-badge.pendiente{background:rgba(245,158,11,.12);color:var(--warn);border:1px solid rgba(245,158,11,.25)}
.tb-badge.cerrado{background:rgba(34,197,94,.1);color:var(--ok);border:1px solid rgba(34,197,94,.25)}
.tb-badge.reapertura{background:rgba(239,68,68,.1);color:var(--err);border:1px solid rgba(239,68,68,.25)}

/* ── BODY ── */
.body-scroll{padding:0 0 120px;animation:fadeIn 200ms ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── SECTIONS ── */
.section{border-bottom:1px solid var(--border)}
.section-label{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:3px;color:var(--muted);padding:16px 16px 8px}

/* ── BALANCE CARD ── */
.balance-card{margin:0;padding:16px}
.balance-main{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.balance-title{font-size:12px;font-weight:400;color:var(--muted)}
.balance-amount{font-size:28px;font-weight:200;letter-spacing:-1px}
.balance-rows{display:flex;flex-direction:column;gap:6px}
.balance-row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.balance-row-label{color:var(--muted);font-weight:300}
.balance-row-val{font-weight:400}
.balance-divider{height:1px;background:var(--border);margin:8px 0}
.balance-deuda{display:flex;align-items:center;gap:8px;padding:12px;border-radius:8px;margin-top:12px}
.balance-deuda.caro{background:rgba(249,168,212,.06);border:1px solid rgba(249,168,212,.15)}
.balance-deuda.santi{background:rgba(147,197,253,.06);border:1px solid rgba(147,197,253,.15)}
.balance-deuda-icon{flex-shrink:0;width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.balance-deuda.caro .balance-deuda-icon{background:rgba(249,168,212,.1)}
.balance-deuda.santi .balance-deuda-icon{background:rgba(147,197,253,.1)}
.balance-deuda-text{flex:1}
.balance-deuda-who{font-size:12px;font-weight:500}
.balance-deuda-amt{font-size:18px;font-weight:300;margin-top:2px;letter-spacing:-.5px}

/* ── COMPROBANTE UPLOAD ── */
.upload-wrap{padding:16px}
.upload-area{border:1px dashed var(--border2);border-radius:8px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:border-color 120ms,background 120ms;position:relative}
.upload-area:hover{border-color:var(--accent);background:var(--s1)}
.upload-area.has-file{border-style:solid;border-color:var(--ok)}
.upload-area input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-icon{color:var(--muted)}
.upload-label{font-size:12px;font-weight:400;color:var(--muted)}
.upload-filename{font-size:11px;font-weight:500;color:var(--ok);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-preview{width:100%;max-height:120px;object-fit:cover;border-radius:6px;margin-top:4px;display:none}
.upload-status{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;font-weight:500}
.upload-status.ok{color:var(--ok)}
.upload-status.uploading{color:var(--warn)}

/* ── APROBACIÓN ── */
.aprov-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.aprov-who{font-size:13px;font-weight:400}
.aprov-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase}
.aprov-badge.ok{background:rgba(34,197,94,.1);color:var(--ok);border:1px solid rgba(34,197,94,.25)}
.aprov-badge.pending{background:var(--s1);color:var(--muted);border:1px solid var(--border2)}

/* ── CERRADO BANNER ── */
.closed-banner{margin:16px;padding:14px 16px;border-radius:8px;background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2);display:flex;align-items:center;gap:12px}
.closed-banner-text{flex:1}
.closed-banner-title{font-size:13px;font-weight:500;color:var(--ok)}
.closed-banner-sub{font-size:11px;color:var(--muted);margin-top:3px}

/* ── BOTTOM BAR ── */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:12px 16px;display:flex;flex-direction:column;gap:8px;max-width:480px;margin:0 auto}
.btn-primary{width:100%;padding:15px;background:var(--accent);border:none;border-radius:8px;color:#000;font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;transition:opacity 120ms}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-secondary{width:100%;padding:12px;background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--muted);font-family:var(--font);font-size:13px;cursor:pointer;transition:border-color 120ms,color 120ms}
.btn-secondary:hover{border-color:var(--err);color:var(--err)}

/* ── SVG ICONS ── */
svg{vertical-align:middle}

/* ── FLASH ── */
#flash-wrap{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
</style>
</head>
<body>

<div class="topbar">
  <button class="tb-back" onclick="goBack()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <span class="tb-title" id="page-title">Cierre de mes</span>
  <div class="tb-badge pendiente" id="estado-badge">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    Pendiente
  </div>
</div>

<div id="flash-wrap"></div>
<div class="body-scroll" id="body-scroll">
  <div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">Cargando…</div>
</div>

<div class="bottom-bar" id="bottom-bar" style="display:none"></div>

<script>
const G_URL = 'https://hahhmpvfyrmwnaqxibvt.supabase.co';
const G_KEY = 'sb_publishable_WTjwtY_ghLdfShnDhkqHUA_u_1Hn762';
const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const FMT = n => new Intl.NumberFormat('es-PY').format(Math.round(n||0));

var G_sb, G_hh, G_nombre, G_userId;
var G_month = new URLSearchParams(location.search).get('month');
var G_cierre = null;
var G_pendingFile = { factura: null, transferencia: null };

// Map any name variant → column key ('santi' | 'caro')
function myKey() {
  var n = (G_nombre||'').toLowerCase().trim();
  return n.startsWith('car') ? 'caro' : 'santi';
}

function waitAndBoot(){ if(typeof supabase!=='undefined') boot(); else setTimeout(waitAndBoot,50); }

async function boot() {
  if (window.Logger) Logger.init('hogar-cierre');
  G_sb = supabase.createClient(G_URL, G_KEY, {auth:{persistSession:true,autoRefreshToken:true}});
  var s = await G_sb.auth.getSession();
  if (!s.data?.session) { window.location.href='/'; return; }
  var authUser = s.data.session.user;
  var ur = await G_sb.from('app_users').select('id,nombre,nombre_corto').eq('auth_id', authUser.id).single();
  G_nombre  = ur.data?.nombre_corto || ur.data?.nombre || authUser.email.split('@')[0];
  G_userId  = ur.data?.id;
  var hr = await G_sb.rpc('get_my_household_id');
  G_hh = hr.data;

  if (!G_month) { flash('Mes no especificado','err'); return; }

  var mo = parseInt(G_month.slice(5,7));
  var yr = G_month.slice(0,4);
  document.getElementById('page-title').textContent = MONTHS_ES[mo-1].toUpperCase() + ' ' + yr;

  await loadCierre();
}

async function loadCierre() {
  // Load or create cierre record
  var r = await G_sb.from('month_closings')
    .select('*').eq('household_id', G_hh).eq('month', G_month).single();

  if (r.error && r.error.code === 'PGRST116') {
    // Not found — calculate balance and create
    var bal = await calcBalance();
    var ins = await G_sb.from('month_closings').insert({
      household_id: G_hh, month: G_month,
      estado: 'pendiente',
      total_gastos: bal.total,
      pagado_santi: bal.pagado_santi,
      pagado_caro:  bal.pagado_caro,
      quien_debe:   bal.quien_debe,
      monto_deuda:  bal.monto_deuda,
      iniciado_por: G_nombre
    }).select().single();
    G_cierre = ins.data;
  } else {
    G_cierre = r.data;
  }

  render();
}

async function calcBalance() {
  var r = await G_sb.from('transactions')
    .select('pagador,monto_pyg,beneficiario')
    .eq('household_id', G_hh)
    .eq('month', G_month);
  var rows = r.data || [];

  var pagado_santi = 0, pagado_caro = 0;
  rows.forEach(function(t) {
    var m = Number(t.monto_pyg||0);
    if (t.pagador === 'Santi') pagado_santi += m;
    else if (t.pagador === 'Caro') pagado_caro += m;
  });
  var total = pagado_santi + pagado_caro;
  var split = total / 2;
  var diff_santi = pagado_santi - split; // positive = Caro owes Santi
  var quien_debe = diff_santi > 0 ? 'Caro' : 'Santi';
  var monto_deuda = Math.abs(diff_santi);
  return { total, pagado_santi, pagado_caro, quien_debe, monto_deuda };
}

function render() {
  if (!G_cierre) return;
  var c = G_cierre;
  var isCerrado   = c.estado === 'cerrado';
  var isPendiente = c.estado === 'pendiente';
  var isReapertura = c.estado === 'reapertura';
  var isMe = G_nombre;

  // Update badge
  var badge = document.getElementById('estado-badge');
  badge.className = 'tb-badge ' + c.estado;
  var badgeIcon = isCerrado
    ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
    : '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
  badge.innerHTML = badgeIcon + (isCerrado ? 'Cerrado' : isReapertura ? 'Reapertura' : 'Pendiente');

  var html = '';

  // ── CLOSED BANNER ──
  if (isCerrado) {
    var cerradoFmt = c.cerrado_at ? new Date(c.cerrado_at).toLocaleDateString('es-PY',{day:'2-digit',month:'short',year:'numeric'}) : '';
    html += '<div class="closed-banner">' +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' +
      '<div class="closed-banner-text">' +
        '<div class="closed-banner-title">Mes cerrado y conciliado</div>' +
        '<div class="closed-banner-sub">Cerrado el '+cerradoFmt+'</div>' +
      '</div></div>';
  }

  // ── BALANCE ──
  var deudaClass = c.quien_debe === 'Caro' ? 'caro' : 'santi';
  html += '<div class="section">';
  html += '<div class="section-label">Resumen del mes</div>';
  html += '<div class="balance-card">';
  html += '<div class="balance-rows">';
  html += '<div class="balance-row"><span class="balance-row-label">Total gastos</span><span class="balance-row-val">Gs. '+FMT(c.total_gastos)+'</span></div>';
  html += '<div class="balance-row"><span class="balance-row-label">Santi pagó</span><span class="balance-row-val">Gs. '+FMT(c.pagado_santi)+'</span></div>';
  html += '<div class="balance-row"><span class="balance-row-label">Caro pagó</span><span class="balance-row-val">Gs. '+FMT(c.pagado_caro)+'</span></div>';
  html += '<div class="balance-divider"></div>';
  html += '<div class="balance-row"><span class="balance-row-label">Cada uno debería pagar</span><span class="balance-row-val">Gs. '+FMT(c.total_gastos/2)+'</span></div>';
  html += '</div>';
  html += '<div class="balance-deuda '+deudaClass+'">' +
    '<div class="balance-deuda-icon">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>' +
    '</div>' +
    '<div class="balance-deuda-text">' +
      '<div class="balance-deuda-who">'+c.quien_debe+' le debe a '+(c.quien_debe==='Caro'?'Santi':'Caro')+'</div>' +
      '<div class="balance-deuda-amt">Gs. '+FMT(c.monto_deuda)+'</div>' +
    '</div></div>';
  html += '</div></div>';

  // ── COMPROBANTES ──
  if (!isCerrado) {
    html += '<div class="section">';
    html += '<div class="section-label">Factura ('+G_nombre+')</div>';
    html += renderUpload('factura', c.factura_path);
    html += '</div>';

    html += '<div class="section">';
    html += '<div class="section-label">Comprobante de transferencia</div>';
    html += renderUpload('transferencia', c.transferencia_path);
    html += '</div>';
  } else {
    // Show uploaded docs if closed
    if (c.factura_path || c.transferencia_path) {
      html += '<div class="section">';
      html += '<div class="section-label">Comprobantes</div>';
      if (c.factura_path)       html += renderUploadClosed('Factura', c.factura_path);
      if (c.transferencia_path) html += renderUploadClosed('Transferencia', c.transferencia_path);
      html += '</div>';
    }
  }

  // ── APROBACIONES ──
  html += '<div class="section">';
  html += '<div class="section-label">Aprobaciones</div>';
  html += renderAprov('Santi', c.aprobado_santi);
  html += renderAprov('Caro',  c.aprobado_caro);
  html += '</div>';

  // ── REAPERTURA (if closed) ──
  if (isCerrado) {
    html += '<div class="section">';
    html += '<div class="section-label">Solicitar reapertura</div>';
    html += renderAprov('Santi', c.reapertura_santi, true);
    html += renderAprov('Caro',  c.reapertura_caro, true);
    html += '</div>';
  }

  document.getElementById('body-scroll').innerHTML = html;
  renderBottomBar(c);
}

function renderUpload(tipo, existingPath) {
  var hasFile = !!existingPath || !!G_pendingFile[tipo];
  var label = hasFile ? 'Archivo cargado' : 'Tocar para subir';
  var checkIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var uploadIcon = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';
  return '<div class="upload-wrap">' +
    '<div class="upload-area '+(hasFile?'has-file':'')+'" id="upload-'+tipo+'">' +
      '<input type="file" accept="image/*,.pdf" onchange="onFileSelect(\''+tipo+'\',this)">' +
      '<div class="upload-icon">'+(hasFile?checkIcon:uploadIcon)+'</div>' +
      '<div class="upload-label" id="upload-label-'+tipo+'">'+(G_pendingFile[tipo]?G_pendingFile[tipo].name:label)+'</div>' +
      (existingPath?'<div class="upload-status ok">Guardado</div>':'') +
    '</div>' +
  '</div>';
}

function renderUploadClosed(label, path) {
  return '<div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)">' +
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>' +
    '<span style="font-size:13px;font-weight:400">'+label+'</span>' +
    '<a onclick="verComprobante(\''+path+'\')" style="margin-left:auto;font-size:11px;color:var(--accent);cursor:pointer;text-decoration:none">Ver</a>' +
  '</div>';
}

function renderAprov(nombre, aprobado, esReapertura) {
  var checkIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var clockIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
  return '<div class="aprov-row">' +
    '<span class="aprov-who">'+nombre+'</span>' +
    '<span class="aprov-badge '+(aprobado?'ok':'pending')+'">' +
      (aprobado ? checkIcon : clockIcon) +
      (aprobado ? 'Aprobado' : 'Pendiente') +
    '</span>' +
  '</div>';
}

function renderBottomBar(c) {
  var bar = document.getElementById('bottom-bar');
  bar.style.display = 'flex';
  var html = '';
  var isCerrado = c.estado === 'cerrado';

  if (!isCerrado) {
    // Can I approve?
    var myAprovField = 'aprobado_'+myKey();
    var yaAprobe = c[myAprovField];
    var ambosAprobaron = c.aprobado_santi && c.aprobado_caro;

    if (!yaAprobe) {
      html += '<button class="btn-primary" id="btn-aprobar" onclick="aprobar()">Aprobar cierre</button>';
    } else if (!ambosAprobaron) {
      html += '<button class="btn-primary" disabled>Esperando aprobación del otro</button>';
    }
  } else {
    // Closed — show reopen button
    var reapField = 'reapertura_'+myKey();
    var yaPediReapertura = c[reapField];
    if (!yaPediReapertura) {
      html += '<button class="btn-secondary" onclick="pedirReapertura()">Solicitar reapertura</button>';
    } else {
      html += '<button class="btn-primary" disabled>Esperando que el otro apruebe la reapertura</button>';
    }
  }

  bar.innerHTML = html;
}

// ── File handling ──────────────────────────────────────
function onFileSelect(tipo, input) {
  var file = input.files[0];
  if (!file) return;
  G_pendingFile[tipo] = file;
  document.getElementById('upload-label-'+tipo).textContent = file.name;
  document.getElementById('upload-'+tipo).classList.add('has-file');
  document.getElementById('upload-'+tipo).querySelector('.upload-icon').innerHTML =
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>';
}

async function uploadFile(tipo) {
  var file = G_pendingFile[tipo];
  if (!file) return null;
  var ext  = file.name.split('.').pop();
  var path = G_hh+'/'+G_month+'/'+tipo+'-'+G_nombre.toLowerCase()+'.'+ext;
  var { error } = await G_sb.storage.from('comprobantes').upload(path, file, {upsert:true});
  if (error) throw new Error('Upload '+tipo+': '+error.message);
  return path;
}

// ── Actions ────────────────────────────────────────────
async function aprobar() {
  var btn = document.getElementById('btn-aprobar');
  if (btn) btn.disabled = true;

  // Upload pending files first
  try {
    if (G_pendingFile.factura) {
      var fp = await uploadFile('factura');
      await G_sb.from('month_closings').update({factura_path:fp}).eq('id',G_cierre.id);
      G_cierre.factura_path = fp;
    }
    if (G_pendingFile.transferencia) {
      var tp = await uploadFile('transferencia');
      await G_sb.from('month_closings').update({transferencia_path:tp}).eq('id',G_cierre.id);
      G_cierre.transferencia_path = tp;
    }
  } catch(e) {
    flash('Error subiendo archivo: '+e.message, 'err');
    if (btn) btn.disabled = false;
    return;
  }

  // Set my approval
  var field = 'aprobado_'+myKey();
  var update = {};
  update[field] = true;
  var r = await G_sb.from('month_closings').update(update).eq('id', G_cierre.id).select().single();
  if (r.error) { flash('Error: '+r.error.message,'err'); return; }
  G_cierre = r.data;

  // Check if both approved → close
  if (G_cierre.aprobado_santi && G_cierre.aprobado_caro) {
    var rc = await G_sb.from('month_closings')
      .update({estado:'cerrado', cerrado_at: new Date().toISOString()})
      .eq('id', G_cierre.id).select().single();
    G_cierre = rc.data;
    flash('Mes cerrado y conciliado ✓','ok');
  } else {
    flash('Aprobación registrada. Esperando al otro.','ok');
  }

  render();
}

async function pedirReapertura() {
  var field = 'reapertura_'+myKey();
  var update = {estado:'reapertura'};
  update[field] = true;
  var r = await G_sb.from('month_closings').update(update).eq('id', G_cierre.id).select().single();
  if (r.error) { flash('Error: '+r.error.message,'err'); return; }
  G_cierre = r.data;

  // If both requested reopen → unlock
  if (G_cierre.reapertura_santi && G_cierre.reapertura_caro) {
    var ro = await G_sb.from('month_closings')
      .update({estado:'pendiente', aprobado_santi:false, aprobado_caro:false,
               reapertura_santi:false, reapertura_caro:false, cerrado_at:null})
      .eq('id', G_cierre.id).select().single();
    G_cierre = ro.data;
    flash('Mes reabierto. Los cambios están habilitados.','ok');
  } else {
    flash('Solicitud enviada. Esperando al otro.','warn');
  }
  render();
}

async function verComprobante(path) {
  var { data } = await G_sb.storage.from('comprobantes').createSignedUrl(path, 300);
  if (data?.signedUrl) window.open(data.signedUrl, '_blank');
}

// ── Helpers ────────────────────────────────────────────
function goBack() { if(document.referrer) history.back(); else window.location.href='/finanzas/'; }

function flash(msg,type) {
  if (type === 'err' && window.Logger) Logger.error('hogar-cierre','FLASH_ERROR', msg);
  var c={ok:'#22c55e',err:'#ef4444',warn:'#F59E0B'}[type||'ok'];
  var el=document.createElement('div');
  el.style.cssText='display:inline-block;background:#111;border:1px solid '+c+';color:'+c+';padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;pointer-events:none;white-space:nowrap';
  el.textContent=msg;
  document.getElementById('flash-wrap').appendChild(el);
  setTimeout(function(){el.remove();},3000);
}

document.addEventListener('DOMContentLoaded', waitAndBoot);
</script>
