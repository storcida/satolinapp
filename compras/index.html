<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f5"  media="(prefers-color-scheme: light)">
<title>PEARS · Compras</title>
<link rel="icon" type="image/svg+xml" href="../SATOLINAPP1.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/base.css">
<style>

/* ── Compras accent ── */
:root { --accent: var(--accent-compras); }

/* ── Login ── */
#loginScreen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100dvh; padding: var(--s-6); flex-direction: column; gap: var(--s-7);
}
#loginScreen.hidden { display: none; }
.login-wordmark { text-align: center; }
.login-wordmark .logotype {
  font-size: 36px; font-weight: var(--w-thin); letter-spacing: 12px;
  text-transform: uppercase; color: var(--text); line-height: 1; margin-bottom: var(--s-2);
}
.login-wordmark .tagline {
  font-size: var(--text-label); font-weight: var(--w-medium); text-transform: uppercase;
  letter-spacing: 3px; color: var(--muted);
}
.login-btn-google {
  display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-5);
  border: 1px solid var(--border2); border-radius: var(--r-md); background: var(--panel);
  color: var(--text); font-size: var(--text-body); font-weight: var(--w-medium);
  cursor: pointer; transition: background var(--anim-micro); font-family: var(--font); white-space: nowrap;
}
.login-btn-google:hover { background: var(--raised); }
.login-btn-google svg { width: 16px; height: 16px; flex-shrink: 0; }
#loginStatus { font-size: var(--text-meta); color: var(--muted); min-height: 16px; }

/* ── Offline badge ── */
#offlineBadge {
  display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  background: var(--warn); color: #000; text-align: center;
  font-size: var(--text-label); font-weight: var(--w-medium);
  letter-spacing: 2px; text-transform: uppercase; padding: var(--s-1) var(--s-2);
}
#offlineBadge.show { display: block; }

/* ── App layout ── */
#app { display: none; flex-direction: column; min-height: 100dvh; }
#app.active { display: flex; }

.mainContent {
  flex: 1; overflow-y: auto;
  padding: var(--s-4) var(--s-4) 100px;
  max-width: 480px; width: 100%; margin: 0 auto;
}

/* ── Header ── */
.compras-header {
  position: sticky; top: 0; z-index: 50; background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: var(--s-3) var(--s-4);
  display: flex; align-items: center; gap: var(--s-3);
}
.header-back {
  width: 28px; height: 28px; border-radius: var(--r-pill);
  background: var(--raised); border: 1px solid var(--border);
  color: var(--muted); display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0; text-decoration: none;
  transition: background var(--anim-micro);
}
.header-back:hover { background: var(--active); color: var(--text); }
.header-middle { flex: 1; display: flex; flex-direction: column; gap: 1px; }
.header-breadcrumb {
  font-size: var(--text-label); font-weight: var(--w-medium);
  text-transform: uppercase; letter-spacing: 2.5px; color: var(--muted);
}
.header-title {
  font-size: var(--text-body); font-weight: var(--w-medium);
  color: var(--text);
}
#headerAvatar {
  width: 28px; height: 28px; border-radius: var(--r-pill);
  border: 1px solid var(--border2); object-fit: cover; cursor: pointer;
  display: none; transition: border-color var(--anim-micro); flex-shrink: 0;
}
#whoLabel { font-size: var(--text-label); color: var(--muted); cursor: pointer; flex-shrink: 0; }

/* ── Module tabs ── */
.moduleTabs {
  display: flex; border-bottom: 1px solid var(--border);
  background: var(--bg); position: sticky; top: 49px; z-index: 40;
  max-width: 480px; margin: 0 auto; width: 100%;
}
.moduleTab {
  flex: 1; padding: var(--s-3) var(--s-2);
  font-size: var(--text-label); font-weight: var(--w-medium);
  text-transform: uppercase; letter-spacing: 2px; color: var(--muted);
  border-bottom: 2px solid transparent;
  transition: color var(--anim-micro), border-color var(--anim-micro);
  font-family: var(--font);
}
.moduleTab.active { color: var(--accent); border-bottom-color: var(--accent); }
.moduleTab.backTab {
  flex: 0; padding: var(--s-3) var(--s-4);
  font-size: 16px; color: var(--muted);
}
.moduleTab.backTab:hover { color: var(--text); }

/* ── Cards (listas) ── */
.secTitle {
  font-size: var(--text-label); font-weight: var(--w-medium);
  text-transform: uppercase; letter-spacing: 2.5px; color: var(--muted);
  margin: var(--s-4) 0 var(--s-2);
}
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: var(--s-4);
  margin-bottom: var(--s-3); cursor: pointer;
  transition: background var(--anim-micro);
  -webkit-tap-highlight-color: transparent;
}
.card:hover { background: var(--raised); }
.cardHead { display: flex; justify-content: space-between; align-items: center; gap: var(--s-3); margin-bottom: 4px; }
.cardTitle { font-size: var(--text-body); font-weight: var(--w-medium); }
.cardMeta { display: flex; gap: var(--s-3); font-size: var(--text-meta); color: var(--muted); flex-wrap: wrap; }

.badge { display: inline-flex; align-items: center; padding: 2px var(--s-2); border-radius: var(--r-pill); font-size: var(--text-label); font-weight: var(--w-medium); letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--border); }
.badge.ok   { background: rgba(57,255,90,.08); border-color: rgba(57,255,90,.2); color: var(--ok); }
.badge.dim  { background: var(--raised); color: var(--muted); }

.btn-del {
  background: none; border: none; cursor: pointer; padding: var(--s-1);
  color: var(--dim); font-size: 14px; border-radius: var(--r-sm);
  transition: color var(--anim-micro); line-height: 1;
}
.btn-del:hover { color: var(--err); }

/* ── Detail view ── */
.searchWrap { position: relative; margin-bottom: var(--s-2); }
.searchInput {
  width: 100%; background: var(--raised); border: 1px solid var(--border);
  border-radius: var(--r-md); color: var(--text); padding: var(--s-3);
  font-size: var(--text-body); font-family: var(--font); outline: none;
  transition: border-color var(--anim-micro);
}
.searchInput:focus { border-color: var(--accent); }
.searchInput::placeholder { color: var(--dim); }
.searchHint { font-size: var(--text-meta); color: var(--dim); margin-bottom: var(--s-3); }

.dropdown {
  display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 60;
  background: var(--panel); border: 1px solid var(--border2); border-radius: var(--r-md);
  overflow: hidden; margin-top: 2px;
}
.dropdown.show { display: block; }
.ddNew, .ddItem {
  padding: var(--s-3) var(--s-4); font-size: var(--text-body);
  border-bottom: 1px solid var(--border); cursor: pointer;
  display: flex; align-items: center; gap: var(--s-3);
}
.ddItem:last-child, .ddNew { border-bottom: none; }
.ddItem:hover, .ddNew:hover { background: var(--raised); }
.ddItem.sel { background: var(--active); }
.ddItem .ddPh { width: 28px; height: 28px; border-radius: var(--r-sm); object-fit: cover; background: var(--raised); flex-shrink: 0; }
.ddMeta { font-size: var(--text-meta); color: var(--muted); }

.budgetBar { background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s-3); margin-bottom: var(--s-3); }
.budgetRow { display: flex; justify-content: space-between; align-items: center; font-size: var(--text-body); margin-bottom: var(--s-2); }
.budgetTrack { height: 3px; background: var(--border); border-radius: var(--r-pill); overflow: hidden; }
.budgetFill { height: 100%; border-radius: var(--r-pill); transition: width 0.3s; }

.statsRow { display: flex; gap: var(--s-4); font-size: var(--text-meta); color: var(--muted); margin-bottom: var(--s-2); }
.statsRow strong { color: var(--text); font-weight: var(--w-medium); }
.progressWrap { height: 2px; background: var(--border); border-radius: var(--r-pill); margin-bottom: var(--s-4); overflow: hidden; }
.progressFill { height: 100%; background: var(--accent); border-radius: var(--r-pill); transition: width 0.3s; }

.catGroup { margin-bottom: var(--s-3); }
.catHead {
  font-size: var(--text-label); font-weight: var(--w-medium);
  text-transform: uppercase; letter-spacing: 2px; color: var(--muted);
  padding: var(--s-2) 0; display: flex; align-items: center; gap: var(--s-2);
}
.catHead .cnt { color: var(--dim); }

.checkItem {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) 0; border-bottom: 1px solid var(--border);
  transition: opacity var(--anim-micro);
}
.checkItem.chk { opacity: 0.45; }
.checkItem:last-child { border-bottom: none; }
.ckb {
  width: 22px; height: 22px; border-radius: var(--r-sm);
  border: 1.5px solid var(--border2); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; cursor: pointer; transition: background var(--anim-micro);
}
.checkItem.chk .ckb { background: var(--accent); border-color: var(--accent); color: #000; }
.ckThumb {
  width: 32px; height: 32px; border-radius: var(--r-sm);
  background: var(--raised); flex-shrink: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.ckThumb img { width: 100%; height: 100%; object-fit: cover; }
.ckBody { flex: 1; min-width: 0; cursor: pointer; }
.ckName { font-size: var(--text-body); font-weight: var(--w-regular); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ckDets { display: flex; gap: var(--s-2); font-size: var(--text-meta); color: var(--muted); flex-wrap: wrap; margin-top: 1px; }
.ckBrand { color: var(--dim); }
.ckBy { color: var(--dim); }
.ckRight { display: flex; align-items: center; gap: var(--s-2); flex-shrink: 0; }
.ckPrice { font-size: var(--text-meta); color: var(--muted); font-weight: var(--w-medium); white-space: nowrap; }
.qtyW { display: flex; align-items: center; gap: var(--s-1); }
.qtyB {
  width: 22px; height: 22px; border-radius: var(--r-sm);
  background: var(--raised); border: 1px solid var(--border);
  color: var(--text); font-size: 14px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-family: var(--font);
}
.qtyV { font-size: var(--text-meta); color: var(--text); min-width: 16px; text-align: center; }
.delB { background: none; border: none; cursor: pointer; color: var(--dim); font-size: 14px; padding: var(--s-1); }
.delB:hover { color: var(--err); }

.actionBar { display: flex; gap: var(--s-3); padding: var(--s-4) 0 var(--s-2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); padding: var(--s-3) var(--s-4); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--panel); color: var(--text); font-family: var(--font); font-size: var(--text-body); font-weight: var(--w-medium); cursor: pointer; transition: background var(--anim-micro); white-space: nowrap; }
.btn:hover { background: var(--raised); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #000; }
.btn.primary:hover { opacity: .88; }
.btn.danger { color: var(--err); border-color: rgba(255,45,45,.3); }
.btn.danger:hover { background: rgba(255,45,45,.06); }
.btn.success { background: var(--ok); border-color: var(--ok); color: #000; }
.btn.success:hover { opacity: .88; }
.btn.block { width: 100%; }
.btn.f1 { flex: 1; }
.btn.sm { padding: var(--s-2) var(--s-3); font-size: var(--text-meta); }

/* ── FAB ── */
.fab {
  position: fixed; bottom: var(--s-5); right: var(--s-4);
  width: 48px; height: 48px; border-radius: var(--r-pill);
  background: var(--accent); color: #000; font-size: 24px;
  display: flex; align-items: center; justify-content: center;
  z-index: 40; transition: transform var(--anim-micro);
  border: none; font-family: var(--font); cursor: pointer;
}
.fab:active { transform: scale(0.92); }

/* ── User menu overlay ── */
#menuOverlay {
  display: none; position: fixed; inset: 0; z-index: 90;
  background: rgba(0,0,0,.5); align-items: flex-end; justify-content: center;
}
.menuPanel {
  width: min(480px,100%); background: var(--panel); border: 1px solid var(--border2);
  border-radius: var(--r-xl) var(--r-xl) 0 0; padding: var(--s-5) var(--s-4) var(--s-6);
  max-height: 70dvh; overflow-y: auto;
}
.menuProfile { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-4); }
.menuProfileName  { font-size: var(--text-body);  font-weight: var(--w-medium); }
.menuProfileEmail { font-size: var(--text-meta); color: var(--muted); margin-top: 2px; }
.menuLink {
  display: block; width: 100%; text-align: left; padding: var(--s-3) 0;
  font-size: var(--text-body); color: var(--muted); font-family: var(--font);
  background: none; border: none; cursor: pointer;
  transition: color var(--anim-micro); border-bottom: 1px solid var(--border);
}
.menuLink:hover { color: var(--text); }
.menuLogout { display: block; width: 100%; text-align: left; padding: var(--s-3) 0; font-size: var(--text-body); color: var(--err); font-family: var(--font); background: none; border: none; cursor: pointer; margin-top: var(--s-3); }
.menuLink-active { color: var(--accent) !important; cursor: default; pointer-events: none; }
.menuDivider { height: 1px; background: var(--border); margin: var(--s-2) 0; }
#menuSyncWrap { padding: var(--s-2) 0; }

/* ── Modals ── */
.modalBg {
  position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.7);
  display: none; align-items: flex-end; justify-content: center;
}
.modalBg.open { display: flex; }
.modal {
  width: min(480px,100%); max-height: 90dvh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--border2);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  padding: var(--s-5) var(--s-4);
  animation: slideUp var(--anim-modal) forwards;
}
.modalHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--s-4); }
.modalTitle { font-size: var(--text-label); font-weight: var(--w-medium); text-transform: uppercase; letter-spacing: 2.5px; }
.mClose {
  width: 28px; height: 28px; border-radius: var(--r-pill);
  background: var(--raised); color: var(--muted); border: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; cursor: pointer; font-family: var(--font);
  transition: color var(--anim-micro);
}
.mClose:hover { color: var(--text); }
.fg { margin-bottom: var(--s-3); }
.fl { display: block; font-size: var(--text-label); font-weight: var(--w-medium); text-transform: uppercase; letter-spacing: 2.5px; color: var(--muted); margin-bottom: var(--s-1); }
.fi, .fs {
  width: 100%; background: var(--raised); border: 1px solid var(--border);
  border-radius: var(--r-md); color: var(--text); padding: var(--s-3);
  font-size: var(--text-body); font-family: var(--font); outline: none;
  transition: border-color var(--anim-micro); appearance: none;
}
.fi:focus, .fs:focus { border-color: var(--border2); }
.fi::placeholder { color: var(--dim); }
.fs option { background: var(--panel); }
.frow { display: flex; gap: var(--s-3); }
.frow .fg { flex: 1; }

/* ── Star rating ── */
.starR { display: flex; gap: var(--s-2); }
.star { font-size: 24px; cursor: pointer; color: var(--border2); transition: color var(--anim-micro); }
.star.on { color: var(--accent-prestamos); }

/* ── Share box ── */
.shareBox {
  background: var(--raised); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: var(--s-3);
  font-size: var(--text-meta); color: var(--text);
  white-space: pre-wrap; max-height: 160px; overflow-y: auto;
  line-height: 1.6;
}

/* ── Photo button ── */
.photoBtn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: var(--s-2) var(--s-4); border: 1px solid var(--border);
  border-radius: var(--r-md); background: var(--raised); color: var(--text);
  font-size: var(--text-meta); font-weight: var(--w-medium);
  cursor: pointer; font-family: var(--font); transition: background var(--anim-micro);
}
.photoBtn:hover { background: var(--active); }

/* ── Scanner ── */
#scannerWrap {
  display: none; position: fixed; inset: 0; z-index: 110;
  background: #000; flex-direction: column;
  align-items: center; justify-content: center; gap: var(--s-4);
}
#scannerWrap.open { display: flex; }
.scanClose {
  position: absolute; top: var(--s-5); right: var(--s-4);
  background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25);
  color: #fff; border-radius: var(--r-pill); padding: var(--s-2) var(--s-4);
  font-family: var(--font); font-size: var(--text-body); cursor: pointer;
}

/* ── Empty ── */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--s-8) var(--s-4); color: var(--dim); text-align: center; gap: var(--s-3); }
.emptyIcon { font-size: 40px; }

</style>
</head>
<body>

<!-- OFFLINE BADGE -->
<div id="offlineBadge"></div>

<!-- LOGIN -->


<!-- FLASH -->
<div id="flash-wrap"></div>

<!-- APP -->
<div id="app">

  <!-- HEADER -->
  <header class="compras-header" id="mainHeader">
    <a class="header-back" href="../index.html">&#8592;</a>
    <div class="header-middle">
      <div class="header-breadcrumb">PEARS</div>
      <div class="header-title" id="headerGreeting">Compras</div>
    </div>
    <img id="headerAvatar" src="" alt="avatar" onclick="toggleMenu()"/>
    <span id="whoLabel" onclick="toggleMenu()"></span>
  </header>

  <!-- USER MENU -->
  <div id="menuOverlay" onclick="if(event.target===this)closeMenu()">
    <div class="menuPanel" onclick="event.stopPropagation()">
      <div class="menuProfile">
        <div id="menuAvatarWrap"></div>
        <div>
          <div class="menuProfileName"  id="menuName">—</div>
          <div class="menuProfileEmail" id="menuEmail">—</div>
        </div>
      </div>
      <div id="menuSyncWrap"></div>
      <div class="menuDivider"></div>
      <button class="menuLink" onclick="closeMenu();window.location.href='../'">← Home</button>
      <button class="menuLink menuLink-active">Compras</button>
      <button class="menuLink" onclick="closeMenu();window.location.href='../finanzas/'">Hogar</button>
      <button class="menuLink" onclick="closeMenu();window.location.href='../viajes/'">Viajes</button>
      <button class="menuLink" onclick="closeMenu();window.location.href='../prestamos/'">Préstamos</button>
      <button class="menuLink" onclick="closeMenu();window.location.href='../finanzas-personales/'">Finanzas Personales</button>
      <div class="menuDivider"></div>
      <button class="menuLogout" onclick="Auth.logout()">Cerrar sesión</button>
    </div>
  </div>

  <!-- MODULE TABS -->
  <div class="moduleTabs">
    <button class="moduleTab active" id="tabSuper"    onclick="switchModule('super')">Super</button>
    <button class="moduleTab"        id="tabFarmacia" onclick="switchModule('farmacia')">Farmacia</button>
  </div>

  <!-- MAIN CONTENT -->
  <div class="mainContent" id="mc"></div>

  <!-- FAB -->
  <button class="fab" id="fabBtn" onclick="showNewListaModal()">+</button>
</div>

<!-- MODAL: NUEVA LISTA -->
<div id="mNL" class="modalBg" onclick="if(event.target===this)closeM('mNL')">
  <div class="modal">
    <div class="modalHead">
      <div class="modalTitle">Nueva Lista</div>
      <button class="mClose" onclick="closeM('mNL')">✕</button>
    </div>
    <div class="fg"><label class="fl">Título</label><input class="fi" id="nlT" placeholder="Ej: Compra del mes"></div>
    <div class="fg"><label class="fl">Tipo</label>
      <select class="fs" id="nlTp">
        <option value="normal">Normal</option>
        <option value="mensual">Del mes</option>
        <option value="quincenal">Quincenal</option>
        <option value="urgente">Urgente</option>
      </select>
    </div>
    <div class="fg"><label class="fl">Presupuesto (₲) — opcional</label><input class="fi" id="nlP" type="number" placeholder="Sin límite"></div>
    <button class="btn primary block" onclick="createLista()">Crear Lista</button>
  </div>
</div>

<!-- MODAL: EDITAR ITEM -->
<div id="mEI" class="modalBg" onclick="if(event.target===this)closeM('mEI')">
  <div class="modal">
    <div class="modalHead">
      <div class="modalTitle" id="eiTitle">Editar</div>
      <button class="mClose" onclick="closeM('mEI')">✕</button>
    </div>
    <input type="hidden" id="eiId"/>
    <div id="eiHeroWrap" style="display:flex;flex-direction:column;align-items:center;margin:-4px calc(-1*var(--s-4)) var(--s-4);padding:var(--s-4);background:var(--raised);border-radius:var(--r-lg) var(--r-lg) 0 0">
      <img id="eiPhoto" src="" style="display:none;width:180px;height:180px;object-fit:cover;border-radius:var(--r-lg);border:1px solid var(--border);margin-bottom:var(--s-3)">
      <div id="eiPhotoPlaceholder" style="width:180px;height:180px;border-radius:var(--r-lg);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:40px;opacity:.3;margin-bottom:var(--s-3)">📷</div>
      <div style="display:flex;gap:var(--s-2)">
        <label class="photoBtn"><input type="file" id="eiPhotoFile" accept="image/*" capture="environment" style="display:none" onchange="onPhotoSelect(this)">Foto</label>
        <button class="photoBtn" onclick="startScanner('edit')" type="button">Escanear</button>
      </div>
      <input type="hidden" id="eiBarcode">
      <div id="eiBarcodeLabel" style="font-size:var(--text-meta);color:var(--dim);margin-top:var(--s-1)"></div>
    </div>
    <div class="fg"><label class="fl">Nombre</label><input class="fi" id="eiNombre" placeholder="Nombre del producto"></div>
    <div class="fg"><label class="fl">Categoría</label><select class="fs" id="eiCat"></select></div>
    <div class="frow">
      <div class="fg"><label class="fl">Tamaño</label><input class="fi" id="eiTam" placeholder="500ml, 1kg..."></div>
      <div class="fg"><label class="fl">Unidad</label>
        <select class="fs" id="eiUn">
          <option value="un">Unidad</option>
          <option value="kg">Kg</option>
          <option value="g">Gramos</option>
          <option value="L">Litros</option>
          <option value="ml">ml</option>
          <option value="m">Metros</option>
        </select>
      </div>
    </div>
    <div class="frow">
      <div class="fg"><label class="fl">Marca</label><input class="fi" id="eiMa" placeholder="Marca"></div>
      <div class="fg"><label class="fl">Si no hay...</label><input class="fi" id="eiMaA" placeholder="Alternativa"></div>
    </div>
    <div class="fg"><label class="fl">Precio estimado (₲)</label><input class="fi" id="eiPr" type="number" placeholder="0"></div>
    <div class="fg"><label class="fl">Notas</label><input class="fi" id="eiNo" placeholder="Observaciones..."></div>
    <div style="display:flex;gap:var(--s-3);margin-top:var(--s-3)">
      <button class="btn danger f1" onclick="delFromEdit()">Eliminar</button>
      <button class="btn primary f1" onclick="saveEdit()" style="flex:2">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL: FINALIZAR -->
<div id="mFin" class="modalBg" onclick="if(event.target===this)closeM('mFin')">
  <div class="modal">
    <div class="modalHead">
      <div class="modalTitle">Finalizar Compra</div>
      <button class="mClose" onclick="closeM('mFin')">✕</button>
    </div>
    <div class="fg"><label class="fl">¿En qué super?</label><input class="fi" id="finS" placeholder="Casa Rica, Biggie, Real..."></div>
    <div class="fg"><label class="fl">¿Cómo estuvo?</label><div class="starR" id="finSt"></div></div>
    <div class="fg"><label class="fl">Notas</label><input class="fi" id="finN" placeholder="Limpieza, atención..."></div>
    <div style="background:var(--raised);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s-3);margin-bottom:var(--s-4)">
      <div class="fl" style="margin-bottom:var(--s-2)">Resumen</div>
      <div style="display:flex;justify-content:space-between;font-size:var(--text-body)"><span style="color:var(--muted)">Items</span><span id="finI" style="font-weight:var(--w-medium)">0</span></div>
      <div style="display:flex;justify-content:space-between;font-size:var(--text-body);margin-top:4px"><span style="color:var(--muted)">Total</span><span id="finTo" style="font-weight:var(--w-medium);color:var(--accent)">₲ 0</span></div>
      <div style="display:flex;justify-content:space-between;font-size:var(--text-meta);margin-top:4px"><span style="color:var(--dim)">Clima</span><span id="finCl" style="color:var(--muted)">—</span></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3);margin-bottom:var(--s-3)">
      <button class="btn danger" onclick="confirmFin('cancelar')">✕ Cancelar compra</button>
      <button class="btn success" onclick="confirmFin('comprar')">✓ Compra realizada</button>
    </div>
    <div style="font-size:var(--text-meta);color:var(--muted);line-height:1.6;padding:var(--s-3);background:var(--raised);border-radius:var(--r-md)">
      <strong style="color:var(--text)">✓ Compra realizada:</strong> Tildados = comprados, sin tildar → "Falta Comprar"<br>
      <strong style="color:var(--text)">✕ Cancelar:</strong> Todos los items → "Falta Comprar"
    </div>
  </div>
</div>

<!-- MODAL: COMPARTIR -->
<div id="mSh" class="modalBg" onclick="if(event.target===this)closeM('mSh')">
  <div class="modal">
    <div class="modalHead">
      <div class="modalTitle">Compartir</div>
      <button class="mClose" onclick="closeM('mSh')">✕</button>
    </div>
    <div class="shareBox" id="shTxt"></div>
    <div style="display:flex;gap:var(--s-3);margin-top:var(--s-3)">
      <button class="btn f1" onclick="copySh()">Copiar</button>
      <button class="btn f1" onclick="sendWA()" style="background:#25D366;border-color:#25D366;color:#000">WhatsApp</button>
    </div>
  </div>
</div>

<!-- MODAL: NUEVO PRODUCTO -->
<div id="mNP" class="modalBg" onclick="if(event.target===this)closeM('mNP')">
  <div class="modal">
    <div class="modalHead">
      <div class="modalTitle">Nuevo Producto</div>
      <button class="mClose" onclick="closeM('mNP')">✕</button>
    </div>
    <div class="fg"><label class="fl">Nombre</label><input class="fi" id="npN" placeholder="Nombre del producto"></div>
    <div class="fg"><label class="fl">Categoría</label><select class="fs" id="npC"></select></div>
    <div class="fg"><label class="fl">Unidad</label>
      <select class="fs" id="npU">
        <option value="un">Unidad</option>
        <option value="kg">Kg</option>
        <option value="g">Gramos</option>
        <option value="L">Litros</option>
        <option value="ml">ml</option>
      </select>
    </div>
    <div style="display:flex;gap:var(--s-2);margin:var(--s-2) 0">
      <label class="photoBtn" style="flex:1;justify-content:center"><input type="file" id="npPhotoFile" accept="image/*" capture="environment" style="display:none" onchange="onNpPhotoSelect(this)">Foto</label>
      <button class="photoBtn" onclick="startScanner('new')" type="button" style="flex:1;justify-content:center">Escanear</button>
    </div>
    <input type="hidden" id="npBarcode">
    <div id="npBarcodeLabel" style="font-size:var(--text-meta);color:var(--dim);margin-bottom:var(--s-2)"></div>
    <button class="btn primary block" onclick="createProd()">Crear y Agregar</button>
  </div>
</div>

<!-- BARCODE SCANNER -->
<div id="scannerWrap">
  <button class="scanClose" onclick="stopScanner()">✕ Cerrar</button>
  <div id="scannerReader" style="width:min(400px,90vw)"></div>
  <div style="color:rgba(255,255,255,.5);font-size:var(--text-meta);margin-top:var(--s-4);text-align:center">Apuntá al código de barras</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="../storage-helper.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/api.js"></script>
<script src="app.js"></script>
</body>
</html>
