<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PEARS · Personal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--s1:#080808;--s2:#111;
  --border:#1a1a1a;--border2:#2a2a2a;
  --text:#fff;--muted:#666;--dim:#333;--accent:#8dd900;
  --err:#ef4444;--ok:#22c55e;--warn:#F59E0B;
  --font:'Inter',-apple-system,sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;height:52px;background:var(--bg);border-bottom:1px solid var(--border);padding:0 4px}
.tb-back{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:none;background:none;color:var(--muted);cursor:pointer;flex-shrink:0;transition:color 120ms}
.tb-back:hover{color:var(--text)}
.tb-title{flex:1;text-align:center;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:3px}
.tb-save{height:36px;padding:0 16px;background:var(--accent);border:none;border-radius:6px;color:#000;font-size:12px;font-weight:500;font-family:var(--font);cursor:pointer;margin-right:8px;transition:opacity 120ms}
.tb-save:disabled{opacity:.4;cursor:not-allowed}
.body-scroll{padding:0 0 120px;animation:fadeIn 200ms ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.section{border-bottom:1px solid var(--border)}
.section-label{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:3px;color:var(--muted);padding:16px 16px 8px}
.toggle-row{display:flex;gap:0;border-top:1px solid var(--border)}
.toggle-btn{flex:1;padding:13px 8px;border:none;border-bottom:2px solid transparent;background:var(--s1);color:var(--muted);font-family:var(--font);font-size:13px;font-weight:400;cursor:pointer;transition:background 120ms,color 120ms,border-color 120ms;-webkit-tap-highlight-color:transparent}
.toggle-btn.active{background:#141414;color:var(--text);border-bottom-color:var(--accent)}
.field{padding:0 16px;border-bottom:1px solid var(--border)}
.field:last-child{border-bottom:none}
.field-row{display:flex}
.field-row .field{flex:1;border-right:1px solid var(--border)}
.field-row .field:last-child{border-right:none}
.field-label{display:block;font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted);padding-top:14px;margin-bottom:6px}
.fi,.fs{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:15px;font-weight:300;padding:0 0 14px;outline:none;appearance:none}
.fi::placeholder{color:var(--dim)}
.fi[type=date]{color-scheme:dark;font-size:14px}
.fs option{background:var(--s2)}
.monto-wrap{display:flex;align-items:baseline;gap:6px;padding-bottom:14px}
.monto-prefix{font-size:13px;color:var(--muted)}
.monto-input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:24px;font-weight:200;outline:none;padding:0}
.monto-input::placeholder{color:var(--dim)}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.btn-primary{width:100%;padding:15px;background:var(--accent);border:none;border-radius:8px;color:#000;font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;transition:opacity 120ms}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-delete{background:none;border:none;color:var(--err);font-family:var(--font);font-size:13px;cursor:pointer;padding:4px 0 8px;text-align:center;width:100%}
#flash-wrap{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
</style>
</head>
<body>
<div class="topbar">
  <button class="tb-back" onclick="goBack()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <span class="tb-title" id="page-title">Nuevo movimiento</span>
  <button class="tb-save" id="btn-save-top" onclick="guardar()" disabled>Guardar</button>
</div>
<div id="flash-wrap"></div>
<div class="body-scroll">

  <!-- TIPO -->
  <div class="section">
    <div class="section-label">Tipo</div>
    <div class="toggle-row">
      <button class="toggle-btn active" data-field="tipo" onclick="setToggle(this)">Egreso</button>
      <button class="toggle-btn" data-field="tipo" onclick="setToggle(this)">Ingreso</button>
    </div>
  </div>

  <!-- MONTO + FECHA -->
  <div class="section">
    <div class="field">
      <label class="field-label">Monto</label>
      <div class="monto-wrap">
        <span class="monto-prefix">Gs.</span>
        <input class="monto-input" id="f-monto" type="text" inputmode="numeric" placeholder="0" oninput="fmtMonto(this);checkReady()">
      </div>
    </div>
    <div class="field">
      <label class="field-label">Fecha</label>
      <input class="fi" id="f-fecha" type="date" onchange="checkReady()">
    </div>
  </div>

  <!-- CATEGORÍA + CONCEPTO -->
  <div class="section">
    <div class="field">
      <label class="field-label">Categoría</label>
      <select class="fs" id="f-cat">
        <option>Supermercado</option><option>Auto</option><option>Salud</option>
        <option>Club/Gym</option><option>Ocio</option><option>Ropa</option>
        <option>Educación</option><option>Farmacia</option><option>Restaurantes</option>
        <option>Transporte</option><option>Viaje</option><option>Servicios</option>
        <option>Ahorro</option><option>Ingresos</option><option>Otros</option>
      </select>
    </div>
    <div class="field">
      <label class="field-label">Concepto</label>
      <input class="fi" id="f-concepto" placeholder="Ej: Cena, nafta, consulta..." oninput="checkReady()">
    </div>
  </div>

  <!-- MÉTODO -->
  <div class="section">
    <div class="section-label">Método de pago</div>
    <div class="toggle-row">
      <button class="toggle-btn active" data-field="metodo" onclick="setToggle(this)">Crédito</button>
      <button class="toggle-btn" data-field="metodo" onclick="setToggle(this)">Débito</button>
      <button class="toggle-btn" data-field="metodo" onclick="setToggle(this)">Transferencia</button>
      <button class="toggle-btn" data-field="metodo" onclick="setToggle(this)">Efectivo</button>
    </div>
  </div>

  <!-- BANCO -->
  <div class="section">
    <div class="section-label">Banco</div>
    <div class="toggle-row">
      <button class="toggle-btn active" data-field="banco" onclick="setToggle(this)">Itaú</button>
      <button class="toggle-btn" data-field="banco" onclick="setToggle(this)">GNB</button>
      <button class="toggle-btn" data-field="banco" onclick="setToggle(this)">Efectivo</button>
      <button class="toggle-btn" data-field="banco" onclick="setToggle(this)">Trueque</button>
    </div>
  </div>

  <!-- NOTA -->
  <div class="section">
    <div class="field">
      <label class="field-label">Nota</label>
      <input class="fi" id="f-nota" placeholder="Opcional">
    </div>
  </div>

</div>
<div class="bottom-bar">
  <button class="btn-primary" id="btn-save-bottom" onclick="guardar()">Guardar</button>
  <button class="btn-delete" id="btn-delete" style="display:none" onclick="eliminar()">Eliminar movimiento</button>
</div>

<script>
const G_URL='https://hahhmpvfyrmwnaqxibvt.supabase.co';
const G_KEY='sb_publishable_WTjwtY_ghLdfShnDhkqHUA_u_1Hn762';
var G_sb=null,G_hh=null,G_nombre=null,G_userId=null;
var G_params=new URLSearchParams(location.search);
var IS_NEW=G_params.has('new');
var G_editId=G_params.get('id')||null;

Auth.onReady(async function(user){
  G_sb=Auth.client();
  G_nombre=user.nombre_corto||user.nombre;
  G_userId=user.id;
  G_hh=user.household_id;
  document.getElementById('f-fecha').value=new Date().toISOString().slice(0,10);
  if(G_editId){
    var r=await G_sb.from('finanzas_personales').select('*').eq('id',G_editId).single();
    if(r.data) populateEdit(r.data);
    document.getElementById('page-title').textContent='Editar movimiento';
    document.getElementById('btn-save-top').textContent='Guardar';
    document.getElementById('btn-save-bottom').textContent='Guardar cambios';
    document.getElementById('btn-delete').style.display='block';
  }
  checkReady();
});

function populateEdit(t){
  document.querySelectorAll('[data-field="tipo"]').forEach(b=>b.classList.toggle('active',b.textContent.trim().toLowerCase()===t.tipo));
  document.getElementById('f-monto').value=new Intl.NumberFormat('es-PY').format(t.monto||0);
  document.getElementById('f-fecha').value=t.fecha||'';
  document.getElementById('f-cat').value=t.categoria||'Otros';
  document.getElementById('f-concepto').value=t.concepto||'';
  document.getElementById('f-nota').value=t.notas||'';
  if(t.banco) document.querySelectorAll('[data-field="banco"]').forEach(b=>b.classList.toggle('active',b.textContent.trim()===t.banco));
  if(t.metodo) document.querySelectorAll('[data-field="metodo"]').forEach(b=>b.classList.toggle('active',b.textContent.trim()===t.metodo));
}

function setToggle(btn){
  btn.closest('.toggle-row').querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function fmtMonto(input){
  var raw=input.value.replace(/\D/g,'');
  if(raw) input.value=new Intl.NumberFormat('es-PY').format(parseInt(raw));
  else input.value='';
}

function checkReady(){
  var mon=parseInt((document.getElementById('f-monto').value||'').replace(/\D/g,''))||0;
  var con=(document.getElementById('f-concepto').value||'').trim();
  var fec=document.getElementById('f-fecha').value;
  var ok=mon>0&&con.length>0&&fec.length>0;
  document.getElementById('btn-save-top').disabled=!ok;
  document.getElementById('btn-save-bottom').disabled=!ok;
}

async function guardar(){
  var tipo=document.querySelector('[data-field="tipo"].active').textContent.trim().toLowerCase();
  var monto=parseInt((document.getElementById('f-monto').value||'').replace(/\D/g,''))||0;
  var fecha=document.getElementById('f-fecha').value;
  var cat=document.getElementById('f-cat').value;
  var con=document.getElementById('f-concepto').value.trim();
  var metodo=document.querySelector('[data-field="metodo"].active')?.textContent.trim()||null;
  var banco=document.querySelector('[data-field="banco"].active')?.textContent.trim()||null;
  var nota=document.getElementById('f-nota').value.trim()||null;
  if(!monto||!con){flash('Completá monto y concepto','warn');return;}
  var payload={
    tipo,monto,fecha,categoria:cat,concepto:con,metodo,banco,notas:nota,
    month:fecha.slice(0,7),usuario:G_nombre,household_id:G_hh,
    updated_at:new Date().toISOString()
  };
  setBusy(true);
  var r;
  if(G_editId){
    r=await G_sb.from('finanzas_personales').update(payload).eq('id',G_editId);
  } else {
    r=await G_sb.from('finanzas_personales').insert(payload);
  }
  setBusy(false);
  if(r.error){flash('Error: '+r.error.message,'err');return;}
  flash(G_editId?'Cambios guardados':'Movimiento guardado','ok');
  setTimeout(goBack,700);
}

async function eliminar(){
  if(!confirm('Eliminar este movimiento?'))return;
  var r=await G_sb.from('finanzas_personales').delete().eq('id',G_editId);
  if(r.error){flash('Error: '+r.error.message,'err');return;}
  flash('Eliminado','ok');
  setTimeout(()=>window.location.href='/finanzas-personales/',600);
}

function setBusy(b){
  document.getElementById('btn-save-top').disabled=b;
  document.getElementById('btn-save-bottom').disabled=b;
  document.getElementById('btn-save-bottom').textContent=b?'Guardando...':(G_editId?'Guardar cambios':'Guardar');
}
function goBack(){if(document.referrer)history.back();else window.location.href='/finanzas-personales/';}
function flash(msg,type){
  var c={ok:'#22c55e',err:'#ef4444',warn:'#F59E0B'}[type||'ok'];
  var el=document.createElement('div');
  el.style.cssText='display:inline-block;background:#111;border:1px solid '+c+';color:'+c+';padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;pointer-events:none;white-space:nowrap';
  el.textContent=msg;document.getElementById('flash-wrap').appendChild(el);
  setTimeout(()=>el.remove(),2800);
}
</script>
</body>
</html>
