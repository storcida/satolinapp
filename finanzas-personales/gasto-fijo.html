<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PEARS · Gasto Fijo Personal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#000;--s1:#080808;--s2:#111;--border:#1a1a1a;--border2:#2a2a2a;--text:#fff;--muted:#666;--dim:#333;--accent:#8dd900;--err:#ef4444;--font:'Inter',-apple-system,sans-serif;}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;height:52px;background:var(--bg);border-bottom:1px solid var(--border);padding:0 4px}
.tb-back{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:none;background:none;color:var(--muted);cursor:pointer;flex-shrink:0;transition:color 120ms}
.tb-back:hover{color:var(--text)}
.tb-title{flex:1;text-align:center;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:3px}
.tb-save{height:36px;padding:0 16px;background:var(--accent);border:none;border-radius:6px;color:#000;font-size:12px;font-weight:500;font-family:var(--font);cursor:pointer;margin-right:8px;transition:opacity 120ms}
.tb-save:disabled{opacity:.4;cursor:not-allowed}
.body-scroll{padding:0 0 120px;animation:fadeIn 200ms ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.section{border-bottom:1px solid var(--border)}
.section-label{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:3px;color:var(--muted);padding:16px 16px 8px}
.field{padding:0 16px;border-bottom:1px solid var(--border)}
.field-row{display:flex}.field-row .field{flex:1;border-right:1px solid var(--border)}.field-row .field:last-child{border-right:none}
.field-label{display:block;font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted);padding-top:14px;margin-bottom:6px}
.fi,.fs{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:15px;font-weight:300;padding:0 0 14px;outline:none;appearance:none}
.fi::placeholder{color:var(--dim)}.fs option{background:var(--s2)}
.monto-wrap{display:flex;align-items:baseline;gap:6px;padding-bottom:14px}
.monto-prefix{font-size:13px;color:var(--muted)}
.monto-input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:24px;font-weight:200;outline:none;padding:0}
.monto-input::placeholder{color:var(--dim)}
.var-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.toggle-switch{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;background:var(--s2);border:1px solid var(--border2);border-radius:999px;cursor:pointer;transition:background 200ms}
.toggle-switch input:checked+.toggle-track{background:var(--accent);border-color:var(--accent)}
.toggle-thumb{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform 200ms}
.toggle-switch input:checked~.toggle-thumb{transform:translateX(20px)}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.btn-primary{width:100%;padding:15px;background:var(--accent);border:none;border-radius:8px;color:#000;font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-delete{background:none;border:none;color:var(--err);font-family:var(--font);font-size:13px;cursor:pointer;padding:4px 0 8px;text-align:center;width:100%}
#flash-wrap{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
</style>
</head>
<body>
<div class="topbar">
  <button class="tb-back" onclick="goBack()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <span class="tb-title" id="page-title">Nuevo gasto fijo</span>
  <button class="tb-save" id="btn-top" onclick="guardar()" disabled>Guardar</button>
</div>
<div id="flash-wrap"></div>
<div class="body-scroll">

  <div class="section">
    <div class="field">
      <label class="field-label">Título (nombre del botón)</label>
      <input class="fi" id="f-titulo" placeholder="Ej: Club Centenario, Spotify…" oninput="checkReady()">
    </div>
  </div>

  <div class="section">
    <div class="field">
      <label class="field-label">Categoría</label>
      <select class="fs" id="f-cat">
        <option>Supermercado</option><option>Auto</option><option>Salud</option>
        <option>Club/Gym</option><option>Ocio</option><option>Ropa</option>
        <option>Educación</option><option>Farmacia</option><option>Restaurantes</option>
        <option>Transporte</option><option>Viaje</option><option selected>Servicios</option>
        <option>Alquiler</option><option>Ahorro</option><option>Otros</option>
      </select>
    </div>
    <div class="field">
      <label class="field-label">Lugar / Comercio</label>
      <input class="fi" id="f-lugar" placeholder="Ej: Club Centenario, Spotify…" oninput="checkReady()">
    </div>
    <div class="field">
      <label class="field-label">Banco / Método</label>
      <select class="fs" id="f-banco">
        <option value="">—</option>
        <option>Crédito</option><option>Débito</option>
        <option>GNB</option><option>Itaú</option><option>Efectivo</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="var-row">
      <div>
        <div style="font-size:13px;font-weight:300">Monto variable</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">Activá si el monto cambia cada mes</div>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="f-variable" onchange="onVariableChange()">
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
    </div>
    <div class="field" id="monto-field">
      <label class="field-label">Monto fijo (Gs.)</label>
      <div class="monto-wrap">
        <span class="monto-prefix">Gs.</span>
        <input class="monto-input" id="f-monto" type="text" inputmode="numeric" placeholder="0" oninput="fmtMonto(this)">
      </div>
    </div>
  </div>

</div>
<div class="bottom-bar">
  <button class="btn-primary" id="btn-bottom" onclick="guardar()">Guardar</button>
  <button class="btn-delete" id="btn-delete" style="display:none" onclick="eliminar()">Eliminar gasto fijo</button>
</div>

<script>
const G_URL='https://hahhmpvfyrmwnaqxibvt.supabase.co';
const G_KEY='sb_publishable_WTjwtY_ghLdfShnDhkqHUA_u_1Hn762';
var G_sb=null,G_userId=null;
var G_params=new URLSearchParams(location.search);
var G_editId=G_params.get('id')||null;

Auth.onReady(async function(user){
  G_sb=Auth.client();
  G_userId=user.id;
  if(G_editId){
    var r=await G_sb.from('gastos_fijos_personal').select('*').eq('id',G_editId).single();
    if(r.data) populateEdit(r.data);
    document.getElementById('page-title').textContent='Editar gasto fijo';
    document.getElementById('btn-bottom').textContent='Guardar cambios';
    document.getElementById('btn-delete').style.display='block';
  }
  checkReady();
});

function populateEdit(g){
  document.getElementById('f-titulo').value=g.titulo||'';
  document.getElementById('f-cat').value=g.categoria||'Servicios';
  document.getElementById('f-lugar').value=g.lugar||'';
  document.getElementById('f-banco').value=g.banco||'';
  if(!g.monto_fijo){document.getElementById('f-variable').checked=true;onVariableChange();}
  else document.getElementById('f-monto').value=new Intl.NumberFormat('es-PY').format(g.monto_fijo);
}

function onVariableChange(){document.getElementById('monto-field').style.display=document.getElementById('f-variable').checked?'none':'block';}
function fmtMonto(input){var raw=input.value.replace(/\D/g,'');if(raw)input.value=new Intl.NumberFormat('es-PY').format(parseInt(raw));else input.value='';}
function checkReady(){var ok=(document.getElementById('f-titulo').value||'').trim()&&(document.getElementById('f-lugar').value||'').trim();document.getElementById('btn-top').disabled=!ok;document.getElementById('btn-bottom').disabled=!ok;}

async function guardar(){
  var titulo=document.getElementById('f-titulo').value.trim();
  var cat=document.getElementById('f-cat').value;
  var lugar=document.getElementById('f-lugar').value.trim();
  var banco=document.getElementById('f-banco').value||null;
  var isVar=document.getElementById('f-variable').checked;
  var monto=isVar?null:(parseInt((document.getElementById('f-monto').value||'').replace(/\D/g,''))||null);
  if(!titulo||!lugar){flash('Completá título y lugar','warn');return;}
  var payload={titulo,categoria:cat,lugar,banco,monto_fijo:monto};
  var r;
  if(G_editId){r=await G_sb.from('gastos_fijos_personal').update(payload).eq('id',G_editId);}
  else{payload.usuario_id=G_userId;payload.orden=99;r=await G_sb.from('gastos_fijos_personal').insert(payload);}
  if(r.error){flash('Error: '+r.error.message,'err');return;}
  flash(G_editId?'Guardado ✓':'Gasto fijo creado ✓','ok');
  setTimeout(goBack,700);
}

async function eliminar(){
  if(!confirm('Eliminar este gasto fijo?'))return;
  await G_sb.from('gastos_fijos_personal').delete().eq('id',G_editId);
  flash('Eliminado','ok');
  setTimeout(function(){window.location.href='/finanzas-personales/';},600);
}

function goBack(){if(document.referrer)history.back();else window.location.href='/finanzas-personales/';}
function flash(msg,type){var c={ok:'#22c55e',err:'#ef4444',warn:'#F59E0B'}[type||'ok'];var el=document.createElement('div');el.style.cssText='display:inline-block;background:#111;border:1px solid '+c+';color:'+c+';padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;pointer-events:none;white-space:nowrap';el.textContent=msg;document.getElementById('flash-wrap').appendChild(el);setTimeout(function(){el.remove();},2800);}
</script>
</body>
</html>
