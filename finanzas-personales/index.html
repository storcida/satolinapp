<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/pears-icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/pears-icon-32.png">
  <link rel="apple-touch-icon" href="/icon-apple-180.png">
  <link rel="manifest" href="/manifest.json">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PEARS · Personal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/logger.js"></script>

<script src="../shared/header.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Rock+Salt&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--s1:#080808;--s2:#111;--s3:#161616;
  --border:#1a1a1a;--border2:#2a2a2a;
  --text:#fff;--muted:#666;--dim:#333;
  --accent:#8dd900;--ok:#22c55e;--err:#ef4444;--warn:#F59E0B;
  --font:"Inter",-apple-system,sans-serif;
  --mono:"SF Mono","Fira Code",monospace;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100dvh;-webkit-font-smoothing:antialiased}
.h2{position:sticky;top:48px;z-index:99;background:var(--bg);border-bottom:1px solid var(--border)}
.breadcrumb{display:flex;align-items:center;gap:6px;padding:8px 14px 0;font-size:11px;color:var(--muted)}
.breadcrumb a{color:var(--muted);text-decoration:none}.breadcrumb a:hover{color:var(--text)}
.breadcrumb span{color:var(--text);font-weight:500}
.tabs{display:flex;padding:0 12px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--border)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 8px 9px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:2px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;transition:color 120ms,border-color 120ms;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font);white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab-panel{display:none}.tab-panel.active{display:block}
.month-nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px;border-bottom:1px solid var(--border)}
.month-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:color 120ms;border-radius:4px}
.month-btn:hover{color:var(--text)}
.month-label{font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase;min-width:120px;text-align:center;cursor:pointer}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.kpi-card{background:var(--bg);padding:16px}
.kpi-label{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted);margin-bottom:8px}
.kpi-value{font-size:22px;font-weight:200;letter-spacing:-0.5px}
.kpi-sub{font-size:10px;color:var(--muted);margin-top:4px}
.chart-section{padding:16px;border-bottom:1px solid var(--border)}
.chart-title{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:3px;color:var(--muted);margin-bottom:14px}
.chart-wrap{position:relative;height:200px}
.chart-tabs{display:flex;gap:1px;background:var(--border);margin-bottom:14px}
.chart-tab{flex:1;padding:8px;background:var(--s1);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);border:none;cursor:pointer;font-family:var(--font);transition:all 120ms;border-bottom:2px solid transparent}
.chart-tab.active{background:var(--bg);color:var(--text);border-bottom-color:var(--accent)}
.mov-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)}
.mov-cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mov-body{flex:1;min-width:0}
.mov-concept{font-size:14px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov-meta{font-size:11px;color:var(--muted);margin-top:2px}
.mov-right{text-align:right;flex-shrink:0}
.mov-amount{font-size:14px;font-weight:400}
.mov-amount.egreso{color:var(--text)}
.mov-amount.ingreso{color:var(--accent)}
.mov-actions{display:flex;gap:4px;flex-shrink:0}
.mov-action-btn{width:30px;height:30px;border:none;background:none;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:color 120ms}
.mov-action-btn:hover{color:var(--text)}
.mov-action-btn.del:hover{color:var(--err)}
.empty{padding:48px 16px;text-align:center;color:var(--muted);font-size:13px}
.fab{position:fixed;bottom:24px;right:20px;width:52px;height:52px;background:var(--accent);border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:50;transition:transform 120ms;box-shadow:0 4px 20px rgba(141,217,0,.25)}
.fab:active{transform:scale(.92)}
.cal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;align-items:flex-end;justify-content:center}
.cal-overlay.open{display:flex}
.cal-box{width:min(480px,100%);background:#0d0d0d;border:1px solid var(--border2);border-radius:16px 16px 0 0;padding:20px 16px 32px}
.cal-year-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.cal-months-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cal-month-btn{padding:10px 4px;border-radius:6px;border:1px solid var(--border2);background:var(--s1);color:var(--muted);font-family:var(--font);font-size:12px;cursor:pointer;transition:all 120ms}
.cal-month-btn.active{background:var(--accent);border-color:var(--accent);color:#000}
#flash-wrap{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
</style>
</head>
<body>
<header id="pears-h1">
  <span id="pears-h1-logo">PEARS</span>
  <div id="pears-avatar" onclick="PearsHeader.toggle()"><span id="pears-avatar-initial">S</span></div>
</header>
<div id="pears-menu-overlay" class="pm-overlay" onclick="PearsHeader.close()"></div>
<nav id="pears-menu" class="pm-panel">
  <div class="pm-header">
    <div class="pm-avatar-lg" id="pm-avatar-lg"></div>
    <div class="pm-name" id="pm-name">-</div>
    <div class="pm-email" id="pm-email">-</div>
  </div>
  <div class="pm-links">
    <a class="pm-link" href="../compras/">Compras</a>
    <a class="pm-link" href="../finanzas/">Hogar</a>
    <a class="pm-link" href="../viajes/">Viajes</a>
    <a class="pm-link" href="../prestamos/">Prestamos</a>
    <a class="pm-link pm-active" data-module="personal" href="../finanzas-personales/">Personal</a>
    <a class="pm-link" href="../configuracion/">Configuracion</a>
  </div>
  <button class="pm-logout" onclick="typeof Auth!=='undefined'?Auth.logout():(window.location.href='/')">Cerrar sesion</button>
</nav>
<div class="h2">
  <div class="breadcrumb">
    <a href="/">Inicio</a>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    <span id="bc-current">Personal</span>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab(this,'tablero','Tablero')">Tablero</button>
    <button class="tab"        onclick="switchTab(this,'ledger','Movimientos')">Movimientos</button>
    <button class="tab"        onclick="switchTab(this,'gastos-fijos','Gastos Fijos')">Gastos Fijos</button>
  </div>
</div>
<div id="flash-wrap"></div>
<div class="content" style="padding-bottom:80px">
  <div id="panel-tablero" class="tab-panel active">
    <div class="month-nav">
      <button class="month-btn" onclick="navGo(-1)">&#8249;</button>
      <span class="month-label" id="month-label" onclick="openCal()">-</span>
      <button class="month-btn" onclick="navGo(1)">&#8250;</button>
    </div>
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Gastos del mes</div>
        <div class="kpi-value" id="kpi-egresos">-</div>
        <div class="kpi-sub">Gs.</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Ingresos del mes</div>
        <div class="kpi-value" id="kpi-ingresos" style="color:var(--accent)">-</div>
        <div class="kpi-sub">Gs.</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Balance</div>
        <div class="kpi-value" id="kpi-balance">-</div>
        <div class="kpi-sub" id="kpi-balance-sub">Gs.</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Movimientos</div>
        <div class="kpi-value" id="kpi-count">-</div>
        <div class="kpi-sub">este mes</div>
      </div>
    </div>
    <div class="chart-section">
      <div class="chart-tabs">
        <button class="chart-tab active" onclick="showChart(this,'pie')">Por categoria</button>
        <button class="chart-tab" onclick="showChart(this,'bar')">Por mes</button>
      </div>
      <div class="chart-wrap">
        <canvas id="chart-pie"></canvas>
        <canvas id="chart-bar" style="display:none"></canvas>
      </div>
    </div>
    <div id="cats-list" style="padding-bottom:8px"></div>
  </div>
  <div id="panel-ledger" class="tab-panel">
    <div class="month-nav">
      <button class="month-btn" onclick="navGo(-1)">&#8249;</button>
      <span class="month-label" id="month-label-led" onclick="openCal()" style="cursor:pointer">-</span>
      <button class="month-btn" onclick="navGo(1)">&#8250;</button>
    </div>
    <div id="gf-chips-section" style="display:none;border-bottom:1px solid var(--border)">
      <div style="font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:3px;color:var(--muted);padding:12px 16px 8px">Gastos fijos</div>
      <div id="gf-chips" style="display:flex;gap:1px;background:var(--border);overflow-x:auto;scrollbar-width:none"></div>
    </div>
    <div id="mov-list"></div>
  </div>
  <!-- GASTOS FIJOS -->
  <div id="panel-gastos-fijos" class="tab-panel">
    <div id="gf-list" style="padding-bottom:80px"></div>
  </div>

</div>
<button class="fab" id="main-fab" onclick="fabAction()">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>
<div class="cal-overlay" id="cal-overlay" onclick="if(event.target===this)closeCal()">
  <div class="cal-box">
    <div class="cal-year-row">
      <button class="month-btn" onclick="calShift(-1)">&#8249;</button>
      <span id="cal-year" style="font-size:14px;font-weight:500;letter-spacing:2px"></span>
      <button class="month-btn" onclick="calShift(1)">&#8250;</button>
    </div>
    <div class="cal-months-grid" id="cal-grid"></div>
    <button onclick="closeCal()" style="margin-top:16px;width:100%;padding:11px;background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--muted);font-family:var(--font);font-size:13px;cursor:pointer">Cancelar</button>
  </div>
</div>
<script>
const G_URL='https://hahhmpvfyrmwnaqxibvt.supabase.co';
const G_KEY='sb_publishable_WTjwtY_ghLdfShnDhkqHUA_u_1Hn762';
const MONTHS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MONTHS_FULL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const FMT=n=>new Intl.NumberFormat('es-PY').format(Math.round(n||0));
const CAT_COLORS={'Supermercado':'#8dd900','Auto':'#6fa800','Salud':'#5a8c00','Club/Gym':'#4d7a00','Ocio':'#c8f060','Ropa':'#a8d420','Educacion':'#3d6200','Farmacia':'#b4e040','Restaurantes':'#7dc200','Transporte':'#8dc63f','Viaje':'#d4f07a','Servicios':'#4a4a4a','Ahorro':'#2a6600','Ingresos':'#8dd900','Otros':'#333333'};
function catColor(c){return CAT_COLORS[c]||'#444';}
var G_sb,G_hh,G_userId,G_nombre,G_month='',G_rows=[],G_calYear=new Date().getFullYear(),G_chartPie=null,G_chartBar=null;
Auth.onReady(async function(user){
  if(window.Logger)Logger.init('personal');
  G_sb=Auth.client();
  G_nombre=user.nombre_corto||user.nombre;
  G_userId=user.id;
  G_hh=user.household_id;
  PearsHeader.init('personal');
  var now=new Date();
  G_month=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  await loadMonth(G_month);
  await loadGF();
});
async function loadMonth(month){
  G_month=month;
  var mo=parseInt(month.slice(5,7)),yr=month.slice(0,4);
  var label=MONTHS_FULL[mo-1]+' '+yr;
  document.getElementById('month-label').textContent=label.toUpperCase();
  document.getElementById('month-label-led').textContent=label.toUpperCase();
  var r=await G_sb.from('finanzas_personales').select('*').eq('household_id',G_hh).eq('month',month).eq('usuario',G_nombre).order('fecha',{ascending:false});
  G_rows=r.data||[];
  renderTablero();
  renderLedger();
}
async function load6Months(){
  var months=[],d=new Date(G_month+'-01');
  for(var i=5;i>=0;i--){var dd=new Date(d.getFullYear(),d.getMonth()-i,1);months.push(dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0'));}
  var r=await G_sb.from('finanzas_personales').select('month,tipo,monto').eq('household_id',G_hh).eq('usuario',G_nombre).in('month',months);
  return{months,data:r.data||[]};
}
function renderTablero(){
  var egresos=G_rows.filter(r=>r.tipo==='egreso').reduce((s,r)=>s+Number(r.monto||0),0);
  var ingresos=G_rows.filter(r=>r.tipo==='ingreso').reduce((s,r)=>s+Number(r.monto||0),0);
  var balance=ingresos-egresos;
  document.getElementById('kpi-egresos').textContent=FMT(egresos);
  document.getElementById('kpi-ingresos').textContent=FMT(ingresos);
  document.getElementById('kpi-balance').textContent=FMT(Math.abs(balance));
  document.getElementById('kpi-balance').style.color=balance>=0?'var(--accent)':'var(--err)';
  document.getElementById('kpi-balance-sub').textContent=balance>=0?'Gs. superavit':'Gs. deficit';
  document.getElementById('kpi-count').textContent=G_rows.length;
  renderPieChart();renderCatsList();
}
function renderPieChart(){
  var cats={};
  G_rows.filter(r=>r.tipo==='egreso').forEach(r=>{cats[r.categoria]=(cats[r.categoria]||0)+Number(r.monto||0);});
  var sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  if(!sorted.length)return;
  var labels=sorted.map(e=>e[0]),data=sorted.map(e=>e[1]),colors=sorted.map(e=>catColor(e[0]));
  if(G_chartPie)G_chartPie.destroy();
  G_chartPie=new Chart(document.getElementById('chart-pie'),{
    type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0,hoverOffset:4}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' Gs. '+FMT(c.raw)+' ('+Math.round(c.raw/c.dataset.data.reduce((a,b)=>a+b,0)*100)+'%)'},backgroundColor:'#111',borderColor:'#2a2a2a',borderWidth:1,titleColor:'#fff',bodyColor:'#aaa'}}}
  });
}
async function renderBarChart(){
  var{months,data}=await load6Months();
  var egresos=months.map(m=>data.filter(r=>r.month===m&&r.tipo==='egreso').reduce((s,r)=>s+Number(r.monto||0),0));
  var ingresos=months.map(m=>data.filter(r=>r.month===m&&r.tipo==='ingreso').reduce((s,r)=>s+Number(r.monto||0),0));
  var labels=months.map(m=>MONTHS[parseInt(m.slice(5,7))-1]);
  if(G_chartBar)G_chartBar.destroy();
  G_chartBar=new Chart(document.getElementById('chart-bar'),{
    type:'bar',
    data:{labels,datasets:[{label:'Egresos',data:egresos,backgroundColor:'rgba(141,217,0,.7)',borderRadius:3},{label:'Ingresos',data:ingresos,backgroundColor:'rgba(141,217,0,.25)',borderRadius:3}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' Gs. '+FMT(c.raw)},backgroundColor:'#111',borderColor:'#2a2a2a',borderWidth:1,titleColor:'#fff',bodyColor:'#aaa'}},scales:{x:{grid:{color:'rgba(255,255,255,.05)'},ticks:{color:'#666',font:{size:11}}},y:{grid:{color:'rgba(255,255,255,.05)'},ticks:{color:'#666',font:{size:10},callback:v=>'Gs.'+FMT(v/1000000)+'M'}}}}
  });
}
function renderCatsList(){
  var cats={},total=0;
  G_rows.filter(r=>r.tipo==='egreso').forEach(r=>{var m=Number(r.monto||0);cats[r.categoria]=(cats[r.categoria]||0)+m;total+=m;});
  var sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(!sorted.length){document.getElementById('cats-list').innerHTML='';return;}
  var html='<div style="padding:12px 16px 4px"><div style="font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:3px;color:var(--muted);margin-bottom:10px">Top categorias</div>';
  sorted.forEach(e=>{
    var pct=Math.round(e[1]/total*100),color=catColor(e[0]);
    html+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:13px;font-weight:300">'+e[0]+'</span><span style="font-size:12px;color:var(--muted)">Gs. '+FMT(e[1])+'  <span style="color:'+color+'">'+pct+'%</span></span></div><div style="height:2px;background:var(--border);border-radius:2px"><div style="height:2px;background:'+color+';border-radius:2px;width:'+pct+'%"></div></div></div>';
  });
  html+='</div>';
  document.getElementById('cats-list').innerHTML=html;
}
function renderLedger(){
  var el=document.getElementById('mov-list');
  if(!G_rows.length){el.innerHTML='<div class="empty">Sin movimientos este mes</div>';return;}
  var iE='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>';
  var iT='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
  el.innerHTML=G_rows.map(t=>{
    var sign=t.tipo==='ingreso'?'+':'−',color=catColor(t.categoria);
    var fmtD=new Date(t.fecha+'T00:00:00').toLocaleDateString('es-PY',{day:'2-digit',month:'short'});
    return '<div class="mov-item"><div class="mov-cat-dot" style="background:'+color+'"></div><div class="mov-body"><div class="mov-concept">'+ESC(t.concepto||t.categoria)+'</div><div class="mov-meta">'+ESC(t.categoria)+' · '+fmtD+'</div></div><div class="mov-right"><div class="mov-amount '+t.tipo+'">'+sign+' Gs. '+FMT(t.monto)+'</div></div><div class="mov-actions"><button class="mov-action-btn" data-id="'+t.id+'" onclick="editMov(this.dataset.id)" title="Editar">'+iE+'</button><button class="mov-action-btn del" data-id="'+t.id+'" onclick="delMov(this.dataset.id)" title="Eliminar">'+iT+'</button></div></div>';
  }).join('');
}
function editMov(id){window.location.href='mov.html?id='+id;}
async function delMov(id){
  if(!confirm('Eliminar este movimiento?'))return;
  var r=await G_sb.from('finanzas_personales').delete().eq('id',id);
  if(r.error){flash('Error: '+r.error.message,'err');return;}
  flash('Eliminado','ok');await loadMonth(G_month);
}
function showChart(btn,type){
  document.querySelectorAll('.chart-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('chart-pie').style.display=type==='pie'?'block':'none';
  document.getElementById('chart-bar').style.display=type==='bar'?'block':'none';
  if(type==='bar')renderBarChart();
}
function navGo(dir){
  var[yr,mo]=G_month.split('-').map(Number);
  mo+=dir;if(mo>12){mo=1;yr++;}if(mo<1){mo=12;yr--;}
  loadMonth(yr+'-'+String(mo).padStart(2,'0'));
}
function openCal(){G_calYear=parseInt(G_month.slice(0,4));renderCal();document.getElementById('cal-overlay').classList.add('open');}
function closeCal(){document.getElementById('cal-overlay').classList.remove('open');}
function calShift(d){G_calYear+=d;renderCal();}
function renderCal(){
  document.getElementById('cal-year').textContent=G_calYear;
  var curMo=parseInt(G_month.slice(5,7)),curYr=parseInt(G_month.slice(0,4));
  document.getElementById('cal-grid').innerHTML=MONTHS.map((m,i)=>'<button class="cal-month-btn'+(G_calYear===curYr&&i+1===curMo?' active':'')+'" onclick="pickMonth('+G_calYear+','+(i+1)+')">'+m+'</button>').join('');
}
function pickMonth(yr,mo){closeCal();loadMonth(yr+'-'+String(mo).padStart(2,'0'));}
// ── GASTOS FIJOS PERSONAL ────────────────────────────
var G_gf = [], G_activeTab2 = 'dashboard';

async function loadGF() {
  var r = await G_sb.from('gastos_fijos_personal')
    .select('*').eq('usuario_id', G_userId).eq('activo',true).order('orden');
  G_gf = r.data || [];
  renderGFList();
  renderGFChips();
}

function renderGFChips() {
  var sec = document.getElementById('gf-chips-section');
  if (!sec || !G_gf.length) { if(sec) sec.style.display='none'; return; }
  sec.style.display = 'block';
  sec.querySelector('#gf-chips').innerHTML = G_gf.map(function(g){
    var ml = g.monto_fijo ? 'Gs. '+FMT(g.monto_fijo) : 'Variable';
    return '<button class="gf-chip" data-id="'+g.id+'" onclick="registrarGF(this.dataset.id)">'+
      '<span class="gf-chip-title">'+ESC(g.titulo)+'</span>'+
      '<span class="gf-chip-monto">'+ml+'</span></button>';
  }).join('');
}

function renderGFList() {
  var el = document.getElementById('gf-list');
  if (!G_gf.length) { el.innerHTML='<div class="empty">Sin gastos fijos.<br>Usá + para agregar uno.</div>'; return; }
  var iE = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>';
  var iT = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
  el.innerHTML = G_gf.map(function(g){
    var ml = g.monto_fijo ? 'Gs. '+FMT(g.monto_fijo) : 'Variable';
    var mc = g.monto_fijo ? '' : 'color:var(--muted);font-size:11px';
    return '<div class="mov-item">'+
      '<div class="mov-cat-dot" style="background:'+catColor(g.categoria)+'"></div>'+
      '<div class="mov-body">'+
        '<div class="mov-concept">'+ESC(g.titulo)+'</div>'+
        '<div class="mov-meta">'+ESC(g.categoria)+(g.banco?' · '+ESC(g.banco):'')+'</div>'+
      '</div>'+
      '<div class="mov-right"><div class="mov-amount" style="'+mc+'">'+ml+'</div></div>'+
      '<div class="mov-actions">'+
        '<button class="mov-action-btn" data-id="'+g.id+'" onclick="window.location.href=\'gasto-fijo.html?id=\'+this.dataset.id" title="Editar">'+iE+'</button>'+
        '<button class="mov-action-btn del" data-id="'+g.id+'" onclick="deleteGF(this.dataset.id)" title="Eliminar">'+iT+'</button>'+
      '</div></div>';
  }).join('');

  // Total fijo
  var totalFijo = G_gf.filter(function(g){ return g.monto_fijo; }).reduce(function(s,g){ return s+Number(g.monto_fijo); },0);
  el.innerHTML += '<div style="padding:14px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">'+
    '<span style="font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted)">Piso mensual fijo</span>'+
    '<span style="font-size:16px;font-weight:300;color:var(--accent)">Gs. '+FMT(totalFijo)+'</span></div>';
}

async function registrarGF(id) {
  var g = G_gf.find(function(x){ return x.id===id; });
  if (!g) return;
  if (g.monto_fijo) {
    if (!confirm('Registrar "'+g.titulo+'" por Gs. '+FMT(g.monto_fijo)+'?')) return;
    var hoy = new Date().toISOString().slice(0,10);
    var r = await G_sb.from('finanzas_personales').insert({
      tipo:'egreso', monto:g.monto_fijo, fecha:hoy, month:hoy.slice(0,7),
      categoria:g.categoria, concepto:g.titulo, banco:g.banco||null,
      notas:'Gasto fijo', usuario:G_nombre, household_id:G_hh,
      updated_at:new Date().toISOString()
    });
    if (r.error) { flash('Error: '+r.error.message,'err'); return; }
    flash(g.titulo+' registrado ✓','ok');
    await loadMonth(G_month);
  } else {
    var p = new URLSearchParams({new:'1',lugar:g.lugar||g.titulo,categoria:g.categoria,banco:g.banco||'',titulo:g.titulo});
    window.location.href = 'mov.html?'+p.toString();
  }
}

async function deleteGF(id) {
  var g = G_gf.find(function(x){ return x.id===id; });
  if (!g || !confirm('Eliminar "'+g.titulo+'"?')) return;
  await G_sb.from('gastos_fijos_personal').delete().eq('id',id);
  flash('Eliminado','ok');
  await loadGF();
}

function fabAction() {
  if (G_activeTab2 === 'gastos-fijos') window.location.href = 'gasto-fijo.html?new=1';
  else window.location.href = 'mov.html?new=1';
}

function switchTab(btn,panel,label){
  G_activeTab2 = panel;
  var tabs=document.querySelectorAll('.tabs .tab');
  var panels=document.querySelectorAll('.content .tab-panel');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.remove('active');
  for(var i=0;i<panels.length;i++) panels[i].classList.remove('active');
  btn.classList.add('active');
  document.getElementById('panel-'+panel).classList.add('active');
  document.getElementById('bc-current').textContent=label;
}
function ESC(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function flash(msg,type){
  var c={ok:'#22c55e',err:'#ef4444',warn:'#F59E0B'}[type||'ok'];
  var el=document.createElement('div');
  el.style.cssText='display:inline-block;background:#111;border:1px solid '+c+';color:'+c+';padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;pointer-events:none;white-space:nowrap';
  el.textContent=msg;document.getElementById('flash-wrap').appendChild(el);
  setTimeout(()=>el.remove(),2800);
}
</script>
</body>
</html>
