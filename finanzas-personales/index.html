<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PEARS · Personal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/pears.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #fff; color: #000; min-height: 100dvh; }
#app { display: none; }
header {
  position: sticky; top: 0; background: #fff; border-bottom: 1px solid #e5e5e5;
  padding: 12px 16px; display: flex; align-items: center; gap: 12px; z-index: 50;
}
.back-btn {
  padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px;
  text-decoration: none; color: #333; font-size: 13px; flex-shrink: 0;
}
.back-btn:hover { background: #f5f5f5; }
.header-title { flex: 1; font-size: 15px; font-weight: 500; }
.avatar-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ddd;
  background: #f0f0f0; cursor: pointer; overflow: hidden;
  display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0;
}
main { padding: 24px 16px; max-width: 480px; margin: 0 auto; }
h1 { font-size: 22px; font-weight: 400; margin-bottom: 8px; }
p  { font-size: 14px; color: #666; }
.wip { margin-top: 32px; padding: 16px; border: 1px dashed #ccc; border-radius: 6px; font-size: 13px; color: #999; }
</style>
</head>
<body>

<div id="app">
  <header>
    <a class="back-btn" href="/">← Home</a>
    <span class="header-title">Personal</span>
    <div class="avatar-btn" id="pears-avatar" onclick="PEARS.menuToggle()"></div>
  </header>
  <main>
    <h1>Personal</h1>
    <p>Finanzas personales</p>
    <div class="wip">Módulo en construcción</div>
  </main>
</div>

<script>
PEARS.init('personal');
</script>
</body>
</html>
